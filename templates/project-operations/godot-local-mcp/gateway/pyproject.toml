[project]
name = "base-godot-local-mcp"
version = "0.1.0"
description = "Focused local stdio MCP Gateway for bounded Godot editor operations"
requires-python = "==3.12.*"
dependencies = [
  "jsonschema==4.26.0",
  "mcp==2.0.0",
]

[project.scripts]
base-godot-mcp = "base_godot_mcp.__main__:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
