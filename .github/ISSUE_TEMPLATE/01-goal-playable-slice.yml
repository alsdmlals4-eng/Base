name: Goal / Playable Slice
description: 승인된 Goal 또는 플레이 가능한 Slice의 범위·가치·완료 기준과 하위 작업을 추적합니다.
title: "[Goal/Slice] "
body:
  - type: markdown
    attributes:
      value: |
        이 Issue는 지속 가능한 Goal work item입니다. 프로젝트 기획·결정·데이터·코드·Scene·Resource·승인 asset·test·runtime evidence의 정본은 현재 repository owner에 유지합니다.

        `CHECKLIST_IS_DERIVED_OPERATIONAL_VIEW_NOT_CANON` · `PROJECTS_DERIVED_VIEW_NOT_CANON`

        새 항목을 만들기 전에 같은 Goal의 기존 Issue·PR을 검색합니다. GitHub Projects 보드나 sub-issue 관계를 현재 도구로 확인하지 못하면 구성됐다고 추측하지 않습니다.

  - type: input
    id: project
    attributes:
      label: 프로젝트
      description: 정확한 repository 또는 프로젝트 식별자를 적습니다.
      placeholder: alsdmlals4-eng/PROJECT
    validations:
      required: true

  - type: textarea
    id: player_or_user_value
    attributes:
      label: 플레이어·사용자 가치
      description: 이 Goal을 완료하면 누가 무엇을 할 수 있고 어떤 결과·감정을 얻는지 적습니다.
      placeholder: 대표 행동 → 의미 있는 선택 → 관찰 가능한 결과 → 보상·실패 학습
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 승인 범위·제외 범위·보호 범위
      description: 포함 범위, 제외 범위, 유지해야 할 기존 의미·동작·경로를 구분합니다.
      placeholder: |
        포함:
        -
        제외:
        -
        보호:
        -
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: 각 항목을 조건 → 행동 → 관찰 결과 → 필요한 증거로 작성합니다.
      placeholder: |
        - [ ] AC-01 —
        - [ ] AC-02 —
    validations:
      required: true

  - type: textarea
    id: canon_owner
    attributes:
      label: 정본·실제 소비처·기준 SHA
      description: AGENTS/Decision/spec/data/code/asset/test owner와 actual consumer, 기준 branch·SHA를 적습니다.
      placeholder: |
        canon owner:
        actual consumers:
        source main SHA:
        active context / handoff:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 필수 검증·증거 상한
      description: E0–E6 중 필요한 수준, 실행 방법, 현재 NOT_RUN·BLOCKED 상태를 적습니다.
      placeholder: |
        required evidence:
        - E0_CONTRACT
        - E2_TEST
        - E3_RUNTIME
        evidence ceiling:
        current evidence:
    validations:
      required: true

  - type: textarea
    id: work_items
    attributes:
      label: 독립 작업·의존성·현재 진행
      description: 별도 실행·차단·검증이 필요한 작업만 나눕니다. 작은 절차는 카드 내부 체크리스트로 유지합니다.
      placeholder: |
        work item refs:
        dependencies:
        current active item:
        blocked / decision items:
        next action:
    validations:
      required: false

  - type: checkboxes
    id: safeguards
    attributes:
      label: 운영 경계 확인
      options:
        - label: 같은 Goal의 기존 Issue·PR을 먼저 검색했다.
          required: true
        - label: 체크리스트·Projects 보드를 프로젝트 정본으로 사용하지 않는다.
          required: true
        - label: 문서·테스트 PASS를 runtime·UX·Human/Player PASS로 과장하지 않는다.
          required: true
