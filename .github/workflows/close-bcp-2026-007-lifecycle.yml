name: Close BCP 2026 007 Lifecycle

on:
  push:
    branches:
      - agent/close-bcp-2026-007-lifecycle

permissions:
  contents: write

jobs:
  close-lifecycle:
    if: "${{ github.event.head_commit.message == 'chore: close BCP-2026-007 lifecycle' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          show-progress: false
      - name: Promote lifecycle and verify
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/close_bcp_2026_007.py
          rm .github/workflows/close-bcp-2026-007-lifecycle.yml
          rm tools/close_bcp_2026_007.py
          git add -A
          git commit -m "docs: close Cloud Run and entitlement BCP lifecycle"
          python tools/check_base_change_proposals.py
          python -m unittest \
            tests.test_cloud_run_game_backend_capability \
            tests.test_game_entitlement_integrity_drm_capability -v
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 2
          git push origin HEAD:agent/close-bcp-2026-007-lifecycle
