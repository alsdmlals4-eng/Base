name: One-time confirmed decision sync patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.event.pull_request.head.ref == 'agent/confirmed-decision-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/confirmed-decision-sync
          fetch-depth: 0
      - name: Patch coupled canon files
        run: python .github/scripts/patch_confirmed_decision_sync.py
      - name: Remove temporary patch files
        run: git rm .github/scripts/patch_confirmed_decision_sync.py .github/workflows/one-time-confirmed-decision-sync.yml
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SKILL_REGISTRY.json skills/SKILL_LEARNING_LOG.md \
            tests/test_consolidated_skill_references.py docs/DOCUMENTATION_MAP.md \
            templates/project-operations/README.md docs/CHANGELOG.md
          git commit -m "docs: synchronize decision policy registry and references"
          git push origin HEAD:agent/confirmed-decision-sync
