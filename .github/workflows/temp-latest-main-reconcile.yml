name: Temporary latest-main reconciliation

on:
  push:
    branches:
      - work/video-ai-terms-absorption-20260901

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/video-ai-terms-absorption-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify latest-main overlap and merge without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          merge_base="$(git merge-base HEAD origin/main)"
          git diff --name-only "$merge_base"...HEAD | sort -u > /tmp/task-paths.txt
          git diff --name-only "$merge_base"...origin/main | sort -u > /tmp/main-paths.txt
          grep -v '^\.github/workflows/temp-latest-main-reconcile\.yml$' /tmp/task-paths.txt > /tmp/task-paths.filtered.txt || true
          overlap="$(comm -12 /tmp/task-paths.filtered.txt /tmp/main-paths.txt || true)"
          if [ -n "$overlap" ]; then
            printf 'Latest-main path overlap requires manual reconciliation:\n%s\n' "$overlap"
            exit 1
          fi

          git rm .github/workflows/temp-latest-main-reconcile.yml
          git commit -m 'chore(ci): remove temporary main reconciliation workflow'
          git merge --no-ff origin/main -m 'chore: reconcile latest completed main'
          git merge-base --is-ancestor origin/main HEAD

      - name: Verify reconciled exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_ai_solution_layer_selection_contract \
            tests.test_p08_ai_operations_contract \
            tests.test_public_video_research_ingest \
            tests.test_skill_implementation_evidence \
            -v
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base origin/main \
            --head HEAD
          python tools/build_skill_implementation_evidence.py --check
          python -m py_compile \
            tests/test_ai_solution_layer_selection_contract.py \
            tests/test_p08_ai_operations_contract.py
          git diff --check origin/main...HEAD
          test ! -e .github/workflows/temp-latest-main-reconcile.yml

      - name: Push reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/video-ai-terms-absorption-20260901
