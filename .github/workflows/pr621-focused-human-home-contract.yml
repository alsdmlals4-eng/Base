name: PR621 Focused Human Home Contract

on:
  pull_request:
    paths:
      - "tests/test_p09_narrative_world_knowledge_contract.py"
      - "docs/coordination/2026-08-24_PR621_HUMAN_HOME_CONFLICT_CORRECTION.md"
      - ".github/workflows/pr621-focused-human-home-contract.yml"

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run PR621 focused contract
        run: |
          python - <<'PY'
          from tests.test_p09_narrative_world_knowledge_contract import (
              test_narrative_world_knowledge_model_contract,
              test_knowledge_model_is_routed_from_knowledge_readme,
              test_summary_first_narrative_ux_respects_human_home_owner,
          )
          test_narrative_world_knowledge_model_contract()
          test_knowledge_model_is_routed_from_knowledge_readme()
          test_summary_first_narrative_ux_respects_human_home_owner()
          PY
