name: Temporary public video transcript probe

on:
  push:
    branches:
      - work/video-ai-terms-absorption-20260901

permissions:
  contents: read

jobs:
  fetch-public-transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public metadata and transcript candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          video_id='N3st1ZrB_zc'
          video_url="https://www.youtube.com/watch?v=${video_id}"

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            "https://www.youtube.com/oembed?url=${video_url}&format=json" \
            -o probe/youtube-oembed.json || true

          endpoints=(
            "https://yt-transcript.net/${video_id}"
            "https://api.freetranscriptapi.com/v1/transcript?video_url=${video_id}"
            "https://tubetext.vercel.app/youtube/transcript-with-timestamps?video_id=${video_id}"
          )

          index=0
          for endpoint in "${endpoints[@]}"; do
            index=$((index + 1))
            output="probe/transcript-${index}.json"
            status="probe/transcript-${index}.status"
            http_code="$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 2 \
              --output "${output}" --write-out '%{http_code}' \
              "${endpoint}" || true)"
            printf '%s\n' "${http_code}" > "${status}"
          done

          demo_key_json="$(curl --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            'https://youtube2text.org/api/demo-key' || true)"
          printf '%s' "${demo_key_json}" > probe/youtube2text-demo-key-response.json
          demo_key="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('probe/youtube2text-demo-key-response.json')
          try:
              value = json.loads(p.read_text(encoding='utf-8')).get('apiKey', '')
          except Exception:
              value = ''
          print(value)
          PY
          )"
          if [[ -n "${demo_key}" ]]; then
            curl --location --silent --show-error \
              --connect-timeout 15 --max-time 90 \
              --retry 2 --retry-delay 2 \
              --header "x-api-key: ${demo_key}" \
              --get 'https://youtube2text.org/api/transcribe' \
              --data-urlencode "url=${video_url}" \
              --data-urlencode 'maxChars=100000' \
              -o probe/transcript-4.json || true
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('probe')
          report = []
          selected = None

          def transcript_size(value):
              if isinstance(value, str):
                  return len(value.strip())
              if isinstance(value, list):
                  return sum(len(str(item.get('text', ''))) if isinstance(item, dict) else len(str(item)) for item in value)
              if isinstance(value, dict):
                  best = 0
                  for key in ('transcript', 'subtitles', 'segments', 'full_text', 'text', 'data'):
                      if key in value:
                          best = max(best, transcript_size(value[key]))
                  return best
              return 0

          for path in sorted(root.glob('transcript-*.json')):
              raw = path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''
              try:
                  payload = json.loads(raw)
                  size = transcript_size(payload)
                  valid_json = True
              except Exception as exc:
                  payload = None
                  size = 0
                  valid_json = False
                  report.append({'file': path.name, 'valid_json': False, 'chars': 0, 'error': type(exc).__name__})
                  continue
              report.append({'file': path.name, 'valid_json': valid_json, 'chars': size})
              if selected is None and size >= 200:
                  selected = path

          (root / 'probe-summary.json').write_text(
              json.dumps({'candidates': report, 'selected': selected.name if selected else None}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          if selected is None:
              raise SystemExit('No transcript candidate contained enough text')
          (root / 'selected-transcript.json').write_bytes(selected.read_bytes())
          print((root / 'probe-summary.json').read_text(encoding='utf-8'))
          PY

      - name: Upload bounded probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-video-transcript-probe
          path: probe/
          if-no-files-found: error
          retention-days: 1
