name: One-time confirmed decision integration follow-up

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.event.pull_request.head.ref == 'agent/confirmed-decision-sync-followup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/confirmed-decision-sync-followup
          fetch-depth: 0
      - name: Patch integration follow-up
        run: python .github/scripts/patch_confirmed_decision_integration_followup.py
      - name: Remove temporary patch files
        run: git rm .github/scripts/patch_confirmed_decision_integration_followup.py .github/workflows/one-time-confirmed-decision-integration-followup.yml
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOCUMENTATION_MAP.md \
            docs/superpowers/plans/2026-07-28-confirmed-decision-sync.md \
            skills/SKILL_REGISTRY.json skills/SKILL_LEARNING_LOG.md \
            skills/managing-project-intake-and-work-contract/SKILL.md \
            skills/managing-game-project-operating-system/SKILL.md \
            tests/test_consolidated_skill_references.py
          git commit -m "fix: connect decision recovery to project cold start"
          git push origin HEAD:agent/confirmed-decision-sync-followup
