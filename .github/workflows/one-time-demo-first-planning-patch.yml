name: One-time demo-first planning patch

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.event.pull_request.head.ref == 'agent/demo-first-planning-sequence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply demo-first planning sequence patch
        run: python .github/scripts/apply_demo_first_planning_patch.py
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_demo_first_planning_patch.py
          rm .github/workflows/one-time-demo-first-planning-patch.yml
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: establish evidence-first demo planning sequence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
