name: Temporary Claim and Intent Consumer Reconciliation

on:
  push:
    branches:
      - feat/claim-intent-verification-gate-final
    paths:
      - ".github/workflows/tmp-claim-intent-consumer-reconciliation.yml"

permissions:
  contents: write

concurrency:
  group: temporary-claim-intent-consumer-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor == 'alsdmlals4-eng'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/claim-intent-verification-gate-final
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install contract dependencies
        run: python -m pip install -r requirements-publication.txt

      - name: Reconcile registered consumers
        run: python tools/tmp_reconcile_claim_intent_consumers.py

      - name: Regenerate Skill implementation evidence
        run: python tools/build_skill_implementation_evidence.py

      - name: Run focused and coupled regressions
        run: |
          python -m unittest \
            tests/test_claim_and_intent_verification_contract.py \
            tests/test_consolidated_skill_references.py \
            tests/test_skill_behavior_evidence_hardening.py \
            tests/test_skill_implementation_evidence.py \
            tests/test_skill_behavior_governance_integration.py \
            tests/test_skill_behavior_adversarial_boundaries.py \
            -v

      - name: Validate behavior evaluation contracts
        run: python tools/check_skill_behavior_evals.py

      - name: Remove temporary machinery and commit
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-claim-intent-consumer-reconciliation.yml
          rm tools/tmp_reconcile_claim_intent_consumers.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consumer changes were produced."
            exit 1
          fi
          git commit -m "test: reconcile claim-intent behavior evidence consumers"

      - name: Validate reference freshness on committed tree
        run: |
          BASE_SHA="$(git rev-parse origin/main)"
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base "$BASE_SHA" \
            --head HEAD
          git diff --check "$BASE_SHA...HEAD"

      - name: Push reconciled production tree
        run: git push origin HEAD:feat/claim-intent-verification-gate-final
