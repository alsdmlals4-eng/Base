name: Validate Provisional Confirm Delivery

on:
  pull_request:
    paths:
      - "tools/base-tool-contracts/**"
      - "tools/tool-hub/**"
      - "tools/expression-studio/**"
      - ".github/workflows/validate-provisional-confirm-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisional-confirm-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  confirm-delivery-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install reviewed dependencies
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './tools/base-tool-contracts[dev]' -e './tools/tool-hub[dev]' -e './tools/expression-studio[dev]'

      - name: Install reviewed dependencies on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.\tools\base-tool-contracts[dev]' -e '.\tools\tool-hub[dev]' -e '.\tools\expression-studio[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run approved-anchor portability contract
        run: python -m pytest -q tools/base-tool-contracts/tests/test_approved_anchor_portability.py

      - name: Run Tool Hub trusted delivery contracts
        run: python -m pytest -q tools/tool-hub/tests/test_studio_delivery_trust.py

      - name: Run Expression confirm-and-deliver contracts
        working-directory: tools/expression-studio
        run: python -m pytest -q tests/test_confirm_delivery.py tests/test_web_contract.py
