name: Validate Provisional Character Integration

on:
  pull_request:
    paths:
      - 'tools/expression-studio/**'
      - '.github/workflows/validate-provisional-character-integration.yml'

permissions:
  contents: read

jobs:
  character-subscription-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/expression-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Character contract dependencies
        working-directory: .
        run: >-
          python -m pip install
          -e './tools/base-tool-contracts[dev]'
          -e './tools/expression-studio[dev]'
      - name: Run Character subscription contracts
        run: >-
          python -m pytest -q
          tests/test_character_consistency.py
          tests/test_character_import_api.py
