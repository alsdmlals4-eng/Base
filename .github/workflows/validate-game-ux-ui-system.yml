name: Validate Game UX UI System

on:
  pull_request:
    paths:
      - "skills/auditing-and-refining-ui-art/**"
      - "skills/README.md"
      - "skills/SKILL_REGISTRY.json"
      - "skills/SKILL_LEARNING_LOG.md"
      - "AGENTS.md"
      - "START_HERE.md"
      - "docs/OPERATING_MODEL.md"
      - "docs/DOCUMENTATION_MAP.md"
      - ".github/reference-freshness.json"
      - "templates/planning/GAME_UX_UI_SYSTEM.md"
      - "templates/research/UX_UI_REFERENCE_CARD.md"
      - "templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md"
      - "tests/test_game_ux_ui_system.py"
      - "tests/test_ui_art_audit.py"
      - "tools/apply_ui_polishing_system_patch.py"
      - ".github/workflows/validate-game-ux-ui-system.yml"
  push:
    branches:
      - main
    paths:
      - "skills/auditing-and-refining-ui-art/**"
      - "skills/README.md"
      - "skills/SKILL_REGISTRY.json"
      - "skills/SKILL_LEARNING_LOG.md"
      - "AGENTS.md"
      - "START_HERE.md"
      - "docs/OPERATING_MODEL.md"
      - "docs/DOCUMENTATION_MAP.md"
      - ".github/reference-freshness.json"
      - "templates/planning/GAME_UX_UI_SYSTEM.md"
      - "templates/research/UX_UI_REFERENCE_CARD.md"
      - "templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md"
      - "tests/test_game_ux_ui_system.py"
      - "tests/test_ui_art_audit.py"
      - ".github/workflows/validate-game-ux-ui-system.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt

      - name: Apply deterministic UI polishing patch
        if: github.event_name == 'pull_request' && hashFiles('tools/apply_ui_polishing_system_patch.py') != ''
        run: |
          python tools/apply_ui_polishing_system_patch.py --reviewed-commit "${GITHUB_SHA}"

      - name: Run UX UI system and audit regression tests
        run: |
          git diff --check
          python -m unittest \
            tests/test_game_ux_ui_system.py \
            tests/test_ui_art_audit.py \
            -v

      - name: Commit deterministic patch
        if: github.event_name == 'pull_request' && hashFiles('tools/apply_ui_polishing_system_patch.py') != ''
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md \
            START_HERE.md \
            docs/OPERATING_MODEL.md \
            docs/DOCUMENTATION_MAP.md \
            skills/README.md \
            skills/SKILL_REGISTRY.json \
            skills/SKILL_LEARNING_LOG.md \
            skills/auditing-and-refining-ui-art \
            templates/planning/GAME_UX_UI_SYSTEM.md \
            templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md \
            .github/reference-freshness.json \
            .github/workflows/validate-game-ux-ui-system.yml
          git commit -m "feat: add evidence-based UI polishing pass"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
