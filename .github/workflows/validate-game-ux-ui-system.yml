name: Validate Game UX UI System

on:
  pull_request:
    paths:
      - "skills/auditing-and-refining-ui-art/**"
      - "skills/README.md"
      - "skills/SKILL_REGISTRY.json"
      - "skills/SKILL_LEARNING_LOG.md"
      - "AGENTS.md"
      - "START_HERE.md"
      - "docs/OPERATING_MODEL.md"
      - "docs/DOCUMENTATION_MAP.md"
      - "docs/knowledge/game-development/UI_UX_VISUAL_DESIGN_RULEBOOK.md"
      - "docs/knowledge/game-development/UX_LAWS_COMPLETENESS_MATRIX.md"
      - "docs/superpowers/specs/2026-07-29-ui-polishing-system-design.md"
      - "docs/superpowers/plans/2026-07-29-ui-polishing-system.md"
      - ".github/reference-freshness.json"
      - "templates/planning/GAME_UX_UI_SYSTEM.md"
      - "templates/planning/PROJECT_DESIGN_MD_TEMPLATE.md"
      - "templates/research/UX_UI_REFERENCE_CARD.md"
      - "templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md"
      - "tests/test_game_ux_ui_system.py"
      - "tests/test_ui_ux_visual_design_rules.py"
      - "tests/test_ux_laws_completeness_matrix.py"
      - "tests/test_project_design_md_adapter.py"
      - "tests/test_external_ui_procurement_gate.py"
      - "tests/test_bcp008_behavior_and_procurement_pilot.py"
      - "tools/validate_external_ui_procurement_receipt.py"
      - "docs/evidence/external-ui-procurement/**"
      - "tests/test_base_v9_4_ai_operations_contract.py"
      - "tests/test_ui_art_audit.py"
      - ".github/workflows/validate-game-ux-ui-system.yml"
  push:
    branches:
      - main
    paths:
      - "skills/auditing-and-refining-ui-art/**"
      - "skills/README.md"
      - "skills/SKILL_REGISTRY.json"
      - "skills/SKILL_LEARNING_LOG.md"
      - "AGENTS.md"
      - "START_HERE.md"
      - "docs/OPERATING_MODEL.md"
      - "docs/DOCUMENTATION_MAP.md"
      - "docs/knowledge/game-development/UI_UX_VISUAL_DESIGN_RULEBOOK.md"
      - "docs/knowledge/game-development/UX_LAWS_COMPLETENESS_MATRIX.md"
      - "docs/superpowers/specs/2026-07-29-ui-polishing-system-design.md"
      - "docs/superpowers/plans/2026-07-29-ui-polishing-system.md"
      - ".github/reference-freshness.json"
      - "templates/planning/GAME_UX_UI_SYSTEM.md"
      - "templates/planning/PROJECT_DESIGN_MD_TEMPLATE.md"
      - "templates/research/UX_UI_REFERENCE_CARD.md"
      - "templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md"
      - "tests/test_game_ux_ui_system.py"
      - "tests/test_ui_ux_visual_design_rules.py"
      - "tests/test_ux_laws_completeness_matrix.py"
      - "tests/test_project_design_md_adapter.py"
      - "tests/test_external_ui_procurement_gate.py"
      - "tests/test_bcp008_behavior_and_procurement_pilot.py"
      - "tools/validate_external_ui_procurement_receipt.py"
      - "docs/evidence/external-ui-procurement/**"
      - "tests/test_base_v9_4_ai_operations_contract.py"
      - "tests/test_ui_art_audit.py"
      - ".github/workflows/validate-game-ux-ui-system.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt
          python -m pip install pytest==8.3.5

      - name: Run UX UI system and audit regression tests
        run: |
          git diff --check
          python -m unittest \
            tests/test_game_ux_ui_system.py \
            tests/test_ui_ux_visual_design_rules.py \
            tests/test_ux_laws_completeness_matrix.py \
            tests/test_base_v9_4_ai_operations_contract.py \
            tests/test_ui_art_audit.py \
            -v
          python -m pytest \
            tests/test_project_design_md_adapter.py \
            tests/test_external_ui_procurement_gate.py \
            tests/test_bcp008_behavior_and_procurement_pilot.py \
            -q
          python tools/validate_external_ui_procurement_receipt.py \
            docs/evidence/external-ui-procurement/BCP008_SHADCN_BUTTON_PILOT.json
