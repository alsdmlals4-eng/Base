name: Fix v8 Migration Traceability

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/_tmp_fix_v8_migration_traceability.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/bca-visual-sheet-v8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bca-visual-sheet-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align migration and active prompt references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coverage = Path("docs/knowledge/VERTICAL_SLICE_V6_REQUIREMENT_COVERAGE.md")
          text = coverage.read_text(encoding="utf-8")
          replacements = {
              "# Vertical Slice v6 → 통합 실행문 v7 마이그레이션 추적표": "# Vertical Slice v6 → 통합 실행문 v8 마이그레이션 추적표",
              "단일 첨부용 v7 통합 실행문에 어떻게 무손실로 승계했는지": "단일 첨부용 v8 통합 실행문에 어떻게 무손실로 승계했는지",
              "| v6 책임 | v7·Base 책임 원본 | 승계·변경 |": "| v6 책임 | v8·Base 책임 원본 | 승계·변경 |",
              "v7 통합 Prompt는 실행 Template이며": "v8 통합 Prompt는 실행 Template이며",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f"missing migration token: {old}")
              text = text.replace(old, new, 1)
          anchor = "- 중요한 기획은 벤치마킹·플레이어 반응·현업/공식 권장 근거를 함께 검토한다."
          addition = "\n- 프로젝트 Sheet는 세계관·핵심루프·주요인물·조연·세력·관계·핵심시스템·메인콘텐츠의 의미 구조를 포함한다.\n- GPT는 기획 중 시각화와 기획 종료 실사용 후보 이미지·목업을 만들 수 있으나, 검수·승인·자산 원장·실제 적용 검증 전에는 최종 자산이 아니다."
          if "기획 종료 실사용 후보 이미지" not in text:
              if anchor not in text:
                  raise RuntimeError("latest decision anchor missing")
              text = text.replace(anchor, anchor + addition, 1)
          coverage.write_text(text.rstrip() + "\n", encoding="utf-8")

          consolidated = Path("tests/test_consolidated_skill_references.py")
          text = consolidated.read_text(encoding="utf-8")
          old = 'prompt = (ROOT / "templates/prompts/VERTICAL_SLICE_INTEGRATED_EXECUTION_PROMPT_v7.md").read_text(encoding="utf-8")'
          new = 'prompt = (ROOT / "templates/prompts/VERTICAL_SLICE_INTEGRATED_EXECUTION_PROMPT_v8.md").read_text(encoding="utf-8")'
          if old not in text:
              raise RuntimeError("consolidated prompt path missing")
          consolidated.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m py_compile tests/test_consolidated_skill_references.py
          python -m unittest \
            tests.test_integrated_vertical_slice_prompt_v7 \
            tests.test_vertical_slice_v6_contract \
            tests.test_bca_visual_sheet_workflow \
            tests.test_consolidated_skill_references -v
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge/VERTICAL_SLICE_V6_REQUIREMENT_COVERAGE.md tests/test_consolidated_skill_references.py
          git diff --cached --check
          git commit -m "docs: align v8 migration traceability"
          git push origin HEAD:agent/bca-visual-sheet-v8
