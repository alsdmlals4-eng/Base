name: Prove Source receipt envelope canonicalization RED

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r3-20260902
    paths:
      - .github/workflows/apply-source-receipt-envelope-canonicalization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-red-and-remove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r3-20260902
          fetch-depth: 0
      - name: Prove both redundant-envelope cases fail before implementation
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_periodic_source_receipt_review_round4.PeriodicSourceReceiptReviewRound4Tests.test_redundant_explicit_current_classification_does_not_duplicate_event tests.test_periodic_source_receipt_review_round4.PeriodicSourceReceiptReviewRound4Tests.test_redundant_merge_date_map_does_not_duplicate_material_event -v > /tmp/source-receipt-envelope-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/source-receipt-envelope-red.log
          test "$red_rc" -ne 0
          grep -q "FAILED" /tmp/source-receipt-envelope-red.log
      - name: Remove one-shot RED workflow
        shell: bash
        run: |
          rm .github/workflows/apply-source-receipt-envelope-canonicalization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u -- .github/workflows/apply-source-receipt-envelope-canonicalization.yml
          git commit -m "test: preserve receipt-envelope RED evidence"
          git push origin HEAD:fix/source-receipt-ledger-integrity-r3-20260902
