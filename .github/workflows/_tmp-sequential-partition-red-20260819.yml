name: Temporary sequential partition RED

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_sequential_partition_operating_contract.py
      - docs/operations/BASE_PARTITION_MANIFEST.json
      - docs/operations/BASE_PARTITION_OPERATING_MODEL.md
      - templates/prompts/BASE_PARTITION_OPTIMIZATION_PROMPT.md
      - skills/running-adversarial-review-and-refinement/SKILL.md
      - .github/workflows/_tmp-sequential-partition-red-20260819.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_sequential_partition_operating_contract -v
