name: Apply final Source receipt integrity hardening

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r2-20260902
    paths:
      - .github/workflows/apply-source-receipt-final-hardening.yml

permissions:
  contents: write

jobs:
  red-green-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current task head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r2-20260902
          fetch-depth: 0

      - name: Restore exact test and implementation patches
        shell: bash
        run: |
          cat > /tmp/source-receipt-tests.b64 <<'TEST_PATCH'
          
          TEST_PATCH
          cat > /tmp/source-receipt-tools.b64 <<'TOOL_PATCH'
          
          TOOL_PATCH
          base64 -d /tmp/source-receipt-tests.b64 | gzip -dc > /tmp/source-receipt-tests.patch
          base64 -d /tmp/source-receipt-tools.b64 | gzip -dc > /tmp/source-receipt-tools.patch
          echo 'e5dfd5e5392f0cd466f987d3062d33c6b4de085e53922495d21f39d660c61669  /tmp/source-receipt-tests.patch.gz' > /tmp/unused-check

      - name: Prove new integrity cases RED
        shell: bash
        run: |
          patch -p1 < /tmp/source-receipt-tests.patch
          set +e
          python -m unittest \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_rejects_unknown_receipt_fields_that_change_payload_identity \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_rejects_unknown_high_nutrient_fields \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_discovery_seed_parser_rejects_duplicates_and_excludes_retired_blocks \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_rejects_unrelated_contribution_merge_date_evidence \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_rejects_current_ledger_state_that_regresses_below_persisted_baseline \
            tests.test_record_periodic_source_scan.RecordPeriodicSourceScanTests.test_object_corpus_requires_supported_schema_and_no_unknown_fields \
            tests.test_record_periodic_source_scan.RecordPeriodicSourceScanTests.test_legacy_recorder_rejects_mutation_after_identity_state_exists \
            -v > /tmp/source-receipt-final-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/source-receipt-final-red.log
          test "$red_rc" -ne 0

      - name: Apply bounded integrity implementation
        shell: bash
        run: patch -p1 < /tmp/source-receipt-tools.patch

      - name: Prove GREEN and related Source compatibility
        shell: bash
        run: |
          python -m py_compile \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py
          python -m unittest \
            tests.test_periodic_source_receipt_state \
            tests.test_record_periodic_source_scan \
            tests.test_periodic_source_analysis_runner \
            tests.test_periodic_source_analysis_auto_merge \
            tests.test_periodic_source_scan_queue \
            -v
          git diff --check

      - name: Remove transport workflow and commit exact final scope
        shell: bash
        run: |
          rm .github/workflows/apply-source-receipt-final-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py \
            .github/workflows/apply-source-receipt-final-hardening.yml
          git commit -m "fix: close Source receipt identity bypasses"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git push origin HEAD:fix/source-receipt-ledger-integrity-r2-20260902
