name: TEMP Notion Project Isolation RED

on:
  pull_request:
    paths:
      - "tests/test_notion_project_isolation_core_system_contract.py"
      - "docs/operations/PROJECT_WORKSPACE_AUTHORITY_CONTRACT.json"
      - "skills/managing-design-documents/SKILL.md"
      - "docs/DOCUMENTATION_MAP.md"
      - ".github/workflows/temp-notion-project-isolation-red.yml"

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run Notion isolation contract test
        run: python -m unittest tests/test_notion_project_isolation_core_system_contract.py -v
