name: Validate Provisional Figma Integration

on:
  pull_request:
    paths:
      - "tools/base-tool-contracts/**"
      - "tools/tool-hub/**"
      - "tools/figma-bridge/**"
      - "tools/expression-studio/**"
      - "tools/sprite-animation-studio/**"
      - "docs/operations/PROJECT_FIGMA_TARGET_REGISTRY.json"
      - "docs/operations/PROJECT_FIGMA_TOOL_ROUTE_REGISTRY.json"
      - "tests/test_tool_hub_subscription_production_contract.py"
      - ".github/workflows/validate-provisional-figma-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisional-figma-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  figma-integration-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install reviewed dependencies
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './tools/base-tool-contracts[dev]' -e './tools/tool-hub[dev]' -e './tools/expression-studio[dev]' -e './tools/sprite-animation-studio[dev]'

      - name: Install reviewed dependencies on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.\tools\base-tool-contracts[dev]' -e '.\tools\tool-hub[dev]' -e '.\tools\expression-studio[dev]' -e '.\tools\sprite-animation-studio[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full reviewed visual delivery regression
        run: >-
          python -m pytest -q
          tools/base-tool-contracts/tests/test_figma_tool_routing.py
          tools/base-tool-contracts/tests/test_figma_tool_routing_adversarial.py
          tools/tool-hub/tests/test_figma_delivery.py
          tools/tool-hub/tests/test_figma_delivery_hardening.py
          tools/tool-hub/tests/test_figma_delivery_concurrency.py
          tools/tool-hub/tests/test_figma_bridge_api.py
          tools/tool-hub/tests/test_figma_plugin_contract.py
          tools/tool-hub/tests/test_figma_exact_tool_route.py
          tools/tool-hub/tests/test_studio_delivery_trust.py
          tools/tool-hub/tests/test_sprite_effect_route_adversarial.py
          tools/sprite-animation-studio/tests
          tools/expression-studio/tests
          tests/test_tool_hub_subscription_production_contract.py
