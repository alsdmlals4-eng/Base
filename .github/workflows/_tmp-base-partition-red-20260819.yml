name: Temporary Base partition RED contract

on:
  push:
    branches:
      - feat/base-partition-operating-model-20260819
    paths:
      - tests/test_base_partition_contract.py
      - .github/workflows/_tmp-base-partition-red-20260819.yml

permissions:
  contents: read

jobs:
  partition-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_base_partition_contract -v
