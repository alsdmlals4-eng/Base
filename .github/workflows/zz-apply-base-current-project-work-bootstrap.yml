name: Apply Base-current project work bootstrap

on:
  push:
    branches:
      - fix/base-current-project-work-bootstrap-20260902

permissions:
  contents: write

concurrency:
  group: apply-base-current-project-work-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/base-current-project-work-bootstrap-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Assert the expected RED parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "74a5151322eaf12735050a72940cebf3d2c6c4ac"

      - name: Apply the bounded Base-only implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          ROOT = Path.cwd()
          CLI = base64.b64decode('').decode("utf-8")
          OWNER = base64.b64decode('').decode("utf-8")
          POINTER = base64.b64decode('').decode("utf-8").rstrip("\n")
          TARGETS = ['AGENTS.md', 'START_HERE.md', 'templates/custom-instructions.gpt.md', 'docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md', 'skills/managing-project-intake-and-work-contract/SKILL.md', 'skills/managing-project-intake-and-work-contract/references/work-decomposition-and-sequencing.md', 'templates/planning/EXECUTION_SEQUENCE_PLAN.md', 'templates/project-operations/.agents/skills/base-project-router/SKILL.md', 'templates/project-operations/AI_WORKFLOW.md', 'templates/project-operations/PROJECT_START_HERE.md', 'templates/project-operations/WORK_CODEX_MINIMUM_TRANSITION_STARTER_PROMPT.md', 'templates/project-operations/WORK_PROJECT_EXECUTION_CURRENT_ROUTER.md', 'templates/project-operations/WORK_PROJECT_START_CANON_CHECKLIST.md', 'docs/DOCUMENTATION_MAP.md']
          WORKFLOW = Path('.github/workflows/zz-apply-base-current-project-work-bootstrap.yml')

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="\n")

          def insert_pointer(path: str) -> None:
              target = ROOT / path
              if not target.is_file():
                  raise SystemExit(f"missing active consumer: {path}")
              raw = target.read_bytes()
              newline = "\r\n" if b"\r\n" in raw else "\n"
              text = raw.decode("utf-8")
              if "BASE_CURRENT_OPERATIONAL_BOOTSTRAP" in text:
                  return
              lines = text.splitlines(keepends=True)
              heading_index = next(
                  (index for index, line in enumerate(lines) if line.lstrip().startswith("#")),
                  None,
              )
              if heading_index is None:
                  raise SystemExit(f"active consumer has no Markdown heading: {path}")
              insert_at = heading_index + 1
              block = newline + POINTER.replace("\n", newline) + newline + newline
              lines.insert(insert_at, block)
              target.write_text("".join(lines), encoding="utf-8", newline="")

          write("tools/run_project_work_gate.py", CLI)
          write("docs/operations/BASE_CURRENT_PROJECT_WORK_BOOTSTRAP.md", OWNER)
          for path in TARGETS:
              insert_pointer(path)
          (ROOT / WORKFLOW).unlink()
          PY

      - name: Commit before executing exact-identity tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Base-current zero-install project work gate"

      - name: Run focused bootstrap behavior tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_base_current_project_work_bootstrap -v

      - name: Run the full Base regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Verify final transport scope and push
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ".github/workflows/zz-apply-base-current-project-work-bootstrap.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check HEAD^ HEAD
          git push origin HEAD:fix/base-current-project-work-bootstrap-20260902
