name: Temporary PR548 freshness companion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr548-freshness-companion-20260819
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply companion policy
        run: python tools/_tmp_pr548_freshness_companions_20260819.py
      - name: Verify focused regression and freshness
        run: |
          python -m unittest tests.test_pr530_selective_integration_contract tests.test_bca_visual_sheet_workflow -v
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base "$(git rev-parse origin/main)" \
            --head HEAD
          git diff --check
      - name: Commit durable config
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-pr548-freshness-companion-20260819.yml
          git rm tools/_tmp_pr548_freshness_companions_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reference-freshness.json tests/test_pr530_selective_integration_contract.py .github/workflows/validate-base-v9-rc.yml
          git commit -m "fix: accept owner-local freshness regression companions"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
