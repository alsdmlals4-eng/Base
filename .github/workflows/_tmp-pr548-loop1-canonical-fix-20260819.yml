name: Temporary PR548 loop1 canonical fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr548-loop1-canonical-fix-20260819
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply canonical token normalization
        run: python tools/_tmp_fix_pr548_canonical_tokens_20260819.py
      - name: Verify focused contract
        run: |
          python -m unittest tests.test_pr530_selective_integration_contract -v
          git diff --check
      - name: Commit durable change
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-pr548-loop1-canonical-fix-20260819.yml
          git rm tools/_tmp_fix_pr548_canonical_tokens_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align selective workflow tokens to current canon"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
