name: BCP008 Export Source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/implement-bcp-008-spec-design-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          show-progress: false
      - name: Upload bounded source set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bcp008-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            skills/managing-project-intake-and-work-contract/SKILL.md
            skills/managing-design-documents/SKILL.md
            skills/reviewing-and-validating-project-changes/SKILL.md
            skills/running-adversarial-review-and-refinement/SKILL.md
            skills/auditing-and-refining-ui-art/SKILL.md
            skills/auditing-and-refining-ui-art/references/ux-ui-design-system-method.md
            templates/planning/GAME_UX_UI_SYSTEM.md
            skills/SKILL_BEHAVIOR_EVALS.json
            docs/DOCUMENTATION_MAP.md
            skills/SKILL_LEARNING_LOG.md
          if-no-files-found: error
          retention-days: 1
