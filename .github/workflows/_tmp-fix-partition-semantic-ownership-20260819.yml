name: Temporary fix partition semantic ownership

on:
  push:
    branches:
      - feat/base-partition-operating-model-20260819
    paths:
      - tools/_tmp_fix_partition_semantic_ownership_20260819.py
      - .github/workflows/_tmp-fix-partition-semantic-ownership-20260819.yml

permissions:
  contents: write

concurrency:
  group: tmp-fix-partition-semantic-ownership-20260819
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/base-partition-operating-model-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact ownership hardening
        run: python tools/_tmp_fix_partition_semantic_ownership_20260819.py
      - name: Verify partition contracts
        run: |
          python -m py_compile tools/check_base_partition_scope.py tools/periodic_source_scan_queue.py tests/test_base_partition_contract.py
          python tools/check_base_partition_scope.py --validate-manifest
          python -m unittest tests.test_base_partition_contract tests.test_periodic_source_scan_queue -v
      - name: Commit only durable non-workflow changes
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-fix-partition-semantic-ownership-20260819.yml
          git rm tools/_tmp_fix_partition_semantic_ownership_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/BASE_PARTITION_MANIFEST.json tests/test_base_partition_contract.py
          git commit -m "fix: harden partition semantic ownership"
          git push origin HEAD:feat/base-partition-operating-model-20260819
