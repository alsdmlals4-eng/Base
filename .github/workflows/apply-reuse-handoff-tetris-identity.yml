name: Apply current Tetris identity to reuse handoff

on:
  push:
    branches:
      - fix/reuse-handoff-current-authority-20260902
    paths:
      - .github/workflows/apply-reuse-handoff-tetris-identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/reuse-handoff-current-authority-20260902
          fetch-depth: 0

      - name: Replace superseded project identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["projects"]["TETRIS"]["project_owned_identity"] = (
              "Continuous realtime combat, persistent LINE/CHAIN workspace switching, tactical-pause Skill flow, "
              "enemy ETA telegraph, Combo/MP semantics, and original presentation remain Tetris-owned; protected "
              "Tetris trade dress is excluded."
          )
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/apply-reuse-handoff-tetris-identity.yml
          python -m unittest tests.test_reuse_first_preflight_enforcement -v

      - name: Commit final production diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json tests/test_reuse_first_preflight_enforcement.py .github/workflows/apply-reuse-handoff-tetris-identity.yml
          git commit -m "fix: align Tetris reuse identity with current project canon"
          git push origin HEAD:fix/reuse-handoff-current-authority-20260902
