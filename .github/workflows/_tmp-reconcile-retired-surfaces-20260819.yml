name: Temporary retired-surface reconciliation

on:
  push:
    branches:
      - feat/gpt-first-optional-codex-workflow-20260819
    paths:
      - tools/_tmp_reconcile_retired_surfaces_20260819.py
      - .github/workflows/_tmp-reconcile-retired-surfaces-20260819.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/_tmp_reconcile_retired_surfaces_20260819.py
      - .github/workflows/_tmp-reconcile-retired-surfaces-20260819.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-first-optional-codex-workflow-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reconcile retired surfaces
        run: python tools/_tmp_reconcile_retired_surfaces_20260819.py
      - name: Run focused contracts
        run: |
          python -m unittest tests.test_base_long_horizon_work_contract -v
          python -m unittest tests.test_gpt_codex_workflow_contract -v
      - name: Remove temporary workflow and commit durable changes
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-reconcile-retired-surfaces-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: retire stale Sheets and HTML workflow authority"
          git push origin HEAD:feat/gpt-first-optional-codex-workflow-20260819
