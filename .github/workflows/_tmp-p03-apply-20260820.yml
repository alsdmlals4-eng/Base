name: Temporary P03 current-main migration

on:
  push:
    branches: [integrate/p03-current-main-20260820]
    paths:
      - 'tools/_tmp_apply_p03_takeover_20260820.py'

permissions:
  contents: write

concurrency:
  group: tmp-p03-takeover-20260820
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/p03-current-main-20260820
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply current-main P03 takeover
        run: |
          if [ -f tools/_tmp_apply_p03_takeover_20260820.py ]; then
            python tools/_tmp_apply_p03_takeover_20260820.py
          else
            echo 'migration script already removed; no-op'
            exit 0
          fi
      - name: Run focused regression before commit
        run: |
          python -m py_compile tests/test_p03_takeover_contract.py tests/test_neutral_adversarial_feature_lifecycle.py tests/test_p03_adversarial_quality_contract.py
          python -m unittest tests.test_p03_takeover_contract tests.test_p03_adversarial_quality_contract tests.test_neutral_adversarial_feature_lifecycle tests.test_concurrent_git_sync_preflight_contract -v
      - name: Commit durable P03 delta
        shell: bash
        run: |
          git rm tools/_tmp_apply_p03_takeover_20260820.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(p03): integrate evidence-bounded review on current main'
          git pull --rebase origin integrate/p03-current-main-20260820
          git push origin HEAD:integrate/p03-current-main-20260820
