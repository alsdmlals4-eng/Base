name: Temporary PR548 final fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr548-final-fix-20260819
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply planning correction
        run: python tools/_tmp_pr548_restore_base_excluded_20260819.py
      - name: Verify previously failing contracts
        run: |
          python -m unittest \
            tests.test_demo_first_planning_sequence \
            tests.test_evidence_based_game_development_knowledge \
            tests.test_periodic_external_source_watchlist \
            tests.test_project_gdd_google_sheets_contract \
            tests.test_pr530_selective_integration_contract -v
          git diff --check
      - name: Commit durable change
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-pr548-final-fix-20260819.yml
          git rm tools/_tmp_pr548_restore_base_excluded_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve planning evidence and frozen Sheet history"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
