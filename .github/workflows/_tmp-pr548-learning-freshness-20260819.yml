name: Temporary PR548 learning freshness

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr548-learning-freshness-20260819
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Synchronize durable companions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          planning = root / 'docs/PLANNING_SEQUENCE_AND_EVIDENCE_POLICY.md'
          text = planning.read_text(encoding='utf-8')
          anchor = '`docs/DEPRECATED_PROJECT_SURFACE_RETIREMENT_POLICY.md`'
          replacement = '`docs/PROJECT_GDD_GOOGLE_SHEETS_POLICY.md`와 `docs/DEPRECATED_PROJECT_SURFACE_RETIREMENT_POLICY.md`'
          if 'docs/PROJECT_GDD_GOOGLE_SHEETS_POLICY.md' not in text:
              if anchor not in text:
                  raise SystemExit('planning migration owner anchor missing')
              text = text.replace(anchor, replacement, 1)
          planning.write_text(text, encoding='utf-8', newline='\n')

          log = root / 'skills/SKILL_LEARNING_LOG.md'
          log_text = log.read_text(encoding='utf-8')
          marker = '## 2026-08-19 — Visual dashboard responsibility moved to self-contained Notion Home'
          if marker not in log_text:
              entry = '''\n\n## 2026-08-19 — Visual dashboard responsibility moved to self-contained Notion Home\n\n- **상태:** `PATTERN_CANDIDATE`\n- **Trigger:** 프로젝트 관리용 standalone HTML/local visual surface를 폐기하면서도 사람이 시스템 관계·상태·UX flow를 한 화면에서 읽을 책임은 계속 필요했다.\n- **Finding:** `building-project-visual-dashboards`를 통째로 삭제하면 기존 유효한 human-facing visualization 책임까지 잃고, 새 Notion 전용 Skill을 만들면 같은 목적의 owner가 중복된다.\n- **Decision:** 기존 Skill을 `NOTION_PROJECT_HOME_AND_VISUAL_MAP` 책임으로 재분류한다. Project Home은 `HUMAN_HOME_SELF_CONTAINED_BEFORE_DRILLDOWN`을 만족하고, standalone HTML/dashboard 생성은 금지한다. GitHub/repository runtime truth와 Notion human-facing projection의 authority는 계속 분리한다.\n- **Evidence:** `tests/test_bca_visual_sheet_workflow.py`와 PR #548 selective-integration regression이 Skill body·Registry route·Notion Home·HTML 금지·Sheet migration-only 경계를 검증한다. QA Evidence Studio는 프로젝트 관리 surface가 아니라 specialist validation utility이므로 유지한다.\n- **Boundary:** Notion Home 재분류가 실제 사람 이해도를 향상시켰다는 human usability evidence는 아직 `NOT_RUN`이다.\n- **Next trigger:** Notion Home이 반복적으로 너무 커져 탐색성이 악화되거나, 별도 visual workspace에 고유 편집 기능이 실제 blocker로 입증될 때 재검토한다.\n'''
              first_break = log_text.find('\n\n')
              log_text = log_text[:first_break] + entry + log_text[first_break:]
          log.write_text(log_text, encoding='utf-8', newline='\n')
          PY
      - name: Verify focused companions
        run: |
          python -m unittest tests.test_pr530_selective_integration_contract tests.test_bca_visual_sheet_workflow tests.test_demo_first_planning_sequence -v
          git diff --check
      - name: Commit durable changes
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-pr548-learning-freshness-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLANNING_SEQUENCE_AND_EVIDENCE_POLICY.md skills/SKILL_LEARNING_LOG.md
          git commit -m "docs: synchronize visual dashboard learning and Sheet owner"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
