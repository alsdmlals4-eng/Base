name: Periodic Source Scan Queue

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/periodic-source-scan-queue.yml"
      - "tools/periodic_source_scan_queue.py"
      - "tools/run_periodic_source_scan_queue.sh"
      - "tests/test_periodic_source_analysis_runner.py"
      - "tests/test_periodic_source_scan_queue.py"
      - "docs/knowledge/game-development/PERIODIC_SOURCE_SCAN_QUEUE.md"
      - "docs/knowledge/game-development/PERIODIC_SOURCE_OPERATIONS_LEDGER.json"
      - "docs/knowledge/game-development/PERIODIC_EXTERNAL_SOURCE_WATCHLIST.md"
      - "docs/operations/BASE_PARTITION_MANIFEST.json"
      - "docs/operations/BASE_PARTITION_LEARNING_SYSTEM.md"
      - "docs/operations/base-partitions/learning/**"

permissions:
  contents: read

concurrency:
  group: periodic-source-scan-queue
  cancel-in-progress: false

# ZERO_INCREMENTAL_COST_QUEUE_PREP
# state: AWAITING_CHATGPT_REVIEW
# ai_api_call: NONE
# next_executor: USER_DIRECTED_CHATGPT_REVIEW
# output: periodic-source-scan-queue.md
# Queue preparation is deterministic Issue maintenance only.
# Actual web research and Evidence decisions happen in a user-directed ChatGPT review.

jobs:
  prepare-queue:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify zero-cost Source Queue contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/periodic_source_scan_queue.py \
            tests/test_periodic_source_scan_queue.py \
            tests/test_periodic_source_analysis_runner.py
          bash -n tools/run_periodic_source_scan_queue.sh
          python -m unittest \
            tests/test_periodic_source_scan_queue.py \
            tests/test_periodic_source_analysis_runner.py \
            -v

      - name: Prepare due-Source Queue plus P01-P09 Learning Radar without metered AI execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/run_periodic_source_scan_queue.sh
