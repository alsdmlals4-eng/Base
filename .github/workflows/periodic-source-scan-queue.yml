name: Periodic Source Scan Queue

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/periodic-source-scan-queue.yml"
      - "tools/periodic_source_analysis*.py"
      - "tools/periodic_source_candidate_state.py"
      - "tools/periodic_source_operations_state.py"
      - "tools/periodic_source_scan_queue.py"
      - "tools/run_periodic_source_scan_queue.sh"
      - "tests/test_periodic_source_analysis_auto_merge.py"
      - "tests/test_periodic_source_analysis_runner.py"
      - "tests/test_periodic_source_scan_queue.py"
      - "docs/knowledge/game-development/PERIODIC_SOURCE_SCAN_QUEUE.md"
      - "docs/knowledge/game-development/EVIDENCE_BASED_GAME_DEVELOPMENT_METHOD.md"
      - "docs/knowledge/game-development/source-scans/README.md"

permissions:
  contents: read

concurrency:
  group: periodic-source-scan-queue
  cancel-in-progress: false

env:
  SOURCE_ANALYSIS_MODEL: ${{ vars.SOURCE_ANALYSIS_MODEL || 'gpt-5.6-terra' }}
  SOURCE_SCAN_BATCH_SIZE: ${{ vars.SOURCE_SCAN_BATCH_SIZE || '4' }}

# The trusted shell runner owns the following bounded orchestration contract.
# Keeping the tokens here makes the delegation visible to workflow-only contract readers.
# automation/source-scan-
# gh pr create
# gh workflow run validate-evidence-knowledge.yml
# gh workflow run validate-base-v9-rc.yml
# gh workflow run validate-game-project-operating-system.yml
# validation_level=full
# gh run watch
# git merge --no-edit origin/main
# reviewThreads
# gh pr merge --squash --match-head-commit
# BLOCKED_ACTIVE_PR_GUARD
# BLOCKED_ACTIVE_PR_GUARD_QUERY
# BLOCKED_MERGE_NOT_IMMEDIATE
# BLOCKED_ACTIONS_PR_CREATION_SETTING
# BLOCKED_ACTIONS_DISPATCH
# BLOCKED_VALIDATION

jobs:
  analyze-validate-and-merge:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify daily Source analysis contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/periodic_source_scan_queue.py \
            tools/periodic_source_analysis_contract.py \
            tools/periodic_source_analysis_render.py \
            tools/periodic_source_candidate_state.py \
            tools/periodic_source_operations_state.py \
            tools/periodic_source_analysis.py \
            tests/test_periodic_source_scan_queue.py \
            tests/test_periodic_source_analysis_auto_merge.py \
            tests/test_periodic_source_analysis_runner.py
          bash -n tools/run_periodic_source_scan_queue.sh
          python -m unittest \
            tests/test_periodic_source_scan_queue.py \
            tests/test_periodic_source_analysis_auto_merge.py \
            tests/test_periodic_source_analysis_runner.py \
            -v

      - name: Run daily context analysis, PR validation, and guarded expected-head merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash tools/run_periodic_source_scan_queue.sh

      - name: Upload daily Source analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: periodic-source-scan-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            periodic-source-scan-queue.md
            queue-final.md
            source-analysis-status.json
            changed-files.txt
            source-scan-pr-body.md
            docs/knowledge/game-development/source-scans/**
            docs/knowledge/game-development/PERIODIC_SOURCE_CANDIDATE_LEDGER.json
            docs/knowledge/game-development/PERIODIC_SOURCE_OPERATIONS_LEDGER.json
          if-no-files-found: warn
