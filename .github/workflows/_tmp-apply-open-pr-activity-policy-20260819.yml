name: Temporary open PR activity policy migration

on:
  push:
    branches: [fix/open-pr-is-not-active-workstream-20260819]
    paths:
      - tools/_tmp_apply_open_pr_activity_policy_20260819.py
      - tools/_tmp_patch_open_pr_test_phrase_20260819.py
      - .github/workflows/_tmp-apply-open-pr-activity-policy-20260819.yml
  pull_request:
    branches: [main]
    paths:
      - tools/_tmp_apply_open_pr_activity_policy_20260819.py
      - tools/_tmp_patch_open_pr_test_phrase_20260819.py
      - .github/workflows/_tmp-apply-open-pr-activity-policy-20260819.yml

permissions:
  contents: write

concurrency:
  group: tmp-open-pr-activity-policy-20260819
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/open-pr-is-not-active-workstream-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply activity policy
        run: |
          python tools/_tmp_apply_open_pr_activity_policy_20260819.py
          python tools/_tmp_patch_open_pr_test_phrase_20260819.py
      - name: Verify focused contract
        run: |
          python -m py_compile tests/test_sequential_part_coordinator_contract.py tools/check_base_partition_scope.py
          python tools/check_base_partition_scope.py --validate-manifest
          python -m unittest tests.test_sequential_part_coordinator_contract tests.test_base_partition_contract -v
      - name: Commit durable non-workflow changes
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-apply-open-pr-activity-policy-20260819.yml
          git rm tools/_tmp_apply_open_pr_activity_policy_20260819.py
          git rm tools/_tmp_patch_open_pr_test_phrase_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: classify open PRs by actual active ownership"
          git pull --rebase origin fix/open-pr-is-not-active-workstream-20260819
          git push origin HEAD:fix/open-pr-is-not-active-workstream-20260819
