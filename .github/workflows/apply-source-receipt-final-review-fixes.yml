class PeriodicSourceReceiptFinalReviewTests(unittest.TestCase):
    def test_canonical_grouped_discovery_seed_records_are_parsed(self):
        registry = (
            ROOT
            / "docs"
            / "knowledge"
            / "game-development"
            / "PERIODIC_EXTERNAL_SOURCE_DISCOVERY_SEEDS.md"
        ).read_text(encoding="utf-8")
        active = state.parse_active_discovery_seed_ids(registry)
        for expected in (
            "openai-codex-official",
            "anthropic-claude-code-official",
            "google-gemini-coding-official",
        ):
            self.assertIn(expected, active)

    def test_receipt_entry_envelope_rejects_unknown_fields(self):
        bad = entry(receipt(), ref="typo")
        bad["source_state_at_scna"] = {"anthropic": "DURABLE_ACTIVE"}
        with self.assertRaisesRegex(
            AnalysisBlocked, "unsupported receipt corpus entry fields"
        ):
            reconcile(ledger(), [bad])

    def test_receipt_identity_includes_receipt_time_classification(self):
        first = entry(receipt(), ref="first")
        first["source_state_at_scan"] = {
            "anthropic": "DURABLE_ACTIVE",
            "godot": "DURABLE_ACTIVE",
            "github-copilot": "DURABLE_ACTIVE",
        }
        contradictory = entry(receipt(), ref="contradictory")
        contradictory["source_state_at_scan"] = {
            "anthropic": "DISCOVERY_ACTIVE"
        }
        with self.assertRaisesRegex(AnalysisBlocked, "classification.*durable lane"):
            reconcile(ledger(), [first, contradictory])

    def test_tracking_start_cannot_change_after_identity_state_exists(self):
        current = reconcile(ledger(), [])
        current["tracking_started_at"] = "2026-08-12"
        with self.assertRaisesRegex(
            AnalysisBlocked, "tracking_started_at changed after reconciliation"
        ):
            reconcile(current, [])

