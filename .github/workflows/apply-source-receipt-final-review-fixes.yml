name: Apply final reviewed Source receipt fixes

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r2-20260902
    paths:
      - .github/workflows/apply-source-receipt-final-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r2-20260902
          fetch-depth: 0

      - name: Repair staged patch replacement semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.tmp/apply_source_receipt_final_fixes.py')
          text = path.read_text(encoding='utf-8')
          old = 'source, count = parser_pattern.subn(parser_replacement, source)'
          new = 'source, count = parser_pattern.subn(lambda _match: parser_replacement, source)'
          if text.count(old) != 1:
              raise SystemExit('regex replacement repair anchor missing or ambiguous')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Add final review regressions and prove RED
        shell: bash
        run: |
          python .tmp/apply_source_receipt_final_fixes.py tests
          set +e
          python -m unittest tests.test_periodic_source_receipt_review_round3.PeriodicSourceReceiptFinalReviewTests -v > /tmp/source-receipt-final-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/source-receipt-final-red.log
          test "$red_rc" -ne 0
          grep -Eq "FAILED|ERROR" /tmp/source-receipt-final-red.log

      - name: Apply minimal final review corrections
        run: python .tmp/apply_source_receipt_final_fixes.py implementation

      - name: Prove GREEN with focused and related Source suites
        shell: bash
        run: |
          python -m py_compile tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py tools/periodic_source_operations_state.py tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tests/test_periodic_source_receipt_review_round3.py
          python -m unittest tests.test_periodic_source_receipt_state tests.test_record_periodic_source_scan tests.test_periodic_source_receipt_review_round3 tests.test_periodic_source_analysis_auto_merge tests.test_periodic_source_analysis_runner -v
          git diff --check

      - name: Remove one-shot files and commit final production diff
        shell: bash
        run: |
          rm .tmp/apply_source_receipt_final_fixes.py
          rm .github/workflows/apply-source-receipt-final-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py tools/periodic_source_operations_state.py tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tests/test_periodic_source_receipt_review_round3.py .tmp/apply_source_receipt_final_fixes.py .github/workflows/apply-source-receipt-final-review-fixes.yml
          git commit -m "fix: close Source receipt reconciliation identities"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "tests/test_periodic_source_receipt_review_round3.py tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_operations_state.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git push origin HEAD:fix/source-receipt-ledger-integrity-r2-20260902
