          parser_replacement = r'''def parse_active_discovery_seed_ids(text: str) -> set[str]:
    if not isinstance(text, str):
        raise _blocked("discovery seed registry must be text")

    active: set[str] = set()
    seen: set[str] = set()

    def collect_records(body: str) -> None:
        starts = list(
            re.finditer(
                r"(?m)^seed_id:\s*([A-Za-z0-9][A-Za-z0-9._-]*)\s*$",
                body,
            )
        )
        if not starts:
            return
        prefix_statuses = re.findall(
            r"(?m)^status:\s*([^\s#]+)\s*$", body[: starts[0].start()]
        )
        if len(prefix_statuses) > 1:
            raise _blocked("discovery seed block contains multiple default status values")
        default_status = prefix_statuses[0] if prefix_statuses else "ACTIVE_DISCOVERY_SEED"
        for index, match in enumerate(starts):
            seed_id = match.group(1)
            if seed_id in seen:
                raise _blocked("duplicate discovery seed ID")
            seen.add(seed_id)
            end = starts[index + 1].start() if index + 1 < len(starts) else len(body)
            segment = body[match.start() : end]
            status_matches = re.findall(
                r"(?m)^status:\s*([^\s#]+)\s*$", segment
            )
            if len(status_matches) > 1:
                raise _blocked("discovery seed record contains multiple status values")
            status = status_matches[0] if status_matches else default_status
            if status == "ACTIVE_DISCOVERY_SEED":
                active.add(seed_id)

    fenced_ranges: list[tuple[int, int]] = []
    for block in re.finditer(r"(?ms)^```yaml\s*\n(.*?)^```\s*$", text):
        fenced_ranges.append(block.span())
        collect_records(block.group(1))

    loose_text = text
    for start, end in reversed(fenced_ranges):
        loose_text = (
            loose_text[:start]
            + ("\n" * text[start:end].count("\n"))
            + loose_text[end:]
        )
    collect_records(loose_text)

    if not active:
        raise _blocked("discovery seed registry contains no active seed_id entries")
    return active


