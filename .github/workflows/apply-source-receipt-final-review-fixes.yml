name: Apply final reviewed Source receipt fixes

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r2-20260902
    paths:
      - .github/workflows/apply-source-receipt-final-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r2-20260902
          fetch-depth: 0

      - name: Add final review regressions and prove RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_periodic_source_receipt_review_round3.py")
          text = path.read_text(encoding="utf-8")
          anchor = "\nif __name__ == '__main__': unittest.main()\n"
