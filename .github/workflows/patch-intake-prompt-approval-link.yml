name: Patch intake prompt approval owner

on:
  push:
    branches:
      - work/prompt-approval-gate-20260903
    paths:
      - .github/workflows/patch-intake-prompt-approval-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch the existing intake owner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/managing-project-intake-and-work-contract/SKILL.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(needle: str, replacement: str) -> None:
              global text
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {needle[:100]!r}")
              text = text.replace(needle, replacement, 1)

          replace_once(
              "- `first-prompt`: 핵심 방향 문장을 지시문 가장 앞에 배치하고 Task·Context·Source·Constraints·Output·Validation을 순서화한 뒤 전체 계약과 충돌하지 않는지 검사한다. 상세 절차는 `references/first-prompt-direction-anchoring.md`를 사용한다.",
              "- `first-prompt`: 핵심 방향 문장을 지시문 가장 앞에 배치하고 Task·Context·Source·Constraints·Output·Validation을 순서화한 뒤 전체 계약과 충돌하지 않는지 검사한다. 상세 절차는 `references/first-prompt-direction-anchoring.md`를 사용하고, 실행 승인 상태·receipt·digest 검사는 `references/prompt-approval-execution-gate.md`를 사용한다.",
          )
          replace_once(
              "\n## Work Mode selection\n",
              "\n`PROMPT_APPROVAL_EXECUTION_GATE_REQUIRED`: 새롭거나 의미가 바뀐 L1+ 계약은 같은 repository-owned root receipt의 `prompt_approval_gate`를 `--phase prepare`로 검사하고 exact contract를 사용자에게 한 번 확인받는다. `CONFIRMED` 또는 동일 digest의 `REUSED_APPROVAL` 전에는 BUILD·Codex handoff·외부 agent 위임과 `start / resume / closeout` 실행을 허용하지 않는다. read-only 조사, L0 기계 작업, 동일 validation 재실행, exact approved continuation은 중복 질문하지 않는다. 상세 필드·권위·digest·material drift·실패 계약은 `references/prompt-approval-execution-gate.md`가 소유한다.\n\n## Work Mode selection\n",
          )
          replace_once(
              "    existing_solution_user_approval:\nbenchmark_preflight_receipt:",
              "    existing_solution_user_approval:\nprompt_approval_gate:\nbenchmark_preflight_receipt:",
          )
          replace_once(
              "- 새 작업자가 같은 입력에서 동등한 계약·라우팅·실행 보고를 복원할 수 있다.\n\n## Failure conditions",
              "- 새롭거나 의미가 바뀐 L1+ root receipt가 `prompt_approval_gate`를 포함하고, `prepare`는 비실행 상태이며 `start / resume / closeout`은 `CONFIRMED | REUSED_APPROVAL`과 current digest를 요구한다.\n- 새 작업자가 같은 입력에서 동등한 계약·라우팅·실행 보고를 복원할 수 있다.\n\n## Failure conditions",
          )
          replace_once(
              "- Grill Me alignment gate 또는 유효 승인 없이 실행 계약·BUILD·위임으로 이동함\n",
              "- Grill Me alignment gate 또는 유효 승인 없이 실행 계약·BUILD·위임으로 이동함\n- 새롭거나 의미가 바뀐 L1+ 작업에서 `prompt_approval_gate`를 누락하거나, `AWAITING_USER_CONFIRMATION`·stale digest·untrusted approval authority·material scope drift 상태로 `start / resume / closeout`을 실행함\n",
          )

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Remove the one-shot patch workflow
        run: rm .github/workflows/patch-intake-prompt-approval-link.yml
      - name: Commit and push the bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/managing-project-intake-and-work-contract/SKILL.md .github/workflows/patch-intake-prompt-approval-link.yml
          git commit -m "docs: link prompt approval gate from intake owner"
          git push origin HEAD:${GITHUB_REF_NAME}
