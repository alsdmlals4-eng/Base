name: Apply Shared Skill Registry Update

on:
  push:
    branches:
      - agent/base-shared-skill-adapters-20260725
    paths:
      - .github/workflows/apply-shared-skill-registry-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/base-shared-skill-adapters-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update registry, learning log, and structure test
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'skills/SKILL_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          by_id = {item['skill_id']: item for item in registry['skills']}

          additions = [
              {
                  'skill_id': 'governing-legacy-retention-and-archives',
                  'layer': 'foundation',
                  'discipline': 'knowledge-governance-and-archives',
                  'path': 'skills/governing-legacy-retention-and-archives/SKILL.md',
                  'status': 'ACTIVE',
                  'load_by_default': False,
                  'trigger_tags': [
                      'legacy-retention', 'archive-governance', 'legacy-file',
                      'versioned-duplicate', 'stale-copy', 'canonical-merge',
                      'compatibility-stub', 'archive-history', 'delete-candidate',
                      'legacy-reconciliation'
                  ],
                  'use_when': [
                      '현행·레거시 문서, 자산, 경로, Skill 패키지와 파생본을 보존적으로 분류·통합·아카이브하거나 승인 삭제해야 한다.'
                  ],
                  'do_not_use_when': [
                      '레거시 수명주기와 무관한 단일 오탈자 수정이거나 프로젝트 운영체계 전체 설치·마이그레이션이다.'
                  ],
                  'learning_log': 'skills/SKILL_LEARNING_LOG.md',
                  'review_triggers': [
                      '파일명만으로 레거시 판정', '승인 전 삭제', '고유 정보 유실',
                      '활성 참조 파손', '호환 stub 누락', '아카이브 인덱스 누락',
                      '복구 경로 누락', '프로젝트 경로 하드코딩'
                  ],
                  'last_reviewed_at': '2026-07-25',
                  'last_reviewed_commit': 'c7c1103e4a69f8fdc9ee27aa382a21288605a7fb',
                  'knowledge_state': 'PATTERN'
              },
              {
                  'skill_id': 'evaluating-godot-assets-and-plugins-before-creation',
                  'layer': 'specialist',
                  'discipline': 'godot-asset-and-plugin-evaluation',
                  'path': 'skills/evaluating-godot-assets-and-plugins-before-creation/SKILL.md',
                  'status': 'ACTIVE',
                  'load_by_default': False,
                  'trigger_tags': [
                      'godot-asset-search', 'godot-plugin-search', 'commercial-plugin',
                      'asset-store', 'asset-library', 'itchio-asset', 'github-addon',
                      'reuse-before-build', 'third-party-license', 'build-custom-decision'
                  ],
                  'use_when': [
                      'Godot 기능·도구·에셋·통합을 새로 만들기 전에 기본 기능, 공식 Store, 기존 Asset Library, GitHub, itch.io와 상용 후보를 조사·평가해야 한다.'
                  ],
                  'do_not_use_when': [
                      '외부 자산과 무관한 오탈자·단일 수치 수정이거나 이미 승인된 동일 버전 자산을 단순 재사용한다.'
                  ],
                  'learning_log': 'skills/SKILL_LEARNING_LOG.md',
                  'review_triggers': [
                      '검색 없는 직접 제작', '라이선스 미확인', 'Godot 버전 불일치',
                      '유지보수 중단', '저장 데이터 lock-in', '제거 계획 누락',
                      '사용자 승인 없는 구매·설치', '프로젝트 코어의 플러그인 종속'
                  ],
                  'last_reviewed_at': '2026-07-25',
                  'last_reviewed_commit': 'c7c1103e4a69f8fdc9ee27aa382a21288605a7fb',
                  'knowledge_state': 'PATTERN'
              },
          ]

          for item in additions:
              if item['skill_id'] not in by_id:
                  registry['skills'].append(item)

          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          learning_path = root / 'skills/SKILL_LEARNING_LOG.md'
          learning = learning_path.read_text(encoding='utf-8')
          marker = '## 2026-07-25 — Base 공용 Skill 어댑터와 Godot 자산 선행 검색'
          if marker not in learning:
              learning = learning.rstrip() + f'''\n\n{marker}\n\n- 상태: `PATTERN`\n- 추가 Skill: `governing-legacy-retention-and-archives`, `evaluating-godot-assets-and-plugins-before-creation`\n- 결정: Base 공용 Skill은 프로젝트에 복제하지 않고 route Registry와 프로젝트 경로 어댑터로 연결한다.\n- 결정: Godot 기능·에셋·상용 플러그인은 직접 제작 전에 기본 기능, 공식 Store, 기존 Asset Library, GitHub, itch.io와 제작자 원본을 조사한다.\n- 안전 경계: 구매·계정 연결·설치는 별도 사용자 승인, 기존 로컬 공용 Skill 복사본 삭제는 별도 레거시 감사가 필요하다.\n- 검증: Base Registry·Learning Log·운영체계 구조 테스트·프로젝트별 route·adapter의 정합성을 확인한다.\n'''
              learning_path.write_text(learning, encoding='utf-8')

          test_path = root / 'tests/test_game_project_operating_system_structure.py'
          test = test_path.read_text(encoding='utf-8')
          anchor = '            "skills/SKILL_COVERAGE.json",\n'
          additions_text = (
              '            "skills/BASE_SHARED_SKILL_ROUTES.json",\n'
              '            "skills/governing-legacy-retention-and-archives/SKILL.md",\n'
              '            "skills/evaluating-godot-assets-and-plugins-before-creation/SKILL.md",\n'
              '            "skills/evaluating-godot-assets-and-plugins-before-creation/references/source-catalog.md",\n'
              '            "docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md",\n'
              '            "tests/test_base_shared_skill_routes.py",\n'
          )
          if 'skills/BASE_SHARED_SKILL_ROUTES.json' not in test:
              test = test.replace(anchor, additions_text + anchor)
          test = test.replace('self.assertEqual(len(registry["skills"]), 25)', 'self.assertEqual(len(registry["skills"]), 27)')
          subset_anchor = '            "managing-base-change-proposals",\n'
          subset_additions = (
              '            "governing-legacy-retention-and-archives",\n'
              '            "evaluating-godot-assets-and-plugins-before-creation",\n'
          )
          if '"governing-legacy-retention-and-archives",' not in test[test.find('self.assertTrue({'):]:
              test = test.replace(subset_anchor, subset_anchor + subset_additions, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Commit generated synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SKILL_REGISTRY.json skills/SKILL_LEARNING_LOG.md tests/test_game_project_operating_system_structure.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No registry synchronization changes required"
          else
            git commit -m "chore: synchronize shared skills with Base registry"
            git push origin HEAD:agent/base-shared-skill-adapters-20260725
          fi
