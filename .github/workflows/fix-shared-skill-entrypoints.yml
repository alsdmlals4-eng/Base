name: Fix Shared Skill Entrypoints

on:
  push:
    branches:
      - agent/base-shared-skill-adapters-20260725
    paths:
      - .github/workflows/fix-shared-skill-entrypoints.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/base-shared-skill-adapters-20260725
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish shared skills and repair test placement
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          root = Path('.')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('25개 활성 Skill', '27개 활성 Skill')
          anchor = '| 25 | `diagnosing-game-engine-runtime-failures` | 엔진 런타임 실패 재현·원인 격리·최소 수정·재실행 |\n'
          rows = (
              '| 26 | `governing-legacy-retention-and-archives` | 레거시 보존·정본 통합·호환 stub·아카이브·승인 삭제 |\n'
              '| 27 | `evaluating-godot-assets-and-plugins-before-creation` | Godot 기본 기능·무료·오픈소스·상용 자산을 직접 제작 전에 평가 |\n'
          )
          if 'governing-legacy-retention-and-archives' not in readme:
              if anchor not in readme:
                  raise SystemExit('README skill table anchor not found')
              readme = readme.replace(anchor, anchor + rows)
          readme_path.write_text(readme, encoding='utf-8')

          test_path = root / 'tests/test_game_project_operating_system_structure.py'
          test = test_path.read_text(encoding='utf-8')

          legacy_start = test.index('    def test_legacy_aliases_cover_every_removed_skill')
          legacy_end = test.index('    def test_minimum_base_invocation_routes_to_consolidated_skills', legacy_start)
          legacy_block = test[legacy_start:legacy_end]
          legacy_block = legacy_block.replace('            "governing-legacy-retention-and-archives",\n', '')
          legacy_block = legacy_block.replace('            "evaluating-godot-assets-and-plugins-before-creation",\n', '')
          test = test[:legacy_start] + legacy_block + test[legacy_end:]

          registry_start = test.index('    def test_base_skill_registry_is_valid_selective_and_consolidated')
          registry_end = test.index('    def test_project_core_and_adversarial_skills_have_distinct_contracts', registry_start)
          registry_block = test[registry_start:registry_end]
          subset_anchor = '            "managing-base-change-proposals",\n'
          subset_rows = (
              '            "governing-legacy-retention-and-archives",\n'
              '            "evaluating-godot-assets-and-plugins-before-creation",\n'
          )
          if '"governing-legacy-retention-and-archives",' not in registry_block:
              if subset_anchor not in registry_block:
                  raise SystemExit('Registry subset anchor not found')
              registry_block = registry_block.replace(subset_anchor, subset_anchor + subset_rows, 1)
          test = test[:registry_start] + registry_block + test[registry_end:]
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Commit entrypoint synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_game_project_operating_system_structure.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No entrypoint synchronization changes required"
          else
            git commit -m "fix: publish shared skills in Base entrypoints"
            git push origin HEAD:agent/base-shared-skill-adapters-20260725
          fi
