name: Apply Archive Governance Base Rollout PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'gpt/legacy-retention-archive-skill-design-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/legacy-retention-archive-skill-design-20260725
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop after generated commit
        id: guard
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "chore: apply archive governance Base mutations" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply structured mutations
        if: steps.guard.outputs.skip != 'true'
        run: python tools/run_archive_governance_base_rollout.py

      - name: Commit structured mutations
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/SKILL_REGISTRY.json \
            skills/SKILL_COVERAGE.json \
            tests/test_game_project_operating_system_structure.py \
            .github/workflows/validate-game-project-operating-system.yml \
            skills/managing-game-project-operating-system/SKILL.md \
            skills/pruning-stale-and-nonfunctional-material/SKILL.md \
            skills/SKILL_LEARNING_LOG.md
          git diff --cached --check
          git commit -m "chore: apply archive governance Base mutations"
          git push origin HEAD:gpt/legacy-retention-archive-skill-design-20260725
