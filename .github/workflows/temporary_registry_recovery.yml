name: Apply Feature Contract Correction

on:
  push:
    branches:
      - work/feature-code-contract-modularity-20260901

permissions:
  contents: write

jobs:
  apply-correction:
    if: "${{ github.event.head_commit.message == 'chore: retry atomic feature-contract correction' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preparation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply and verify exact correction files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          previous = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/temporary_registry_recovery.yml"],
              text=True,
          )
          match = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d", previous)
          if match is None:
              raise SystemExit("embedded correction script not found in parent workflow")
          Path("/tmp/base805_apply.py.gz.b64").write_text(match.group(1), encoding="ascii")
          PY
          base64 -d /tmp/base805_apply.py.gz.b64 | gzip -d > /tmp/base805_apply.py
          python /tmp/base805_apply.py
          git rm .github/workflows/temporary_registry_recovery.yml
          git diff --check
          python -m unittest tests.test_feature_code_contract_modularity tests.test_consolidated_skill_references -v
          python tools/build_base_v9_artifacts.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          cat > /tmp/expected-paths.txt <<'PATHS'
          .github/workflows/temporary_registry_recovery.yml
          docs/generated/BASE_ACTIVE_SKILLS.md
          skills/SKILL_LEARNING_LOG.md
          skills/SKILL_REGISTRY.json
          skills/managing-project-intake-and-work-contract/SKILL.md
          templates/planning/EXECUTION_SEQUENCE_PLAN.md
          tests/test_consolidated_skill_references.py
          tests/test_feature_code_contract_modularity.py
          PATHS
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test ! -e .github/workflows/temporary_registry_recovery.yml
          test "$(git hash-object docs/generated/BASE_ACTIVE_SKILLS.md)" = '735c77333be5215cf3a3416c5dd06b0aa64cebd4'
          test "$(git hash-object skills/SKILL_LEARNING_LOG.md)" = '9342f8719c18fd28369b167aa4faa8a07655b670'
          test "$(git hash-object skills/SKILL_REGISTRY.json)" = '5927b6d88b0e8aa580fd9bfca623b917051d1ed1'
          test "$(git hash-object skills/managing-project-intake-and-work-contract/SKILL.md)" = '8bcc37ac09b83d6cb035f35acb8c90c540677be0'
          test "$(git hash-object templates/planning/EXECUTION_SEQUENCE_PLAN.md)" = '8313f415ff5f54aa257b49c8cd47bf4c00f77dc7'
          test "$(git hash-object tests/test_consolidated_skill_references.py)" = 'e119eab408c636bfc5a3ca07163ed41e38912652'
          test "$(git hash-object tests/test_feature_code_contract_modularity.py)" = '289c95ef945128138768d4cf5fce6343160aebc2'
          git commit -m 'fix: route feature contracts through intake and plan'
          final_sha="$(git rev-parse HEAD)"
          python tools/check_canonical_reference_freshness.py --root . --config .github/reference-freshness.json --base "$GITHUB_SHA" --head "$final_sha"
          git push origin HEAD:work/feature-code-contract-modularity-20260901
