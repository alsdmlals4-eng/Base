name: Temporary Registry Recovery

on:
  push:
    branches:
      - work/feature-code-contract-modularity-20260901

permissions:
  contents: read

jobs:
  recover-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
      - name: Archive exact tracked tree
        run: git archive --format=zip --output=base-source-${GITHUB_SHA}.zip HEAD
      - name: Upload exact tracked tree
        uses: actions/upload-artifact@v4
        with:
          name: base-source-${{ github.sha }}
          path: base-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 1
