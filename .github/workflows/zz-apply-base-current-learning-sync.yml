name: Apply Base-current learning companion sync

on:
  push:
    branches:
      - fix/base-current-project-work-bootstrap-20260902

permissions:
  contents: write

concurrency:
  group: apply-base-current-learning-companion-sync
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/base-current-project-work-bootstrap-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Base validation dependencies
        run: python -m pip install -r .github/validation-requirements.txt

      - name: Assert expected exact lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "23a077f05caefa7f3b0d99294242633d2101fbec"
          test "$(git diff --name-only 23a077f05caefa7f3b0d99294242633d2101fbec...HEAD)" = ".github/workflows/zz-apply-base-current-learning-sync.yml"

      - name: Add existing-suite companion and learning evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          test_path = root / "tests/test_consolidated_skill_references.py"
          learning_path = root / "skills/managing-project-intake-and-work-contract/LEARNING_LOG.md"
          workflow_path = root / ".github/workflows/zz-apply-base-current-learning-sync.yml"

          method_name = "test_base_current_project_work_bootstrap_has_companion_and_learning_evidence"
          test_text = test_path.read_text(encoding="utf-8")
          if method_name not in test_text:
              marker = '\nif __name__ == "__main__":'
              if marker not in test_text:
                  raise SystemExit("cannot find consolidated test module sentinel")
              method = '''
    def test_base_current_project_work_bootstrap_has_companion_and_learning_evidence(self) -> None:
        owner = (ROOT / "docs/operations/BASE_CURRENT_PROJECT_WORK_BOOTSTRAP.md").read_text(encoding="utf-8")
        intake = (ROOT / "skills/managing-project-intake-and-work-contract/SKILL.md").read_text(encoding="utf-8")
        learning = (ROOT / "skills/managing-project-intake-and-work-contract/LEARNING_LOG.md").read_text(encoding="utf-8")
        bootstrap_tests = (ROOT / "tests/test_base_current_project_work_bootstrap.py").read_text(encoding="utf-8")

        for token in (
            "BASE_CURRENT_OPERATIONAL_BOOTSTRAP",
            "NO_PROJECT_PREINSTALL_REQUIRED",
            "PROJECT_CANON_PRECEDENCE",
            "ADOPTED_BASE_RELEASE_UNCHANGED",
            "EPHEMERAL_RECEIPT_ALLOWED",
        ):
            self.assertIn(token, owner)
        self.assertIn("BASE_CURRENT_PROJECT_WORK_BOOTSTRAP.md", intake)
        self.assertIn("Base-current zero-install PM bootstrap needs an existing-suite companion", learning)
        self.assertIn("test_project_can_start_without_adapter_or_project_receipt_file", bootstrap_tests)
'''
              test_text = test_text.replace(marker, "\n" + method + marker, 1)
              test_path.write_text(test_text, encoding="utf-8", newline="\n")

          learning_text = learning_path.read_text(encoding="utf-8")
          heading = "## 2026-09-02 — Base-current zero-install PM bootstrap needs an existing-suite companion"
          if heading not in learning_text:
              entry = '''
## 2026-09-02 — Base-current zero-install PM bootstrap needs an existing-suite companion

- **상태:** `OBSERVATION`
- **호출 트리거:** 사용자가 프로젝트 저장소를 일괄 수정하지 말고 Base만 교정해, 이후 프로젝트 작업이 최신 Base를 fresh-read하면 PM 체크리스트와 작업 Gate를 바로 사용할 수 있게 하라고 지시했다.
- **Finding:** 병합된 PM Gate는 정확한 완료 판정을 제공했지만 활성 진입 문서가 프로젝트별 adapter pin·wrapper·repository receipt를 선행 조건으로 유지해 새 프로젝트 작업의 Base-only 진입을 막았다. Base-current 공용 CLI와 owner의 focused/전체 테스트는 통과했지만 canonical freshness가 intake Skill 변경에 기존-suite companion과 Learning Log가 함께 바뀌지 않은 상태를 차단했다.
- **Decision:** 프로젝트 채택 Base release와 프로젝트 정본은 그대로 유지하고, 최신 Base는 비영구 `BASE_CURRENT_OPERATIONAL_BOOTSTRAP` PM/workflow overlay만 제공한다. receipt는 stdin·임시 파일·기존 프로젝트 owner에서 공급할 수 있고 Base CLI는 프로젝트를 쓰지 않는다. 프로젝트별 wrapper·Skill 복사·빈 receipt 배포·fleet mutation은 만들지 않는다. 이 변경은 standalone 신규 테스트뿐 아니라 기존 consolidated Skill regression과 이 Learning Log에 연결한다.
- **TDD / regression evidence:** 신규 계약의 최초 RED run `33585916370`은 owner/CLI/active routing 부재를 재현했다. 임시 적용 run `33587898750`은 의존성을 설치한 동일 tree에서 focused 8개와 전체 1772개 테스트를 통과했다. exact-head required CI·독립 review·merge와 postmerge readback은 별도 완료 증거다.
- **Evidence ceiling:** Gate PASS는 supplied receipt와 exact Base/project revision의 기록 일관성만 증명한다. 프로젝트 전체 backlog 완전성, 외부 evidence 진실성, 프로젝트 채택 release 변경, Godot runtime·시각·UX·Human QA 또는 출시 상태를 증명하지 않는다.
- **다음 검토 트리거:** 새 프로젝트 작업이 다시 project-side Base preinstall·wrapper·adapter 갱신 없이는 시작되지 않거나, latest Base가 프로젝트 product canon/adopted release를 조용히 교체하거나, ephemeral receipt가 두 번째 상태 정본으로 승격되거나, intake Skill 변경이 existing-suite companion·Learning Log 없이 standalone test만 통과할 때.

'''
              first_break = learning_text.find("\n")
              if first_break < 0:
                  raise SystemExit("learning log title is missing")
              learning_text = learning_text[: first_break + 1] + "\n" + entry + learning_text[first_break + 1 :].lstrip("\n")
              learning_path.write_text(learning_text, encoding="utf-8", newline="\n")

          workflow_path.unlink()
          PY

      - name: Commit before exact-tree validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "test: bind Base-current bootstrap to learning companions"

      - name: Run focused companion tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_consolidated_skill_references.ConsolidatedSkillReferenceTests.test_base_current_project_work_bootstrap_has_companion_and_learning_evidence \
            tests.test_base_current_project_work_bootstrap \
            -v

      - name: Run full Base regression
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > full-regression.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            grep -nE '^(FAIL:|ERROR:|FAILED \(|Ran [0-9]+ tests|Traceback|AssertionError)' full-regression.log | tail -n 200 || true
            tail -n 240 full-regression.log
          fi
          rm -f full-regression.log
          exit "$code"

      - name: Verify final tree and push
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/zz-apply-base-current-learning-sync.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check HEAD^ HEAD
          git push origin HEAD:fix/base-current-project-work-bootstrap-20260902
