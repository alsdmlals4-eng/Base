name: Validate Provisional Integration Reconciliation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'skills/synchronizing-local-and-github-state/**'
      - 'tests/test_concurrent_git_sync_preflight_contract.py'
      - '.github/workflows/validate-provisional-integration-reconciliation.yml'

permissions:
  contents: read

jobs:
  provisional-integration-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run provisional integration contract
        run: >-
          python -m unittest
          tests.test_concurrent_git_sync_preflight_contract.ConcurrentGitSyncPreflightContractTests.test_explicitly_authorized_provisional_integration_requires_reconciliation_before_merge
