name: Temporary Headless Boundary Verification

on:
  push:
    branches:
      - work/headless-boundary-verification-20260907

permissions:
  contents: read

concurrency:
  group: temporary-headless-boundary-verification-20260907
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 46ac4c2ca8326739a31b68f3e474ffd2cf6018af
      SOURCE_SHA: 07330c89411cd15d68106c80bb6e2bc138179ca3
      REVIEWED_SHA: 14ca577a9edba5189904f8ea95c64258c6071f45
    steps:
      - name: Check out exact merged subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 46ac4c2ca8326739a31b68f3e474ffd2cf6018af
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integration and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$REVIEWED_SHA^{tree}")"
          python tools/validate_work_contract_receipt.py --receipt docs/operations/work-receipts/2026-09-07-headless-shared-boundary.json --phase resume --expected-source-sha "$SOURCE_SHA"
          python -m unittest tests.test_shared_direct_call_contract tests.test_feature_code_contract_modularity -v
          echo "MERGED_TREE_EQUALS_INDEPENDENTLY_REVIEWED_AND_CI_VERIFIED_TREE"
      - name: Download existing pinned reference engine
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 15 --max-time 120 --retry 2 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip' | sha256sum --check -
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Execute merged runtime and closeout gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          target, source = os.environ['TARGET_SHA'], os.environ['SOURCE_SHA']
          godot = os.environ['GODOT_BIN']
          project = 'examples/godot-narrative-dialogue-flow'
          result = subprocess.run([godot, '--headless', '--path', project, '--script', 'res://tests/test_dialogue_flow_runtime.gd'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30)
          assert result.returncode == 0 and 'NARRATIVE_DIALOGUE_RUNTIME_TEST_PASS' in result.stdout and 'FAIL:' not in result.stdout and 'SCRIPT ERROR' not in result.stdout and 'Parse Error' not in result.stdout, result.stdout
          count = sum(line.startswith('PASS: ') for line in result.stdout.splitlines())
          assert count == 84, count
          print(f'MERGED_SUBJECT_RUNTIME_PASS subject={target} assertions={count}', flush=True)
          smoke = subprocess.run([godot, '--headless', '--path', project, '--quit-after', '5'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30)
          assert smoke.returncode == 0 and 'NARRATIVE_DIALOGUE_SAMPLE_READY' in smoke.stdout and 'SCRIPT ERROR' not in smoke.stdout and 'Parse Error' not in smoke.stdout, smoke.stdout
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          checkpoint_path = Path('docs/operations/work-receipts/2026-09-07-headless-shared-boundary.json')
          receipt = json.loads(checkpoint_path.read_text())
          receipt['outcome_status'] = 'MERGED_VERIFIED_CLOSEOUT_PROJECTION'
          receipt['checkpoint_policy'] = 'Derived closeout projection for PR #858; original committed premerge checkpoint is unchanged.'
          run_url = f"https://github.com/alsdmlals4-eng/Base/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          common = [f'{run_url}: exact merged subject {target}; tree equals reviewed/CI-tested 14ca577a9edba5189904f8ea95c64258c6071f45; focused Python 11/11; actual Godot 84/84 and headless startup, not UI input/render/UX.', 'PR #858 independent review comment 5568882928 and complete self-review/evidence comment 5568903514; normal expected-head squash merge and parent/readback verified.']
          board = receipt['project_work_kanban']
          board['active_work_item_ref'] = None
          board['next_action'] = 'STOP_APPROVED_SCOPE_COMPLETE'
          board['progress_summary'] = {'completed_items': 1, 'applicable_items': 1, 'display': '1 / 1'}
          task = board['work_items'][0]
          task.update(status='DONE', verified_head_sha=target, must_fix_remaining=0, blocked_unverified_remaining=0, user_decision_required_remaining=0, repository_readback='PASS', readback_evidence=common, next_action='STOP_APPROVED_SCOPE_COMPLETE')
          for check in task['checklist']:
              check.update(status='PASS', evidence=check.get('evidence', []) + common)
          for level in task['verification']:
              level.update(status='PASS', evidence=level.get('evidence', []) + common)
          with tempfile.TemporaryDirectory(prefix='headless-closeout-') as tmp:
              path = Path(tmp) / 'closeout.json'
              path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
              subprocess.run(['python', 'tools/validate_work_contract_receipt.py', '--receipt', str(path), '--phase', 'closeout', '--expected-source-sha', source, '--expected-head-sha', target, '--render-markdown'], check=True)
              print('DERIVED_CLOSEOUT_RECEIPT_SHA256=' + hashlib.sha256(path.read_bytes()).hexdigest())
          print('HEADLESS_STARTUP_PASS_NOT_UI_INPUT_OR_RENDER_PROOF')
          print(f'MERGED_CLOSEOUT_VERIFIED_SOURCE={target}; NEXT=STOP_APPROVED_SCOPE_COMPLETE')
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
