name: Temporary PR548 tighten freshness

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr548-tighten-freshness-20260819
  cancel-in-progress: true

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Remove overbroad generic companions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.github/reference-freshness.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rule = next(item for item in data['coupled_change_rules'] if item['name'] == 'skill-description-learning-test-sync')
          rule['require_any_changed'] = [item for item in rule['require_any_changed'] if item not in {'tests/test_bca_visual_sheet_workflow.py', 'tests/test_p0[1-9]_*.py'}]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify focused freshness
        run: |
          python -m unittest tests.test_skill_routing_governance tests.test_pr530_selective_integration_contract -v
          python tools/check_canonical_reference_freshness.py --config .github/reference-freshness.json --base origin/main --head HEAD
          git diff --check
      - name: Commit durable change and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/_tmp-pr548-tighten-freshness-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reference-freshness.json
          git commit -m "fix: keep Skill freshness companions semantic"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
