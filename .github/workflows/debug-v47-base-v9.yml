name: Debug v4.7 Base v9 Failure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "START_HERE.md"
      - "docs/**"
      - "skills/**"
      - "tests/**"
      - ".github/workflows/debug-v47-base-v9.yml"

permissions:
  contents: read

jobs:
  generated-and-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement .github/validation-requirements.txt
      - name: generated artifacts
        run: python tools/build_base_v9_artifacts.py --check
      - name: integrity
        run: python tools/check_base_v9_integrity.py --trusted-history-commit "${{ github.event.pull_request.base.sha }}"

  partition-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: manifest validator
        run: python tools/check_base_partition_scope.py --validate-manifest
      - name: partition regression
        run: python -m unittest tests.test_base_partition_contract -v

  release-checkers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement .github/validation-requirements.txt
      - run: python tools/check_base_v9_4_1_release.py --trusted-history-commit "${{ github.event.pull_request.base.sha }}"
      - run: python tools/check_base_v9_4_2_release.py --trusted-history-commit "${{ github.event.pull_request.base.sha }}"
      - run: python tools/check_base_v9_4_3_release.py --trusted-history-commit "${{ github.event.pull_request.base.sha }}"

  focused-unit-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          python -m unittest \
            tests.test_v9_machine_contracts \
            tests.test_v9_registry_generation \
            tests.test_v9_governance_documents \
            tests.test_v9_1_project_operating_contract \
            tests.test_v9_1_review_remediation \
            tests.test_v9_1_skill_pressure_contracts \
            tests.test_project_adapter_fleet_hardening \
            tests.test_project_adapter_fleet_rollout_status \
            tests.test_approved_protected_change_gate \
            tests.test_project_gdd_google_sheets_contract \
            tests.test_vertical_slice_v9_contract \
            tests.test_base_v9_4_ai_operations_contract \
            tests.test_base_v9_4_release_evidence_contract \
            tests.test_base_v9_4_trusted_evidence_record \
            tests.test_base_v9_4_1_compatibility_release \
            tests.test_base_v9_4_2_compatibility_release \
            tests.test_base_v9_4_3_compatibility_release \
            tests.test_higodot_single_authority_policy \
            tests.test_godot_addon_utilization_policy \
            tests.test_godot_higodot_gut_hera_toolchain \
            tests.test_base_shared_skill_routes \
            tests.test_neutral_adversarial_feature_lifecycle \
            -v
