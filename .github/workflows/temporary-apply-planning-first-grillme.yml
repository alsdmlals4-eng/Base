### 8.2 승인별 즉시 내구 기록

사용자 답변 직후 같은 Decision ID를 활성 배치 Branch·GitHub 추적 surface·구성된 Sheet에 기록한다. 이 단계는 승인 사실을 보존하지만 main 동기화 완료를 주장하지 않는다.

```text
사용자 답변 원문 보존
→ Decision 상태 판정
