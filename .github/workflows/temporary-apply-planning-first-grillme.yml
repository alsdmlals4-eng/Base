name: Temporary Apply Planning First Grill Me Governance

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-apply-planning-first-grillme.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/planning-first-grillme-batch-governance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Apply canonical contract changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def insert_before(path: str, marker: str, block: str) -> None:
              text = read(path)
              if block.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f'marker missing in {path}: {marker}')
              write(path, text.replace(marker, block.rstrip() + '\n\n' + marker, 1))

          def insert_before_last(path: str, marker: str, block: str) -> None:
              text = read(path)
              if block.strip() in text:
                  return
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit(f'last marker missing in {path}: {marker}')
              write(path, text[:index] + block.rstrip() + '\n\n' + text[index:])

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              start_index = text.find(start)
              end_index = text.find(end, start_index + len(start))
              if start_index < 0 or end_index < 0:
                  raise SystemExit(f'boundary missing in {path}: {start} -> {end}')
              write(path, text[:start_index] + replacement.rstrip() + '\n\n' + text[end_index:])

