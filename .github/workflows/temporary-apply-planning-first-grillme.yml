사용자 답변은 다음 질문까지 대화 메모리에만 보류하지 않는다. 같은 승인 단위에서 Decision ID를 확정하고 활성 Grill Me 배치 Branch와 GitHub 추적 surface에 즉시 기록한다.

### 10.1 기획·수치 분류

```yaml
DETAILED_NUMERIC_DEFAULT:
  classification: RECOMMENDED_DEFAULT
  authority: GPT_RECOMMENDATION
  examples: [초기 밸런스, 입력 버퍼, 쿨다운, 전환 시간, 내부 데이터 세부]
  required: [reason, adjustment_condition, validation, evidence_limit]
PLANNING_CONFLICT:
  classification: USER_DECISION_REQUIRED
  protocol: GRILL_ME_REQUIRED
  examples: [난이도 곡선, 경제, 성장 속도, 세션 길이, 빌드 우열, 보상 의미, 핵심 플레이 경험, 분야 정본 충돌]
```

`DETAILED_NUMERIC_DEFAULT`은 가역적이고 프로젝트 방향을 바꾸지 않을 때만 GPT 권장안대로 진행한다. `PLANNING_CONFLICT`는 사용자에게 한 번에 하나씩 Grill Me로 질문하고 승인 전 확정하지 않는다.

### 10.2 배치 계약

```yaml
grill_me_batch_id: GM-BATCH-YYYY-MM-DD-NN
MAX_APPROVED_DECISIONS_PER_BATCH: 10
approved_decision_count: 0
checkpoint_reason: TEN_APPROVALS | HIGH_IMPACT | CANON_CONFLICT | IMPLEMENTATION_BLOCKED | SESSION_END | USER_REQUEST | DIFF_SIZE
status: COLLECTING | CHECKPOINT_REQUIRED | BATCH_PR_OPEN | CHECKS_RUNNING | REVIEW_REQUIRED | MERGED | SYNCED_TO_MAIN | BLOCKED
```

`10`은 질문을 채우기 위한 최소량이 아니라 한 배치의 최대 승인 수다. 다음은 조기 체크포인트 사유다.

- `HIGH_IMPACT`: 프로젝트 코어·주요 UX·경제·세션 구조 등 광범위하거나 되돌리기 어려운 결정
- `CANON_CONFLICT`: 기존 Decision 대체 또는 분야 정본 충돌
- `IMPLEMENTATION_BLOCKED`: 다음 구현 패키지가 현재 결정을 즉시 필요로 함
- `SESSION_END`: 인터뷰·세션이 10건 미만에서 종료됨
- `USER_REQUEST`: 사용자가 지금 병합·검토를 요청함
- `DIFF_SIZE`: 검토 가능한 자기완결 변경 크기를 넘기기 전 분리 필요

10번째 승인 후에는 해당 배치의 병합·재동기화 전 11번째 질문을 금지한다. 인터뷰가 10건 미만에서 끝나도 잔여 승인 건을 같은 PR Gate로 닫는다.

### 10.3 승인별 즉시 기록

1. `CONFIRMED / LATEST_OVERRIDE / SUPERSEDED / REJECTED / DEFERRED / UNRESOLVED / UNVERIFIED_CONTEXT`로 판정한다.
2. 기존 GitHub 댓글 흐름에 사용자 답변 원문과 최종 Decision을 기록한다.
3. `templates/project-operations/GRILL_ME_DECISION_RECORD.md`에 배치 ID와 Decision을 기록한다.
4. 활성 배치 Branch에서 `CURRENT_CONFIRMED_DECISIONS.md`, 영향받는 분야 책임 원본, 필요한 `ACTIVE_CONTEXT.md`와 실행 계약을 갱신한다.
5. 승인 건마다 하나의 Decision별 논리 Commit을 만든다.
6. 구성된 Google Sheets에는 같은 Decision ID와 Branch Commit을 `APPROVED_PENDING_MERGE`로 기록하고 재조회한다. 이 상태는 main 통합 완료가 아니다.
7. 승인 수와 체크포인트 사유를 다시 계산한다.

기존 상태 `APPROVED_PENDING_CANON`, `CANON_UPDATED`, `SHEET_UPDATED`는 과거 이력 해석을 위해 보존하되 새 배치는 `APPROVED_PENDING_MERGE`와 `BATCH_PR_OPEN`을 사용한다.

