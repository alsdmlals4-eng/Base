→ 배치 승인 수와 체크포인트 판정
```

기존 `APPROVED_PENDING_CANON`, `CANON_UPDATED`, `MAIN_UPDATED`, `SHEET_UPDATED`, `SYNCED` 상태는 과거 이력과 단일 승인 기록의 호환 해석을 위해 보존한다. 새 배치에서는 `APPROVED_PENDING_MERGE`, `BATCH_PR_OPEN`, `SYNCED_TO_MAIN`을 추가로 사용한다.

### 8.3 Grill Me 배치

```yaml
grill_me_batch_id: GM-BATCH-YYYY-MM-DD-NN
MAX_APPROVED_DECISIONS_PER_BATCH: 10
approved_decision_count: 0
checkpoint_reason: TEN_APPROVALS | HIGH_IMPACT | CANON_CONFLICT | IMPLEMENTATION_BLOCKED | SESSION_END | USER_REQUEST | DIFF_SIZE
status: COLLECTING | CHECKPOINT_REQUIRED | BATCH_PR_OPEN | CHECKS_RUNNING | REVIEW_REQUIRED | MERGED | SYNCED_TO_MAIN | BLOCKED
```

10건은 최소 대기량이 아니라 최대 배치 크기다. `HIGH_IMPACT`, `CANON_CONFLICT`, `IMPLEMENTATION_BLOCKED`, `SESSION_END`, `USER_REQUEST`, `DIFF_SIZE`에서는 조기 체크포인트를 연다. 10번째 승인 뒤에는 병합·재동기화 전 11번째 질문을 금지하며, 인터뷰가 10건 미만에서 끝나도 잔여 배치를 닫는다.

### 8.4 배치 PR과 병합 Gate

같은 Goal에는 하나의 활성 Grill Me 배치 PR만 둔다.

```text
BATCH_PR_OPEN
→ latest exact-head required checks
→ attack → validate-critique → regression-recheck → decision-report
→ unresolved thread 0
→ P0/P1 0
→ squash merge
→ merged main SHA 재조회
→ GitHub 정본·분야 원본 재조회
→ Sheet의 APPROVED_PENDING_MERGE 행을 merge Commit으로 갱신
→ Sheet 재조회
→ SYNCED_TO_MAIN
```

검사 실패·미해결 기획 충돌·`BLOCKED_UNVERIFIED`·unresolved thread·P0/P1 finding이 있으면 병합과 다음 질문을 차단한다. 병합 후 GitHub main과 Sheet의 Decision ID·결정·대체 관계·merge Commit이 일치할 때만 `SYNCED`와 `SYNCED_TO_MAIN`을 기록한다.

### 8.5 직접 main 반영의 제한

