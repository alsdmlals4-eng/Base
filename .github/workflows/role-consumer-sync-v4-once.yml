name: One-shot GPT role consumer sync v4

on:
  push:
    branches:
      - workflow/gpt-codex-role-split-20260825
    paths:
      - ".github/workflows/role-consumer-sync-v4-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reuse validated v3 consumer closure and add final literal
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/role-consumer-sync-v3-once.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply exact consumer closure\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Focused verification'
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('v3 closure block not found')
          code = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(textwrap.dedent(code), {})

          prompt = Path('templates/prompts/BASE_PARTITION_OPTIMIZATION_PROMPT.md')
          text = prompt.read_text(encoding='utf-8')
          literal = 'Base Python contract test·Registry/generated·CI policy'
          if literal not in text:
              anchor = 'Base 내부에 `.py`, `.json`, workflow, checker가 있어도 Codex 작업으로 넘기지 않는다.'
              if anchor not in text:
                  raise SystemExit('Base prompt owner anchor missing')
              text = text.replace(
                  anchor,
                  anchor + '\n\n`Base Python contract test·Registry/generated·CI policy` 역시 GPT-owned Base maintenance다.',
                  1,
              )
              prompt.write_text(text, encoding='utf-8')

      - name: Focused verification
        run: |
          python -m unittest \
            tests.test_gpt_codex_workflow_contract \
            tests.test_p08_ai_operations_contract \
            tests.test_one_shot_local_executor_bootstrap_contract \
            tests.test_base_long_horizon_work_contract \
            tests.test_base_partition_contract \
            tests.test_pr530_selective_integration_contract \
            tests.test_skill_routing_governance -v
          python tools/build_base_v9_artifacts.py --check

      - name: Remove temporary sync workflows and commit
        run: |
          rm -f .github/workflows/role-consumer-sync-once.yml
          rm -f .github/workflows/role-consumer-sync-v2-once.yml
          rm -f .github/workflows/role-consumer-sync-v3-once.yml
          rm -f .github/workflows/role-consumer-sync-v4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consumer closure delta"
            exit 0
          fi
          git commit -m "chore: close GPT-owned Base role consumers [role-consumer-v4]"
          git push origin HEAD:workflow/gpt-codex-role-split-20260825
