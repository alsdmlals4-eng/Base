name: Temporary PR548 finalize review locators

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr548-finalize-review-locators-20260819
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r .github/validation-requirements.txt
      - name: Finalize exact review locators and regenerate
        run: |
          python tools/_tmp_pr548_finalize_review_locators_20260819.py
          python tools/build_base_v9_artifacts.py --write
      - name: Verify Registry, derivatives, focused contracts, and freshness
        run: |
          python tools/build_base_v9_artifacts.py --check
          python tools/check_base_v9_integrity.py --trusted-history-commit "$(git rev-parse origin/main)"
          python -m unittest tests.test_skill_routing_governance tests.test_pr530_selective_integration_contract tests.test_v9_registry_generation -v
          python tools/check_canonical_reference_freshness.py --config .github/reference-freshness.json --base "$(git rev-parse origin/main)" --head HEAD
          git diff --check
      - name: Commit durable changes and remove temporary files
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-pr548-finalize-review-locators-20260819.yml
          git rm tools/_tmp_pr548_finalize_review_locators_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SKILL_REGISTRY.json docs/generated/BASE_ACTIVE_SKILLS.md docs/operations/BASE_V9_DECISION_REGISTRY.json
          git commit -m "chore: finalize PR548 review locators"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
