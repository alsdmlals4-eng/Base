name: Fix Design Decision Sync Test V2

on:
  push:
    branches:
      - docs/design-decision-sync-governance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/design-decision-sync-governance
          fetch-depth: 0

      - name: Repair regression test with explicit indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_game_project_operating_system_structure.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          start_marker = "    def test_design_document_skill_requires_continuous_decision_sync(self) -> None:\n"
          end_marker = "    def test_operating_model_is_single_explanatory_source(self) -> None:\n"
          start = lines.index(start_marker)
          end = lines.index(end_marker)
          c = " " * 4
          b = " " * 8
          n = " " * 12
          replacement = [
              c + "def test_design_document_skill_requires_continuous_decision_sync(self) -> None:\n",
              b + 'documents = (ROOT / "skills/managing-design-documents/SKILL.md").read_text(encoding="utf-8")\n',
              b + 'workflow = (ROOT / "templates/project-operations/AI_WORKFLOW.md").read_text(encoding="utf-8")\n',
              b + 'registry = json.loads((ROOT / "skills/SKILL_REGISTRY.json").read_text(encoding="utf-8"))\n',
              b + 'design_entry = next(item for item in registry["skills"] if item["skill_id"] == "managing-design-documents")\n',
              b + 'for term in ("승인 결정", "하위 시스템", "GitHub", "책임 원본", "UNVERIFIED"):\n',
              n + 'self.assertIn(term, documents)\n',
              b + 'for term in ("승인 결정 지속 기록", "하위 시스템 통합", "GitHub"):\n',
              n + 'self.assertIn(term, workflow)\n',
              b + 'for tag in ("decision-tracking", "subsystem-checkpoint", "canonical-integration"):\n',
              n + 'self.assertIn(tag, design_entry["trigger_tags"])\n',
              b + 'self.assertIn("하위 시스템 checkpoint", design_entry["use_when"][0])\n',
              "\n",
          ]
          path.write_text("".join(lines[:start] + replacement + lines[end:]), encoding="utf-8")
          Path(".github/workflows/fix-design-decision-sync-test-v2.yml").unlink()
          PY

          python -m py_compile tests/test_game_project_operating_system_structure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_game_project_operating_system_structure.py .github/workflows/fix-design-decision-sync-test-v2.yml
          git commit -m "test: 결정 추적 회귀 테스트 문법 복구"
          git push origin HEAD:docs/design-decision-sync-governance
