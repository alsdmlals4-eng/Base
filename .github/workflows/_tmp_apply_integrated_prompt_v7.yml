name: Apply Integrated Prompt v7 Patch

# One-time PR-head patch. Temporary files are removed through the connected GitHub API after the result commit.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - tools/_tmp_apply_integrated_prompt_v7.py
      - .github/workflows/_tmp_apply_integrated_prompt_v7.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/integrated-vertical-slice-prompt-v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrated-vertical-slice-prompt-v7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified non-workflow patch
        run: python tools/_tmp_apply_integrated_prompt_v7.py
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SKILL_REGISTRY.json \
            docs/knowledge/vertical-slice/SKILL_ORCHESTRATION_AND_EVIDENCE.md \
            .github/reference-freshness.json
          git diff --cached --check
          git commit -m "chore: apply integrated prompt v7 propagation patch"
          git push origin HEAD:agent/integrated-vertical-slice-prompt-v7
