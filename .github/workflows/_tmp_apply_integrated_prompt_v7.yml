name: Apply Integrated Prompt v7 Patch

on:
  push:
    branches:
      - agent/integrated-vertical-slice-prompt-v7
    paths:
      - tools/_tmp_apply_integrated_prompt_v7.py
      - .github/workflows/_tmp_apply_integrated_prompt_v7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrated-vertical-slice-prompt-v7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified patch and remove temporary files
        run: python tools/_tmp_apply_integrated_prompt_v7.py
      - name: Verify temporary files removed
        shell: bash
        run: |
          test ! -e tools/_tmp_apply_integrated_prompt_v7.py
          test ! -e .github/workflows/_tmp_apply_integrated_prompt_v7.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: apply integrated prompt v7 propagation patch"
          git push origin HEAD:agent/integrated-vertical-slice-prompt-v7
