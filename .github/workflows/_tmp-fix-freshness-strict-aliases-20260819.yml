name: Temporary freshness strict alias repair

on:
  push:
    branches:
      - refactor/sequential-part-coordinator-20260819
    paths:
      - tools/_tmp_fix_freshness_strict_aliases_20260819.py
      - .github/workflows/_tmp-fix-freshness-strict-aliases-20260819.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/_tmp_fix_freshness_strict_aliases_20260819.py
      - .github/workflows/_tmp-fix-freshness-strict-aliases-20260819.yml

permissions:
  contents: write

concurrency:
  group: tmp-freshness-strict-alias-20260819
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sequential-part-coordinator-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Apply strict-alias repair and companion regression
        shell: bash
        run: |
          python tools/_tmp_fix_freshness_strict_aliases_20260819.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_consolidated_skill_references.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":'
          if 'test_legacy_alias_table_separates_strict_ids_from_compatibility_names' not in text:
              method = r'''

              def test_legacy_alias_table_separates_strict_ids_from_compatibility_names(self) -> None:
                  aliases = (ROOT / "skills/LEGACY_SKILL_ALIASES.md").read_text(encoding="utf-8")
                  self.assertIn("엄격 실행 ID", aliases)
                  self.assertIn("| `grill-me`, `grillme`, `Grill Me`", aliases)
                  self.assertIn("| — |", aliases)
                  self.assertIn("`legacy-retention-archives`", aliases)
                  self.assertIn("`asset-store-first`, `godot-asset-search-first`, `commercial-plugin-search`", aliases)
          '''
              if marker not in text:
                  raise SystemExit('consolidated skill reference main marker missing')
              text = text.replace(marker, method + marker, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Rebuild Base generated artifacts from Registry
        run: python tools/build_base_v9_artifacts.py --write
      - name: Verify focused fixes before commit
        shell: bash
        run: |
          TRUSTED_HISTORY_COMMIT="$(git rev-parse origin/main)"
          python -m py_compile tools/check_canonical_reference_freshness.py tests/test_reference_freshness.py tests/test_gpt_codex_workflow_contract.py tests/test_consolidated_skill_references.py
          python -m unittest tests.test_reference_freshness tests.test_gpt_codex_workflow_contract tests.test_consolidated_skill_references -v
          python tools/check_base_v9_integrity.py --trusted-history-commit "$TRUSTED_HISTORY_COMMIT"
          python tools/build_base_v9_artifacts.py --check
      - name: Commit durable non-workflow changes
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-fix-freshness-strict-aliases-20260819.yml
          git rm tools/_tmp_fix_freshness_strict_aliases_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: distinguish strict legacy ids and refresh generated artifacts"
      - name: Verify canonical freshness on committed head and push
        shell: bash
        run: |
          TRUSTED_HISTORY_COMMIT="$(git rev-parse origin/main)"
          python tools/check_canonical_reference_freshness.py --config .github/reference-freshness.json --base "$TRUSTED_HISTORY_COMMIT" --head HEAD
          git pull --rebase origin refactor/sequential-part-coordinator-20260819
          git push origin HEAD:refactor/sequential-part-coordinator-20260819
