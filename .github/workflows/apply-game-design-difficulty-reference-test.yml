name: Apply Difficulty Test Freshness Registration

on:
  push:
    branches:
      - feat/game-design-difficulty-workflow
    paths:
      - "tools/apply_game_design_difficulty_reference_test.py"
      - ".github/workflows/apply-game-design-difficulty-reference-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-game-design-difficulty-reference-test
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/game-design-difficulty-workflow
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Register dedicated test in freshness policy
        run: |
          python -m py_compile tools/apply_game_design_difficulty_reference_test.py
          python tools/apply_game_design_difficulty_reference_test.py

      - name: Validate focused contracts
        run: |
          python -m py_compile \
            tests/test_game_design_difficulty_workflow.py \
            tests/test_evidence_based_game_development_knowledge.py
          python -m unittest \
            tests/test_game_design_difficulty_workflow.py \
            tests/test_evidence_based_game_development_knowledge.py \
            -v

      - name: Commit only freshness configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reference-freshness.json
          git diff --cached --check
          git commit -m "test: register game design difficulty freshness contract"
          git pull --rebase origin feat/game-design-difficulty-workflow
          git push origin HEAD:feat/game-design-difficulty-workflow
