name: Validate Loop Capsule to SHADOW Adapter

on:
  pull_request:
    paths:
      - "tools/loop_capsule_shadow_adapter/**"
      - "tools/loop_capsule_to_shadow.py"
      - "tests/test_loop_capsule_shadow_adapter*.py"
      - "docs/LOOP_ENGINEERING_CAPSULE_SHADOW_ADAPTER.md"
      - "docs/evidence/2026-08-14-loop-capsule-shadow-adapter.md"
      - ".github/workflows/validate-loop-capsule-shadow-adapter.yml"
  push:
    branches:
      - m35-capsule-shadow-adapter-20260814
    paths:
      - "tools/loop_capsule_shadow_adapter/**"
      - "tools/loop_capsule_to_shadow.py"
      - "tests/test_loop_capsule_shadow_adapter*.py"
      - "docs/LOOP_ENGINEERING_CAPSULE_SHADOW_ADAPTER.md"
      - "docs/evidence/2026-08-14-loop-capsule-shadow-adapter.md"
      - ".github/workflows/validate-loop-capsule-shadow-adapter.yml"

permissions:
  contents: read

jobs:
  adapter-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Compile and test deterministic adapter
        run: |
          python -m compileall -q tests/test_loop_capsule_shadow_adapter.py
          python -m unittest tests.test_loop_capsule_shadow_adapter -v
          git diff --check

  adapter-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Test deterministic adapter on Windows
        shell: pwsh
        run: |
          python -m unittest tests.test_loop_capsule_shadow_adapter -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
