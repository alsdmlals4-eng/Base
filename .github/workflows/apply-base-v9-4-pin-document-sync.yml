name: Apply Base v9.4 Pin Document Sync

on:
  pull_request:
    paths:
      - "tools/apply_base_v9_4_pin_document_sync.py"
      - ".github/workflows/apply-base-v9-4-pin-document-sync.yml"

permissions:
  contents: write

jobs:
  apply-pin-document-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Synchronize proposal and changelog text
        run: python tools/apply_base_v9_4_pin_document_sync.py
      - name: Commit exact document synchronization
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Pin documents already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "[수정제안서]/BCP-2026-003-ai-model-prompt-cost-optimization/PROPOSAL.md" \
            "[수정제안서]/BCP-2026-004-ai-instruction-context-ui-motion/PROPOSAL.md" \
            docs/CHANGELOG.md
          git commit -m "release: synchronize Base v9.4 pin documents"
          git push origin "HEAD:${HEAD_REF}"
