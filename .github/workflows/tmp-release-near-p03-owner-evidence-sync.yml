name: Temporary P03 owner-evidence sync

on:
  push:
    branches:
      - feat/release-near-vertical-slice-first-v2-20260820

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p03-owner-evidence-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-near-vertical-slice-first-v2-20260820
          fetch-depth: 0
      - name: Align P03 synchronization owner semantics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing: {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, block: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  return
              p.write_text(text.rstrip() + "\n\n" + block.strip() + "\n", encoding="utf-8")

          skill = "skills/synchronizing-local-and-github-state/SKILL.md"
          protocol = "skills/synchronizing-local-and-github-state/references/safe-sync-protocol.md"
          test = "tests/test_concurrent_git_sync_preflight_contract.py"
          learning = "skills/synchronizing-local-and-github-state/LEARNING_LOG.md"

          replace_once(
              skill,
              "다른 채팅 또는 독립 workstream의 Branch·path·PR은 같은 Goal처럼 보여도 기본적으로 별개다.\n\n```text\nOTHER_CHAT_BRANCH_PATH_PR: DO_NOT_TOUCH_BY_DEFAULT\nEXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_EXCEPTION\n```\n\n`same goal`은 `same workstream`의 증거가 아니다. `different workstream`이면 사용자의 현재 명시 승인 없이 checkout/write/rebase/close/merge/selective-copy를 수행하지 않는다.\n",
              "PR·Branch·path의 존재와 **현재 활성 write owner**는 별개다.\n\n```text\nOPEN_PR_IS_NOT_ACTIVE_WORKSTREAM\nCURRENT_OWNER_EVIDENCE_REQUIRED\nACTIVE_INDEPENDENT_WORKSTREAMS_REMAIN_PROTECTED_WHEN_ACTUALLY_ACTIVE\nCURRENT_COORDINATOR_TAKEOVER_WHEN_NO_ACTIVE_OWNER\nEXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_ACTIVE_OTHER_WORKER_EXCEPTION\n```\n\n`same goal`은 `same workstream`의 증거가 아니지만, `different workstream`이라는 분류만으로 현재 활성 owner를 추정하지도 않는다. 실제 `ACTIVE_OTHER_WORKER` evidence가 있을 때만 mutation-protected이며, current owner evidence가 없으면 open PR은 coordinator backlog로 재분류할 수 있다.\n",
          )
          replace_once(
              skill,
              "- `copy-integrate`: **same workstream** 또는 사용자가 현재 작업에서 명시적으로 흡수 승인한 `different workstream`의 owner delta를 latest completed `main` 위 별도 `PROVISIONAL_INTEGRATION` Branch에서 선택적으로 재현·흡수한다.",
              "- `copy-integrate`: **same workstream**, `NO_ACTIVE_OWNER_EVIDENCE`로 판정된 coordinator takeover backlog, 또는 사용자가 실제 `ACTIVE_OTHER_WORKER`를 명시적으로 takeover 승인한 owner delta를 latest completed `main` 위 별도 `PROVISIONAL_INTEGRATION` Branch에서 선택적으로 재현·흡수한다.",
          )
          replace_once(
              skill,
              "current_workstream_identity:\nowner_workstream_identity:\ncross_workstream_absorption_authorized: false | true\nsource_main_sha:",
