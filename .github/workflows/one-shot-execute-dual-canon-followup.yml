name: One-shot execute dual canon semantic follow-up

on:
  push:
    branches:
      - work/846-blueprint-progress-incremental-revision
    paths:
      - .github/workflows/one-shot-execute-dual-canon-followup.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: work/846-blueprint-progress-incremental-revision
          fetch-depth: 0

      - name: Verify bounded temporary state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "work/846-blueprint-progress-incremental-revision"
          git merge-base --is-ancestor e926c67ba102b9556f4342ea21f0dbaaa1122aa5 HEAD
          git diff --name-only e926c67ba102b9556f4342ea21f0dbaaa1122aa5..HEAD | sort > /tmp/actual_paths.txt
          printf '%s\n' \
            .github/workflows/one-shot-execute-dual-canon-followup.yml \
            .github/workflows/one-shot-federated-dual-canon-followup.yml \
            .github/workflows/one-shot-repair-dual-canon-followup.yml \
            | sort > /tmp/expected_paths.txt
          diff -u /tmp/expected_paths.txt /tmp/actual_paths.txt

      - name: Execute corrected semantic patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import traceback

          source_path = Path('.github/workflows/one-shot-federated-dual-canon-followup.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = (
              '      - name: Apply semantic and consumer corrections\n'
              '        shell: python\n'
              '        run: |\n'
          )
          end_marker = '\n      - name: Run focused semantic regressions'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('unable to locate the bounded semantic patch block')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script_lines = []
          for line in block.splitlines():
              if line and not line.startswith('          '):
                  raise SystemExit(f'unexpected YAML block indentation: {line!r}')
              script_lines.append(line[10:] if line else '')
          script = '\n'.join(script_lines) + '\n'
          old = (
              'for path in ACTIVE_ROUTING_SURFACES:\n'
              '    replace_required(path, OLD_ROUTE, NEW_ROUTE)\n'
          )
          new = (
              'for path in ACTIVE_ROUTING_SURFACES:\n'
              '    content = load(path)\n'
              '    if OLD_ROUTE in content:\n'
              '        content = content.replace(OLD_ROUTE, NEW_ROUTE)\n'
              '    elif NEW_ROUTE not in content:\n'
              '        content = content.rstrip() + "\\n\\n" + NEW_ROUTE + "\\n"\n'
              '    save(path, content)\n'
          )
          if script.count(old) != 1:
              raise SystemExit('expected exactly one strict route loop in extracted patch')
          script = script.replace(old, new, 1)

          diagnostic = Path('docs/reviews/DUAL_CANON_FOLLOWUP_ERROR.txt')
          try:
              exec(compile(script, str(source_path), 'exec'), {'__name__': '__main__'})
          except BaseException:
              error = traceback.format_exc()
              subprocess.run(['git', 'reset', '--hard', 'HEAD'], check=True)
              diagnostic.parent.mkdir(parents=True, exist_ok=True)
              diagnostic.write_text(error, encoding='utf-8', newline='\n')
              raise
          else:
              diagnostic.unlink(missing_ok=True)

      - name: Run focused semantic regressions
        shell: bash
        run: |
          set -uo pipefail
          set +e
          (
            set -e
            python -m unittest \
              tests.test_federated_dual_canon_contract \
              tests.test_repository_first_workspace_contract \
              tests.test_notion_project_workspace_contract \
              tests.test_blueprint_progress_incremental_revision_contract -v
            python -m py_compile \
              tests/test_federated_dual_canon_contract.py \
              tests/test_repository_first_workspace_contract.py \
              tests/test_notion_project_workspace_contract.py \
              tests/test_blueprint_progress_incremental_revision_contract.py
            git diff --check
          ) 2>&1 | tee /tmp/dual-canon-focused-test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          if test "$status" -ne 0; then
            git reset --hard HEAD
            mkdir -p docs/reviews
            cp /tmp/dual-canon-focused-test-output.txt docs/reviews/DUAL_CANON_FOLLOWUP_ERROR.txt
            exit "$status"
          fi

      - name: Commit correction and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-execute-dual-canon-followup.yml
          rm .github/workflows/one-shot-federated-dual-canon-followup.yml
          rm .github/workflows/one-shot-repair-dual-canon-followup.yml
          rm -f docs/reviews/DUAL_CANON_FOLLOWUP_ERROR.txt
          git diff --check
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add -A
          git commit -m "fix: align dual canon semantics and consumers"
          git push origin HEAD:work/846-blueprint-progress-incremental-revision

      - name: Preserve diagnostic on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/reviews/DUAL_CANON_FOLLOWUP_ERROR.txt; then
            git config user.name "alsdmlals4-eng"
            git config user.email "alsdmlals4@gmail.com"
            git add docs/reviews/DUAL_CANON_FOLLOWUP_ERROR.txt
            git commit -m "test: preserve dual canon follow-up diagnostic"
            git push origin HEAD:work/846-blueprint-progress-incremental-revision
          fi
