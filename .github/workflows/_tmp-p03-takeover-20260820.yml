name: Temporary P03 takeover contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_p03_takeover_contract.py'
      - '.github/workflows/_tmp-p03-takeover-20260820.yml'
      - 'skills/running-adversarial-review-and-refinement/**'
      - 'skills/synchronizing-local-and-github-state/**'
      - 'templates/quality/POST_MERGE_ADVERSARIAL_REVIEW.md'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_p03_takeover_contract -v
