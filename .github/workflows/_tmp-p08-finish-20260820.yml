name: Temporary P08 finish runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-p08-finish-20260820.yml'

permissions:
  contents: write

concurrency:
  group: tmp-p08-finish-20260820
  cancel-in-progress: true

jobs:
  finish:
    if: github.head_ref == 'integrate/p08-current-main-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/p08-current-main-20260820
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rehydrate reviewed P08 semantic delta
        shell: bash
        run: |
          git fetch origin 2b83d5b227259f66aacfed5ccb822c67ff414d67
          python tools/_tmp_apply_p08_takeover_20260820.py
      - name: Remove temporary migration surfaces and commit candidate
        shell: bash
        run: |
          git rm -f \
            .github/workflows/_tmp-p08-red-20260820.yml \
            .github/workflows/_tmp-p08-apply-20260820.yml \
            .github/workflows/_tmp-p08-finish-20260820.yml \
            tools/_tmp_apply_p08_takeover_20260820.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(p08): integrate current-canon AI operations boundaries'
      - name: Verify candidate before push
        shell: bash
        run: |
          python -m pip install --requirement .github/validation-requirements.txt
          python -m unittest \
            tests.test_p08_ai_operations_contract \
            tests.test_skill_routing_precision_policy \
            -v
          BASE_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
          git diff --check HEAD~1 HEAD
      - name: Push verified durable candidate
        shell: bash
        run: |
          git pull --rebase origin integrate/p08-current-main-20260820
          git push origin HEAD:integrate/p08-current-main-20260820
