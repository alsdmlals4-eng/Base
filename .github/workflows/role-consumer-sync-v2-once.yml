name: One-shot GPT role consumer sync v2

on:
  push:
    branches:
      - workflow/gpt-codex-role-split-20260825
    paths:
      - ".github/workflows/role-consumer-sync-v2-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Sync active consumers and restore preserved semantics
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_if_present(path, old, new):
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new))

          # START_HERE active route.
          replace_if_present(
              "START_HERE.md",
              "| Codex 작업 명세·전환 | `maintaining-project-context-and-handoff: on-demand-codex-handoff` | `docs/GPT_CODEX_WORKFLOW_POLICY.md` + `skills/maintaining-project-context-and-handoff/SKILL.md` |",
              "| 실제 게임 프로젝트 Godot 제품 구현·Codex 인계 | `maintaining-project-context-and-handoff: codex-godot-implementation-handoff` | `docs/GPT_CODEX_WORKFLOW_POLICY.md` + `templates/project-operations/CODEX_IMPLEMENTATION_WORK_INSTRUCTION.md` |",
          )

          # Documentation Map ownership boundary.
          p = "docs/DOCUMENTATION_MAP.md"
          text = read(p)
          if "### GPT / Codex 작업 책임" not in text:
              anchor = "## 2. 권한 경계\n\n"
              section = '''### GPT / Codex 작업 책임\n\n```text\nGPT = Base·Notion·기획·검수·문서·표·이미지·운영 인프라\nCodex = 실제 게임 프로젝트의 Godot 제품 구현·GDScript·Scene·Resource·runtime/play test\nCODEX_NOT_GENERAL_REPOSITORY_EXECUTOR\n```\n\nBase Python test·Registry/generated·CI contract는 코드 형식이어도 GPT governance 작업이다. Codex handoff는 `ACTUAL_GODOT_PRODUCT_IMPLEMENTATION_EXISTS`일 때만 프로젝트별로 만든다.\n\n'''
              if anchor not in text:
                  raise SystemExit("Documentation Map authority anchor missing")
              text = text.replace(anchor, anchor + section, 1)
          text = text.replace(
              "Notion 변경이 구조화 데이터나 구현 변경을 요구하면 `SYNC_BEFORE_IMPLEMENTATION`으로 repository에 동기화한 뒤 구현한다.",
              "Notion 변경이 실제 게임 제품 runtime 변경을 요구하면 GPT가 기획/정본을 먼저 동기화하고, `ACTUAL_GODOT_PRODUCT_IMPLEMENTATION_EXISTS`인 범위만 프로젝트별 Codex Godot Work Instruction으로 넘긴다. Base/Notion/non-product 변경은 GPT가 직접 닫는다.",
          )
          write(p, text)

          # Codex dynamic bootstrap compatibility vocabulary.
          p = "templates/custom-instructions.codex.md"
          text = read(p)
          if "Dynamic authority bootstrap vocabulary" not in text:
              text = text.rstrip() + '''\n\n## Dynamic authority bootstrap vocabulary\n\n```text\nstable bootstrap\nDOMAIN_SPLIT_CANON\nAGENTS.md\nSTART_HERE.md\nActive Context\nNOTION_HUMAN_FACING_CANON\nREPOSITORY_STRUCTURED_CANON\nREPOSITORY_RUNTIME_TRUTH\n현재 세션\nactual evidence\n```\n\n이 vocabulary는 cold-start authority compatibility를 보존하기 위한 계약이며 Codex 범위를 Base maintenance로 넓히는 의미가 아니다.\n'''
              write(p, text)

          # Common reusable lesson required by freshness coupling.
          p = "skills/SKILL_LEARNING_LOG.md"
          text = read(p)
          title = "Product responsibility, not code shape, determines Codex ownership"
          if title not in text:
              entry = f'''## 2026-08-25 — {title}\n\n- **상태:** `PATTERN_CANDIDATE`\n- **Trigger:** GPT↔Codex 역할 분리 중 Base Python test·Registry/generated·CI를 코드라는 이유로 Codex 영역에 잘못 포함했다.\n- **Finding:** Base governance code와 game product code는 모두 코드 형식일 수 있지만 책임 owner가 다르다. 파일 확장자나 GitHub write 여부를 owner 기준으로 쓰면 Base/Notion 유지보수와 Godot 제품 구현의 경계가 붕괴한다.\n- **Decision:** `GPT_BASE_NOTION_GOVERNANCE_OWNER`가 Base·Notion·문서·표·이미지·Registry/generated·CI/test contract를 소유하고, `CODEX_GODOT_PRODUCT_IMPLEMENTATION_OWNER`는 실제 게임 프로젝트의 GDScript·Scene·Resource·runtime wiring·build/export·Godot implementation/runtime/play test에만 진입한다.\n- **Evidence:** `docs/GPT_CODEX_WORKFLOW_POLICY.md`, `docs/WORK_MODE_AND_SKILL_ROUTING.md`, `skills/maintaining-project-context-and-handoff/SKILL.md`, `templates/project-operations/CODEX_IMPLEMENTATION_WORK_INSTRUCTION.md`, PR #674.\n- **Boundary:** 실제 Godot runtime PASS는 별도 project evidence가 필요하다.\n- **Next trigger:** Base 작업이 다시 Codex로 라우팅되거나 GPT가 실제 Godot 제품 구현을 직접 누적하려 할 때 재검토한다.\n\n'''
              text = text.replace("# Base Skill Learning Log\n\n", "# Base Skill Learning Log\n\n" + entry, 1)
              write(p, text)

          # Preserve dynamic policy vocabulary expected by active AI-operation contracts.
          p = "docs/GPT_CODEX_WORKFLOW_POLICY.md"
          text = read(p)
          compatibility = '''\n## 16. 기존 동적 실행·검수 계약 보존\n\n다음 vocabulary와 의미는 owner 변경과 무관하게 유지한다.\n\n```text\nCODEX_PREFLIGHT_OPTIONAL\nPLAN_REVIEW_ONLY\nCONTINUOUS_WORK_EXECUTOR_HANDOFF\nDEFERRED_EXTERNAL_EXECUTOR\nAPPROVED_ITEM_INHERITS_MERGE_AUTHORITY\nAUTO_MERGE_AFTER_REQUIRED_CHECKS\nAGENT_MERGE_REQUIRED\nREPOSITORY_STRUCTURED_CANON\nNOTION_HUMAN_FACING_CANON\n```\n\n- `CODEX_PREFLIGHT_OPTIONAL`: 고위험 Godot 제품 구현에만 선택적 read-only technical preflight.\n- `CONTINUOUS_WORK_EXECUTOR_HANDOFF`: 같은 승인 범위의 실제 Godot product task를 Codex에 넘길 수 있지만 Base/Notion task를 넘기는 뜻은 아니다.\n- `DEFERRED_EXTERNAL_EXECUTOR`: 실제 Godot executor 경로가 없을 때 해당 product task만 보류하고 GPT-owned 독립 작업은 계속한다.\n- `APPROVED_ITEM_INHERITS_MERGE_AUTHORITY`: 동일 승인 범위는 새 차단 finding이 없으면 추가 재승인 없이 repository gate를 통과해 병합할 수 있다.\n- `AUTO_MERGE_AFTER_REQUIRED_CHECKS` + `AGENT_MERGE_REQUIRED`: required checks·exact head·thread/ruleset 조건 뒤 허용 병합을 수행한다.\n'''
          if "## 16. 기존 동적 실행·검수 계약 보존" not in text:
              write(p, text.rstrip() + "\n" + compatibility)

          # Restore long-horizon non-regression wording without broadening Codex.
          p = "docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md"
          text = read(p)
          text = text.replace(
              "`BETTER_ALTERNATIVE_SEARCH`와 `LONG_TERM_PLAN_FIT_REQUIRED`를 매 중요 checkpoint에서 재확인한다. 최종 보고에는 왜 현재 후보 중 **장기적으로 최선**인지와 재검토 조건을 남긴다.",
              "`BETTER_ALTERNATIVE_SEARCH`는 최초 권장안을 보호하지 않는다. 새 증거가 생기면 **장기적으로 더 강한 방안**인지 다시 비교한다. `LONG_TERM_PLAN_FIT_REQUIRED`를 매 중요 checkpoint에서 재확인하고 최종 보고에는 왜 현재 후보 중 **장기적으로 최선**인지와 재검토 조건을 남긴다.",
          )
          if "LEGACY_ABSORB_VERIFY_REMOVE" not in text:
              marker = "## 14. 적대적 검토 종료 조건"
              legacy = '''## 13A. Legacy 흡수·검증·제거\n\n`LEGACY_ABSORB_VERIFY_REMOVE`: 더 이상 사용하지 않는 Figma, 전용 local visual Tool/Hub, QA Evidence Studio, external HTML workspace, Google Sheets 같은 구형 surface는 `UNIQUE / DUPLICATE / OBSOLETE`로 한 번 분류한다. UNIQUE한 규칙·데이터·증거·재사용 원리만 현재 Notion/repository owner로 흡수하고 destination readback·consumer 확인 뒤 active route에서 retirement한다.\n\n`PAID_PLAN_GATE`: 현재 승인된 기본 유료 경로는 `GPT_PRO` 하나다. Notion은 Free 범위를 기본으로 하며 별도 API credit·SaaS·runner·compute/storage는 새 사용자 승인 전 도입하지 않는다.\n\n'''
              if marker not in text:
                  raise SystemExit("long horizon adversarial marker missing")
              text = text.replace(marker, legacy + marker, 1)
          if "사용자 학습형 완료보고" not in text:
              text = text.replace(
                  "## 19. 현재 한 줄",
                  "## 18A. 사용자 학습형 완료보고\n\n최종 보고는 파일 목록이 아니라 `작업 전 → 개선된 기능 → 실제 사용 예 → 기대효과 → 아직 개선되지 않은 범위`를 사람이 이해할 수 있게 설명한다.\n\n## 19. 현재 한 줄",
              )
          write(p, text)

          # Long-horizon test owner assertions.
          p = "tests/test_base_long_horizon_work_contract.py"
          text = read(p)
          text = text.replace(
              '            "GPT_FIRST_PLANNING_AND_REVIEW",\n            "OPTIONAL_CODEX_EXECUTOR",',
              '            "GPT_BASE_NOTION_GOVERNANCE_OWNER",\n            "CODEX_GODOT_PRODUCT_IMPLEMENTATION_OWNER",\n            "CODEX_NOT_GENERAL_REPOSITORY_EXECUTOR",',
          )
          text = text.replace(
              '        self.assertIn("GPT_FIRST_PLANNING_AND_REVIEW", codex)\n        self.assertIn("OPTIONAL_CODEX_EXECUTOR", codex)',
              '        self.assertIn("GPT_BASE_NOTION_GOVERNANCE_OWNER", codex)\n        self.assertIn("CODEX_GODOT_PRODUCT_IMPLEMENTATION_OWNER", codex)\n        self.assertIn("CODEX_NOT_GENERAL_REPOSITORY_EXECUTOR", codex)',
          )
          write(p, text)

          # Base partition test owner assertion.
          p = "tests/test_base_partition_contract.py"
          text = read(p)
          text = text.replace(
              '        self.assertIn("OPTIONAL_CODEX_EXECUTOR", worker)',
              '        self.assertIn("BASE_GOVERNANCE = GPT", worker)\n        self.assertIn("CODEX_NOT_GENERAL_REPOSITORY_EXECUTOR", worker)',
          )
          write(p, text)

          # Explicit three-alternative section in Base Partition model.
          p = "docs/operations/BASE_PARTITION_OPERATING_MODEL.md"
          text = read(p)
          if "### A · 9개 별도 채팅 유지" not in text:
              marker = "## Final Integration"
              section = '''## 대안 검토\n\n### A · 9개 별도 채팅 유지\nContext 재수화와 handoff 관리비가 커서 **REJECT**.\n\n### B · 한 coordinator 채팅\nPart별 semantic checkpoint와 rollback을 유지하면서 한 GPT coordinator가 순차 처리한다. **ADOPT**. 새 Part 채팅을 9개 만들지 않는다.\n\n### C · Part 자체 제거\n책임·학습·source coverage가 흐려져 **REJECT**.\n\n`BETTER_ALTERNATIVE_SEARCH`와 `LONG_TERM_PLAN_FIT_REQUIRED`를 유지하고, 동시작업·context 규모·Part 결합도가 달라지면 **재검토**한다.\n\n'''
              if marker not in text:
                  raise SystemExit("Base Partition final integration marker missing")
              text = text.replace(marker, section + marker, 1)
              write(p, text)

          # Meaningful routing companion required by canonical freshness.
          p = "tests/test_skill_routing_governance.py"
          text = read(p)
          method_name = "test_base_handoff_registry_routes_only_godot_product_implementation"
          if method_name not in text:
              method = '''\n    def test_base_handoff_registry_routes_only_godot_product_implementation(self) -> None:\n        registry = json.loads((REPOSITORY_ROOT / "skills/SKILL_REGISTRY.json").read_text(encoding="utf-8"))\n        handoff = next(item for item in registry["skills"] if item["skill_id"] == "maintaining-project-context-and-handoff")\n        self.assertIn("godot-product-implementation-handoff", handoff["trigger_tags"])\n        self.assertIn("실제 게임 프로젝트", "\\n".join(handoff["use_when"]))\n        self.assertIn("Base 정책", "\\n".join(handoff["do_not_use_when"]))\n        self.assertIn("Base/Notion 작업을 Codex에 넘김", "\\n".join(handoff["review_triggers"]))\n\n'''
              text = text.replace("\n\nif __name__ == \"__main__\":", method + "\nif __name__ == \"__main__\":", 1)
              write(p, text)

      - name: Focused verification
        run: |
          python -m unittest \
            tests.test_gpt_codex_workflow_contract \
            tests.test_p08_ai_operations_contract \
            tests.test_one_shot_local_executor_bootstrap_contract \
            tests.test_base_long_horizon_work_contract \
            tests.test_base_partition_contract \
            tests.test_pr530_selective_integration_contract \
            tests.test_skill_routing_governance -v
          python tools/build_base_v9_artifacts.py --check

      - name: Remove one-shot workflows and commit
        run: |
          rm -f .github/workflows/role-consumer-sync-once.yml
          rm -f .github/workflows/role-consumer-sync-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No consumer sync delta"
            exit 0
          fi
          git commit -m "chore: sync GPT-owned Base role consumers [role-consumer-v2]"
          git push origin HEAD:workflow/gpt-codex-role-split-20260825
