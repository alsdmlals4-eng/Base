name: Validate Skill Routing Precision

on:
  pull_request:
    paths:
      - "skills/**"
      - "docs/knowledge/ai/SKILL_ROUTING_PRECISION_GUIDE.md"
      - "tests/test_skill_routing_precision_policy.py"
      - ".github/workflows/validate-skill-routing-precision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sparse skill routing contract
        run: python -m unittest tests.test_skill_routing_precision_policy -v
