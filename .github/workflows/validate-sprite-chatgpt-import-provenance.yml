name: Validate Sprite Subscription Import Portability

on:
  pull_request:
    paths:
      - "tools/base-tool-contracts/src/base_tool_contracts/staging.py"
      - "tools/base-tool-contracts/tests/test_figma_routing.py"
      - "tools/base-tool-contracts/tests/test_windows_portable_staging.py"
      - "tools/sprite-animation-studio/src/sprite_animation_studio/service.py"
      - "tools/sprite-animation-studio/pyproject.toml"
      - "tools/sprite-animation-studio/tests/test_import_api.py"
      - ".github/workflows/validate-sprite-chatgpt-import-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprite-subscription-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portability-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Sprite Studio test dependencies
        run: >-
          python -m pip install
          -e './tools/base-tool-contracts'
          -e './tools/sprite-animation-studio[dev]'
      - name: Run portable Asset Vault staging regression
        run: >-
          python -m pytest -q
          tools/base-tool-contracts/tests/test_windows_portable_staging.py
          tools/base-tool-contracts/tests/test_figma_routing.py::test_staging_write_replaces_a_hard_link_without_overwriting_its_external_inode
      - name: Run ChatGPT subscription pose/effect import smoke
        working-directory: tools/sprite-animation-studio
        run: >-
          python -m pytest -q
          tests/test_import_api.py::test_chatgpt_included_pose_and_effect_imports_use_subscription_path
