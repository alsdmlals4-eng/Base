name: Apply Issue 443 Production Patch

on:
  push:
    branches:
      - 'fix/real-a2-windows-utf8-blocked-receipt-20260816'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing validation dependencies
        run: python -m pip install -r requirements-publication.txt
      - name: Apply minimal production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/control_plane.py",
              '    "authority_sha", "run_id", "a2_state", "a2_receipt_digest", "provider_mode",\n    "a3_auto_merge", "scheduler",\n',
              '    "authority_sha", "run_id", "a2_state", "a2_finding_code", "a2_provider_error_type",\n    "a2_receipt_digest", "provider_mode", "a3_auto_merge", "scheduler",\n',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/control_plane.py",
              '                text=True,\n                capture_output=True,\n                shell=False,\n',
              '                text=True,\n                encoding="utf-8",\n                errors="replace",\n                capture_output=True,\n                shell=False,\n',
          )
          replace(
              "tools/loop_a2_runtime/provider_gate.py",
              '            text=True,\n            capture_output=True,\n            timeout=_CODEX_LOGIN_STATUS_TIMEOUT_SECONDS,\n',
              '            text=True,\n            encoding="utf-8",\n            errors="replace",\n            capture_output=True,\n            timeout=_CODEX_LOGIN_STATUS_TIMEOUT_SECONDS,\n',
          )
          replace(
              "tools/loop_a2_runtime/codex_cli_transport.py",
              '                    text=True,\n                    capture_output=True,\n                    env=_safe_environment(),\n',
              '                    text=True,\n                    encoding="utf-8",\n                    errors="replace",\n                    capture_output=True,\n                    env=_safe_environment(),\n',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/runtime.py",
              '_DIGEST = re.compile(r"^[0-9a-f]{64}$")\n',
              '_DIGEST = re.compile(r"^[0-9a-f]{64}$")\n_PUBLIC_STATE = re.compile(r"^[A-Z][A-Z0-9_]{0,63}$")\n_PUBLIC_FINDING_CODE = re.compile(r"^[A-Z][A-Z0-9_]{0,127}$")\n_PUBLIC_PROVIDER_ERROR_TYPE = re.compile(r"^[A-Za-z_][A-Za-z0-9_.]{0,127}$")\n',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/runtime.py",
              'class LocalRuntimeError(RuntimeError):\n    def __init__(self, code: str, message: str) -> None:\n        self.code = code\n        super().__init__(f"{code}: {message}")\n',
              'class LocalRuntimeError(RuntimeError):\n    def __init__(\n        self,\n        code: str,\n        message: str,\n        *,\n        public_details: Mapping[str, str] | None = None,\n    ) -> None:\n        self.code = code\n        self.public_details = dict(public_details or {})\n        super().__init__(f"{code}: {message}")\n',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/runtime.py",
              '        return dict(value)\n\n    def execute(self, job: LocalA2Job) -> dict[str, object]:\n',
              '''        return dict(value)\n\n    def _blocked_receipt_diagnostics(\n        self,\n        stdout: str,\n        *,\n        job: LocalA2Job,\n        project_id: str,\n        source_sha: str,\n    ) -> dict[str, str]:\n        try:\n            value = json.loads(stdout)\n        except json.JSONDecodeError:\n            return {}\n        if not isinstance(value, dict):\n            return {}\n        required = {\n            "schema_version": 1,\n            "contract_role": "LOOP_A2_RUN_RECEIPT",\n            "project_id": project_id,\n            "run_id": job.run_id,\n            "expected_main_sha": source_sha,\n            "provider_mode": "REAL",\n            "integration_eligible": False,\n            "a3_auto_merge": "DISABLED",\n            "scheduler": "NOT_CONFIGURED",\n        }\n        if any(value.get(key) != expected for key, expected in required.items()):\n            return {}\n        package_id = value.get("package_id")\n        if not isinstance(package_id, str) or not package_id or len(package_id.encode("utf-8")) > 256:\n            return {}\n        state = value.get("state")\n        if (\n            not isinstance(state, str)\n            or state == "WAITING_INTEGRATION"\n            or _PUBLIC_STATE.fullmatch(state) is None\n        ):\n            return {}\n        digest = value.get("receipt_digest")\n        if not isinstance(digest, str) or _DIGEST.fullmatch(digest) is None:\n            return {}\n        finding_codes = value.get("finding_codes")\n        if (\n            not isinstance(finding_codes, list)\n            or len(finding_codes) > 64\n            or any(\n                not isinstance(code, str) or _PUBLIC_FINDING_CODE.fullmatch(code) is None\n                for code in finding_codes\n            )\n        ):\n            return {}\n        changed_paths = value.get("changed_paths")\n        if not isinstance(changed_paths, list):\n            return {}\n        provider_error_type = value.get("provider_error_type")\n        if (\n            provider_error_type is not None\n            and (\n                not isinstance(provider_error_type, str)\n                or _PUBLIC_PROVIDER_ERROR_TYPE.fullmatch(provider_error_type) is None\n            )\n        ):\n            return {}\n        details = {\n            "a2_state": state,\n            "a2_receipt_digest": digest,\n        }\n        if finding_codes:\n            details["a2_finding_code"] = finding_codes[0]\n        if isinstance(provider_error_type, str):\n            details["a2_provider_error_type"] = provider_error_type\n        return details\n\n    def execute(self, job: LocalA2Job) -> dict[str, object]:\n''',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/runtime.py",
              '                if completed.returncode != 0:\n                    raise LocalRuntimeError("A2_EXECUTION_BLOCKED", "REAL A2 process did not reach an eligible terminal state")\n',
              '                if completed.returncode != 0:\n                    public_details = self._blocked_receipt_diagnostics(\n                        stdout,\n                        job=job,\n                        project_id=project_id,\n                        source_sha=source_sha,\n                    )\n                    raise LocalRuntimeError(\n                        "A2_EXECUTION_BLOCKED",\n                        "REAL A2 process did not reach an eligible terminal state",\n                        public_details=public_details,\n                    )\n',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/service.py",
              'from __future__ import annotations\n\nfrom .job import JobContractError, LocalA2Job\n',
              'from __future__ import annotations\n\nimport re\n\nfrom .job import JobContractError, LocalA2Job\n',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/service.py",
              'from .runtime import LocalRuntimeError\n\n\nclass LocalExecutorService:\n',
              '''from .runtime import LocalRuntimeError\n\n\n_RUNTIME_PUBLIC_PATTERNS = {\n    "a2_state": re.compile(r"^[A-Z][A-Z0-9_]{0,63}$"),\n    "a2_finding_code": re.compile(r"^[A-Z][A-Z0-9_]{0,127}$"),\n    "a2_provider_error_type": re.compile(r"^[A-Za-z_][A-Za-z0-9_.]{0,127}$"),\n    "a2_receipt_digest": re.compile(r"^[0-9a-f]{64}$"),\n}\n\n\ndef _safe_runtime_public_details(error: LocalRuntimeError) -> dict[str, str]:\n    details = getattr(error, "public_details", None)\n    if not isinstance(details, dict):\n        return {}\n    result: dict[str, str] = {}\n    for key, pattern in _RUNTIME_PUBLIC_PATTERNS.items():\n        value = details.get(key)\n        if isinstance(value, str) and pattern.fullmatch(value) is not None:\n            result[key] = value\n    return result\n\n\nclass LocalExecutorService:\n''',
          )
          replace(
              "tools/loop-a2-local-executor/src/loop_a2_local_executor/service.py",
              '''        try:\n            receipt = self.runtime.execute(job)\n        except (LocalRuntimeError, ManagedRepositoryError) as exc:\n            public.update({"status": "BLOCKED", "code": exc.code})\n            self.control_plane.publish_terminal(job.issue_number, public, close=True)\n            return {"status": "BLOCKED", "code": exc.code, "issue_number": job.issue_number}\n''',
              '''        try:\n            receipt = self.runtime.execute(job)\n        except LocalRuntimeError as exc:\n            public.update({"status": "BLOCKED", "code": exc.code})\n            public.update(_safe_runtime_public_details(exc))\n            self.control_plane.publish_terminal(job.issue_number, public, close=True)\n            return {"status": "BLOCKED", "code": exc.code, "issue_number": job.issue_number}\n        except ManagedRepositoryError as exc:\n            public.update({"status": "BLOCKED", "code": exc.code})\n            self.control_plane.publish_terminal(job.issue_number, public, close=True)\n            return {"status": "BLOCKED", "code": exc.code, "issue_number": job.issue_number}\n''',
          )
          PY
      - name: Run focused GREEN regression
        shell: bash
        run: python tools/loop-a2-local-executor/tests/test_windows_utf8_blocked_receipt_diagnostics.py -v
      - name: Run existing Local Executor regression
        shell: bash
        run: python -m unittest discover -s tools/loop-a2-local-executor/tests -p 'test_*.py' -v
      - name: Commit verified production patch
        shell: bash
        run: |
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add \
            tools/loop-a2-local-executor/src/loop_a2_local_executor/control_plane.py \
            tools/loop-a2-local-executor/src/loop_a2_local_executor/runtime.py \
            tools/loop-a2-local-executor/src/loop_a2_local_executor/service.py \
            tools/loop_a2_runtime/provider_gate.py \
            tools/loop_a2_runtime/codex_cli_transport.py
          if git diff --cached --quiet; then
            echo "Production patch already present."
            exit 0
          fi
          git commit -m "fix: preserve REAL A2 Windows diagnostics"
          git push origin HEAD:fix/real-a2-windows-utf8-blocked-receipt-20260816
