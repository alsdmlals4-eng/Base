name: Validate Loop A2 Integration

on:
  pull_request:
    paths:
      - "tools/loop_a2_runtime/integration.py"
      - "tests/test_loop_a2_integration*.py"
      - "docs/evidence/2026-08-14-loop-a2-integration.md"
      - ".github/workflows/validate-loop-a2-integration.yml"
  push:
    branches: [main]
    paths:
      - "tools/loop_a2_runtime/integration.py"
      - "tests/test_loop_a2_integration*.py"
      - ".github/workflows/validate-loop-a2-integration.yml"

permissions:
  contents: read

jobs:
  integration-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile and test bounded integration
        run: |
          python -m py_compile tools/loop_a2_runtime/integration.py tests/test_loop_a2_integration.py tests/test_loop_a2_integration_adversarial.py
          python -m unittest tests.test_loop_a2_integration tests.test_loop_a2_integration_adversarial -v
          git diff --check

  integration-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Test bounded integration on Windows
        shell: pwsh
        run: |
          python -m unittest tests.test_loop_a2_integration tests.test_loop_a2_integration_adversarial -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
