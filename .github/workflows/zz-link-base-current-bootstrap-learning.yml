name: Link Base-current bootstrap learning reference

on:
  push:
    branches:
      - fix/base-current-project-work-bootstrap-20260902

permissions:
  contents: write

concurrency:
  group: link-base-current-bootstrap-learning
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/base-current-project-work-bootstrap-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Base validation dependencies
        run: python -m pip install -r .github/validation-requirements.txt

      - name: Assert bounded transport scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d406fb70d5da8925eec8d2a57cfd93be37ddda38 HEAD
          test "$(git diff --name-only d406fb70d5da8925eec8d2a57cfd93be37ddda38...HEAD)" = ".github/workflows/zz-link-base-current-bootstrap-learning.yml"

      - name: Link the scoped learning log from the owning Skill
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          skill = root / "skills/managing-project-intake-and-work-contract/SKILL.md"
          workflow = root / ".github/workflows/zz-link-base-current-bootstrap-learning.yml"
          relative = "references/base-current-project-work-bootstrap/LEARNING_LOG.md"
          text = skill.read_text(encoding="utf-8")
          if relative not in text:
              marker = "Do not copy the detailed playbook into this file."
              if marker not in text:
                  raise SystemExit("Base-current bootstrap pointer marker is missing")
              replacement = (
                  marker
                  + " Scoped learning and regression provenance: `"
                  + relative
                  + "`."
              )
              text = text.replace(marker, replacement, 1)
              skill.write_text(text, encoding="utf-8", newline="\n")
          workflow.unlink()
          PY

      - name: Commit the exact owner link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: link Base-current bootstrap learning evidence"

      - name: Verify package integrity and bootstrap behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_skill_package_integrity.SkillPackageIntegrityTests.test_every_packaged_reference_or_script_is_linked_from_its_skill \
            tests.test_p08_ai_operations_contract.P08AiOperationsContractTests.test_base_current_zero_install_bootstrap_is_integrated_with_scoped_learning \
            tests.test_base_current_project_work_bootstrap \
            -v
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base 96bee2700c8931b9262ad5a24a0664a400858f20 \
            --head HEAD

      - name: Push clean final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/zz-link-base-current-bootstrap-learning.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check HEAD^ HEAD
          git push origin HEAD:fix/base-current-project-work-bootstrap-20260902
