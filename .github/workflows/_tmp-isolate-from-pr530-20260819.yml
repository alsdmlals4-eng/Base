name: Temporary isolate coordinator from PR530

on:
  push:
    branches: [refactor/sequential-part-coordinator-20260819]
    paths:
      - tools/_tmp_isolate_from_pr530_20260819.py
      - .github/workflows/_tmp-isolate-from-pr530-20260819.yml
  pull_request:
    branches: [main]
    paths:
      - tools/_tmp_isolate_from_pr530_20260819.py
      - .github/workflows/_tmp-isolate-from-pr530-20260819.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sequential-part-coordinator-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Restore active-workstream-owned paths and write conflict-free policies
        run: python tools/_tmp_isolate_from_pr530_20260819.py
      - name: Verify coordinator isolation contracts
        run: |
          python tools/check_base_partition_scope.py --validate-manifest
          python -m unittest \
            tests.test_base_partition_contract \
            tests.test_sequential_part_coordinator_contract \
            tests.test_full_adversarial_loop_semantics \
            tests.test_human_home_self_contained_contract -v
          python tools/check_canonical_reference_freshness.py --config .github/reference-freshness.json --base origin/main --head HEAD
      - name: Commit durable changes
        shell: bash
        run: |
          git checkout -- .github/workflows/_tmp-isolate-from-pr530-20260819.yml
          git rm tools/_tmp_isolate_from_pr530_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: isolate coordinator changes from active PR 530"
          git pull --rebase origin refactor/sequential-part-coordinator-20260819
          git push origin HEAD:refactor/sequential-part-coordinator-20260819
