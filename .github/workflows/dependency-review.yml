name: Dependency Review

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/bun.lockb"
      - "**/bun.lock"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/poetry.lock"
      - "**/Pipfile.lock"
      - "**/uv.lock"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/go.mod"
      - "**/go.sum"
      - "**/Gemfile"
      - "**/Gemfile.lock"
      - "**/composer.json"
      - "**/composer.lock"
      - ".github/workflows/**"
      - "action.yml"
      - "action.yaml"
      - "**/action.yml"
      - "**/action.yaml"

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  temporary-serial-fiction-behavior-route-fix:
    if: ${{ github.event.pull_request.head.ref == 'feat/serial-fiction-writing-discipline' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/serial-fiction-writing-discipline
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Move primary fiction route to primary behavior evals
        run: python tools/tmp_serial_fiction_behavior_route_fix.py
      - name: Commit focused behavior route fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/SKILL_BEHAVIOR_EVALS.json \
            skills/SKILL_BEHAVIOR_COVERAGE_EVALS.json \
            tests/test_skill_behavior_adversarial_boundaries.py \
            docs/generated/BASE_SKILL_IMPLEMENTATION_EVIDENCE.md
          if git diff --cached --quiet; then
            echo "No mutation required."
            exit 0
          fi
          git commit -m "fix: place fiction primary route in primary behavior evals"
          git push origin HEAD:feat/serial-fiction-writing-discipline

  dependency-review:
    # The action cannot report whether dependency graph/security is enabled.
    # Owners opt in only after enabling the required repository capability.
    if: ${{ vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Review dependency changes
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
        with:
          fail-on-severity: high

  dependency-review-deferred:
    if: ${{ vars.DEPENDENCY_REVIEW_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record unavailable repository security capability
        run: echo "DEFERRED_UNTIL_REPOSITORY_SECURITY_ENABLED"
