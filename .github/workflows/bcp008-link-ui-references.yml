name: BCP008 Link UI References

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link:
    if: github.head_ref == 'agent/implement-bcp-008-spec-design-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Link references and verify package integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/auditing-and-refining-ui-art/SKILL.md")
          text = path.read_text(encoding="utf-8")
          anchor = "- [ux-ui-design-system-method.md](references/ux-ui-design-system-method.md)\n"
          addition = (
              "- [design-md-project-adapter.md](references/design-md-project-adapter.md)\n"
              "- [external-ui-procurement-and-anti-generic-quality.md]"
              "(references/external-ui-procurement-and-anti-generic-quality.md)\n"
          )
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("expected UI reference anchor not found")
              text = text.replace(anchor, anchor + addition, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python -m unittest \
            tests.test_skill_package_integrity \
            tests.test_reference_freshness \
            tests.test_game_ux_ui_system \
            -v
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base cabbc59b170c5da2bb1df7e4d4d535857dd35495 \
            --head HEAD
          git diff --check
      - name: Commit minimal package link fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bcp008-link-ui-references.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: link BCP-008 UI package references'
          git push origin HEAD:${GITHUB_HEAD_REF}
