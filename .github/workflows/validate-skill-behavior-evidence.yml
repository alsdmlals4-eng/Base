name: Validate Skill Behavior Evidence

on:
  pull_request:
    paths:
      - "skills/SKILL_BEHAVIOR_EVALS.json"
      - "skills/SKILL_BEHAVIOR_COVERAGE_EVALS.json"
      - "skills/SKILL_BEHAVIOR_RESULTS.template.json"
      - "skills/SKILL_IMPLEMENTATION_EVIDENCE.json"
      - "skills/evolving-project-discipline-skills/**"
      - "schemas/skill-behavior-results-v1.schema.json"
      - "schemas/external-ai-worktree-contract-v1.schema.json"
      - "templates/ai/DEEPSEEK_WORK_PACKAGE.md"
      - "templates/ai/EXTERNAL_AI_WORKTREE_CONTRACT.json"
      - "tools/check_skill_behavior_evals.py"
      - "tools/build_skill_implementation_evidence.py"
      - "tools/check_external_ai_worktree_contract.py"
      - "docs/AI_SKILL_ADOPTION_GUIDE.md"
      - "docs/generated/BASE_SKILL_IMPLEMENTATION_EVIDENCE.md"
      - "tests/test_skill_behavior_*.py"
      - "tests/test_skill_eval_integrity_contract.py"
      - "tests/test_skill_implementation_evidence.py"
      - "tests/test_external_ai_worktree_contract.py"
      - ".github/workflows/validate-skill-behavior-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install contract dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Validate behavior coverage contract
        run: python tools/check_skill_behavior_evals.py
      - name: Validate generated implementation evidence
        run: python tools/build_skill_implementation_evidence.py --check
      - name: Run focused behavior and worktree tests
        run: |
          python -m unittest \
            tests/test_skill_behavior_evidence_hardening.py \
            tests/test_skill_behavior_adversarial_boundaries.py \
            tests/test_skill_behavior_governance_integration.py \
            tests/test_skill_eval_integrity_contract.py \
            tests/test_skill_implementation_evidence.py \
            tests/test_external_ai_worktree_contract.py \
            -v
