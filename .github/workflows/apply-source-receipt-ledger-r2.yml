name: Apply reviewed Source receipt reconciliation correction

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r2-20260902
    paths:
      - .github/workflows/apply-source-receipt-ledger-r2.yml

permissions:
  contents: write

jobs:
  red-green-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest-main task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r2-20260902
          fetch-depth: 0

      - name: Restore exact reviewed payload
        shell: bash
        run: |
          mkdir -p /tmp/source-receipt-r2
          cat > /tmp/source-receipt-r2/payload.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/source-receipt-r2/payload.b64 > /tmp/source-receipt-r2/payload.tgz
          echo '095ebd5b90307319c8c250b6dccc067efa181c6bda3c769c75212b3f5de4f42e  /tmp/source-receipt-r2/payload.tgz' | sha256sum -c -
          mkdir -p /tmp/source-receipt-r2/unpacked
          tar -xzf /tmp/source-receipt-r2/payload.tgz -C /tmp/source-receipt-r2/unpacked

      - name: Prove RED on latest completed main
        shell: bash
        run: |
          cp /tmp/source-receipt-r2/unpacked/tests/test_periodic_source_receipt_state.py tests/
          cp /tmp/source-receipt-r2/unpacked/tests/test_record_periodic_source_scan.py tests/
          set +e
          python -m unittest tests.test_periodic_source_receipt_state tests.test_record_periodic_source_scan -v > /tmp/source-receipt-r2/red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/source-receipt-r2/red.log
          test "$red_rc" -ne 0

      - name: Apply minimal reviewed implementation
        shell: bash
        run: |
          cp /tmp/source-receipt-r2/unpacked/tools/periodic_source_receipt_state.py tools/
          cp /tmp/source-receipt-r2/unpacked/tools/record_periodic_source_scan.py tools/
          cp /tmp/source-receipt-r2/unpacked/tests/test_periodic_source_receipt_state.py tests/
          cp /tmp/source-receipt-r2/unpacked/tests/test_record_periodic_source_scan.py tests/

      - name: Prove GREEN and related compatibility
        shell: bash
        run: |
          python -m py_compile \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py
          python -m unittest \
            tests.test_periodic_source_receipt_state \
            tests.test_record_periodic_source_scan \
            tests.test_periodic_source_analysis_runner \
            tests.test_periodic_source_analysis_auto_merge \
            tests.test_periodic_source_scan_queue \
            -v
          git diff --check

      - name: Remove transport workflow and commit exact four-file diff
        shell: bash
        run: |
          rm .github/workflows/apply-source-receipt-ledger-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py \
            .github/workflows/apply-source-receipt-ledger-r2.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/apply-source-receipt-ledger-r2.yml tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git commit -m "fix: persist reviewed Source receipt identities"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git push origin HEAD:fix/source-receipt-ledger-integrity-r2-20260902
