name: Validate Base v9 Operating Contracts

on:
  pull_request:
    paths:
      - "README.md"
      - "START_HERE.md"
      - "AGENTS.md"
      - "base.lock.json"
      - "base-v9.1.lock.json"
      - "base-v9.2.lock.json"
      - "base-v9.3.lock.json"
      - "base-v9.4.lock.json"
      - "base-v9.4.1.lock.json"
      - "base-v9.4.2.lock.json"
      - "base-v9.4.3.lock.json"
      - ".codex-plugin/**"
      - "docs/**"
      - "skills/**"
      - "templates/**"
      - "tools/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "START_HERE.md"
      - "AGENTS.md"
      - "base.lock.json"
      - "base-v9.1.lock.json"
      - "base-v9.2.lock.json"
      - "base-v9.3.lock.json"
      - "base-v9.4.lock.json"
      - "base-v9.4.1.lock.json"
      - "base-v9.4.2.lock.json"
      - "base-v9.4.3.lock.json"
      - ".codex-plugin/**"
      - "docs/**"
      - "skills/**"
      - "templates/**"
      - "tools/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-v9-contract:
    name: base-v9-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned validation requirements
        run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Validate generated artifacts and integrity topology
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            TRUSTED_HISTORY_COMMIT="$(git rev-parse "origin/$GITHUB_BASE_REF")"
          else
            TRUSTED_HISTORY_COMMIT="$GITHUB_SHA"
          fi
          python tools/build_base_v9_artifacts.py --check
          python tools/check_base_v9_integrity.py --trusted-history-commit "$TRUSTED_HISTORY_COMMIT"
          python tools/check_base_v9_4_1_release.py --trusted-history-commit "$TRUSTED_HISTORY_COMMIT"
          python tools/check_base_v9_4_2_release.py --trusted-history-commit "$TRUSTED_HISTORY_COMMIT"
          python tools/check_base_v9_4_3_release.py --trusted-history-commit "$TRUSTED_HISTORY_COMMIT"
      - name: Run Base v9, v9.1, v9.4, v9.4.1, v9.4.2, v9.4.3, and active v9 prompt focused tests
        run: |
          python -m unittest \
            tests.test_v9_machine_contracts \
            tests.test_v9_registry_generation \
            tests.test_v9_governance_documents \
            tests.test_v9_1_project_operating_contract \
            tests.test_v9_1_review_remediation \
            tests.test_v9_1_skill_pressure_contracts \
            tests.test_project_adapter_fleet_hardening \
            tests.test_project_adapter_fleet_rollout_status \
            tests.test_approved_protected_change_gate \
            tests.test_protected_path_descendant_matching \
            tests.test_loop_execution_capsule_contracts \
            tests.test_universal_loop_v1_real_burnin_closure \
            tests.test_universal_loop_v1_closure_learning_reuse \
            tests.test_project_gdd_google_sheets_contract \
            tests.test_notion_project_isolation_core_system_contract \
            tests.test_pr530_selective_integration_contract \
            tests.test_p08_ai_operations_contract \
            tests.test_vertical_slice_v9_contract \
            tests.test_base_v9_4_ai_operations_contract \
            tests.test_base_v9_4_release_evidence_contract \
            tests.test_base_v9_4_trusted_evidence_record \
            tests.test_base_v9_4_1_compatibility_release \
            tests.test_base_v9_4_2_compatibility_release \
            tests.test_base_v9_4_3_compatibility_release \
            tests.test_higodot_single_authority_policy \
            tests.test_godot_addon_utilization_policy \
            tests.test_godot_higodot_gut_hera_toolchain \
            tests.test_base_shared_skill_routes \
            tests.test_neutral_adversarial_feature_lifecycle \
            -v

  adversarial-gate:
    name: adversarial-gate
    needs: base-v9-contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require contract evidence before adversarial review
        env:
          CONTRACT_RESULT: ${{ needs.base-v9-contract.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          echo "Adversarial gate is ready for evidence-backed review"
