name: Validate Base v9 Operating Contracts

on:
  pull_request:
    paths:
      - "README.md"
      - "START_HERE.md"
      - "AGENTS.md"
      - "base.lock.json"
      - "base-v9.1.lock.json"
      - "base-v9.2.lock.json"
      - "base-v9.3.lock.json"
      - "base-v9.4.lock.json"
      - ".codex-plugin/**"
      - "docs/**"
      - "skills/**"
      - "templates/**"
      - "tools/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "START_HERE.md"
      - "AGENTS.md"
      - "base.lock.json"
      - "base-v9.1.lock.json"
      - "base-v9.2.lock.json"
      - "base-v9.3.lock.json"
      - "base-v9.4.lock.json"
      - ".codex-plugin/**"
      - "docs/**"
      - "skills/**"
      - "templates/**"
      - "tools/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  migration-preview:
    name: migration-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply deterministic Base v9.4 migration in workspace
        run: python tools/apply_base_v9_4_ai_operations.py
      - name: Commit exact migration to the PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Migration already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: apply Base v9.4 AI operations migration"
          git push origin "HEAD:${HEAD_REF}"
      - name: Upload exact generated migration files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: base-v9-4-migration-preview
          if-no-files-found: error
          path: |
            skills/SKILL_REGISTRY.json
            docs/generated/BASE_ACTIVE_SKILLS.md
            base-v9.4.lock.json
            [수정제안서]/PROPOSAL_REGISTRY.json
            [수정제안서]/BCP-2026-003-ai-model-prompt-cost-optimization/PROPOSAL.md
            [수정제안서]/BCP-2026-004-ai-instruction-context-ui-motion/PROPOSAL.md
            skills/managing-project-intake-and-work-contract/SKILL.md
            skills/simplifying-skill-bodies/SKILL.md
            skills/simplifying-skill-bodies/references/progressive-disclosure-rules.md
            skills/auditing-and-refining-ui-art/SKILL.md
            skills/auditing-and-refining-ui-art/references/ux-ui-design-system-method.md
            docs/knowledge/game-development/AI_ASSISTED_GAME_DEVELOPMENT_GUIDE.md
            docs/PLANNING_SEQUENCE_AND_EVIDENCE_POLICY.md
            docs/DOCUMENTATION_MAP.md
            templates/project-operations/AI_WORKFLOW.md
            templates/planning/GAME_UX_UI_SYSTEM.md
            templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md
            docs/BASE_RULES_VERSION.md
            docs/CHANGELOG.md
            skills/SKILL_LEARNING_LOG.md

  base-v9-contract:
    name: base-v9-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned validation requirements
        run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Validate generated artifacts and integrity topology
        env:
          TRUSTED_HISTORY_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python tools/build_base_v9_artifacts.py --check
          python tools/check_base_v9_integrity.py --trusted-history-commit "$TRUSTED_HISTORY_COMMIT"
      - name: Run Base v9, v9.1, v9.4, and active v9 prompt focused tests
        run: |
          python -m unittest \
            tests.test_v9_machine_contracts \
            tests.test_v9_registry_generation \
            tests.test_v9_governance_documents \
            tests.test_v9_1_project_operating_contract \
            tests.test_v9_1_review_remediation \
            tests.test_v9_1_skill_pressure_contracts \
            tests.test_project_gdd_google_sheets_contract \
            tests.test_vertical_slice_v9_contract \
            tests.test_base_v9_4_ai_operations_contract \
            -v

  ci-gate:
    name: ci-gate
    needs: base-v9-contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Base v9 contract success
        env:
          CONTRACT_RESULT: ${{ needs.base-v9-contract.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          echo "CI gate passed"

  adversarial-gate:
    name: adversarial-gate
    needs: [base-v9-contract, ci-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require contract and CI evidence before adversarial review
        env:
          CONTRACT_RESULT: ${{ needs.base-v9-contract.result }}
          CI_RESULT: ${{ needs.ci-gate.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$CI_RESULT" = "success"
          echo "Adversarial gate is ready for evidence-backed review"
