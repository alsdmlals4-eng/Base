name: Apply remaining reuse handoff current-authority corrections

on:
  push:
    branches:
      - fix/reuse-handoff-current-authority-20260902
    paths:
      - .github/workflows/apply-reuse-handoff-current-authority-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/reuse-handoff-current-authority-20260902
          fetch-depth: 0

      - name: Apply audited project-action corrections
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          projects = data["projects"]

          projects["TETRIS"]["next_project_work_action"] = (
              "Read current project authority, current GitHub main, production canon index/current canon, "
              "actual implementation, and open PRs first; treat Base project snapshots and superseded combat "
              "owners as non-authoritative history, then reuse phase, explainability, replay, balance, UI, and "
              "symbol contracts only through an approved current production task without copying protected "
              "names, visuals, audio, or trade dress."
          )
          projects["NINJA_SURVIVAL"]["next_project_work_action"] = (
              "Read current project authority, current GitHub main, confirmed decisions, active context, actual "
              "implementation, current validation gate, and open PRs first; select only the grid, survivor, phase, "
              "draft, explainability, wave, card, replay, balance, UI, symbol, or telegraph contract actually "
              "consumed by the approved current task."
          )
          projects["OMENWARD"]["next_project_work_action"] = (
              "Read current project authority, current GitHub main, current decision index, active context, actual "
              "implementation, and open PRs first; keep sidecars isolated until an approved product task connects "
              "a consumer, then use only the roulette, phase, draft, explainability, wave, replay, balance, UI, "
              "symbol, or telegraph contracts required by that current task."
          )

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          rm .github/workflows/apply-reuse-handoff-current-authority-v2.yml
          python -m unittest tests.test_reuse_first_preflight_enforcement -v

      - name: Commit final production diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json tests/test_reuse_first_preflight_enforcement.py .github/workflows/apply-reuse-handoff-current-authority-v2.yml
          git commit -m "fix: remove remaining mutable project snapshots from reuse handoff"
          git push origin HEAD:fix/reuse-handoff-current-authority-20260902
