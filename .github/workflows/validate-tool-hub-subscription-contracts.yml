name: Validate Tool Hub Subscription Contracts

on:
  pull_request:
    paths:
      - "tools/base-tool-contracts/**"
      - "tools/tool-hub/src/tool_hub/adapters.py"
      - "tools/tool-hub/src/tool_hub/windows_launcher.py"
      - "tools/tool-hub/src/tool_hub/windows_launcher_entry.pyw"
      - "tools/tool-hub/src/tool_hub/windows_launcher_repair.py"
      - "tools/tool-hub/web/**"
      - "tools/tool-hub/tests/test_web_launch_diagnostics.py"
      - "tools/tool-hub/tests/test_windows_launcher_self_repair.py"
      - "tools/tool-hub/tests/test_windows_launcher_runtime_dirty_diagnostics.py"
      - "tools/expression-studio/src/expression_studio/app.py"
      - "tools/sprite-animation-studio/src/sprite_animation_studio/app.py"
      - "docs/operations/PROJECT_FIGMA_TARGET_REGISTRY.json"
      - "docs/operations/PROJECT_FIGMA_TOOL_ROUTE_REGISTRY.json"
      - "tests/test_tool_hub_subscription_production_contract.py"
      - "docs/superpowers/specs/2026-08-15-tool-hub-subscription-production-contracts-design.md"
      - "docs/superpowers/plans/2026-08-15-tool-hub-subscription-production-contracts.md"
      - "docs/superpowers/plans/2026-08-18-tool-hub-runtime-dirty-diagnostics.md"
      - ".github/workflows/validate-tool-hub-subscription-contracts.yml"
  push:
    branches: [main]
    paths:
      - "tools/base-tool-contracts/**"
      - "tools/tool-hub/src/tool_hub/adapters.py"
      - "tools/tool-hub/src/tool_hub/windows_launcher.py"
      - "tools/tool-hub/src/tool_hub/windows_launcher_entry.pyw"
      - "tools/tool-hub/src/tool_hub/windows_launcher_repair.py"
      - "tools/tool-hub/web/**"
      - "tools/tool-hub/tests/test_web_launch_diagnostics.py"
      - "tools/tool-hub/tests/test_windows_launcher_self_repair.py"
      - "tools/tool-hub/tests/test_windows_launcher_runtime_dirty_diagnostics.py"
      - "tools/expression-studio/src/expression_studio/app.py"
      - "tools/sprite-animation-studio/src/sprite_animation_studio/app.py"
      - "docs/operations/PROJECT_FIGMA_TARGET_REGISTRY.json"
      - "docs/operations/PROJECT_FIGMA_TOOL_ROUTE_REGISTRY.json"
      - "tests/test_tool_hub_subscription_production_contract.py"
      - "docs/superpowers/plans/2026-08-18-tool-hub-runtime-dirty-diagnostics.md"
      - ".github/workflows/validate-tool-hub-subscription-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hub-subscription-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install shared contract dependencies
        run: python -m pip install -e './tools/base-tool-contracts[dev]' -e './tools/tool-hub[dev]'
      - name: Run subscription, routing, and Windows preflight contracts
        run: >-
          python -m pytest -q
          tools/base-tool-contracts/tests/test_subscription_handoff.py
          tools/base-tool-contracts/tests/test_subscription_prompt_renderer.py
          tools/base-tool-contracts/tests/test_figma_tool_routing.py
          tools/base-tool-contracts/tests/test_windows_subprocess_visibility.py
          tools/tool-hub/tests/test_web_launch_diagnostics.py
          tools/tool-hub/tests/test_windows_launcher_self_repair.py
          tools/tool-hub/tests/test_windows_launcher_runtime_dirty_diagnostics.py
      - name: Run repository production-boundary contract
        run: python -m unittest tests/test_tool_hub_subscription_production_contract.py -v
