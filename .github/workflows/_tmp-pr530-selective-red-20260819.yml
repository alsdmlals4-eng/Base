name: Temporary PR530 selective migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-pr530-selective-migration-20260819
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integrate/pr530-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r .github/validation-requirements.txt
      - name: Apply selective current-main migration
        run: |
          python tools/_tmp_apply_pr530_selective_integration_20260819.py
          python tools/_tmp_patch_pr530_generator_20260819.py
          python tools/_tmp_fix_pr530_sheet_control_20260819.py
          python tools/build_base_v9_artifacts.py --write
      - name: Verify focused contracts
        run: |
          python -m py_compile tests/test_pr530_selective_integration_contract.py tools/build_base_v9_artifacts.py
          python tools/check_base_partition_scope.py --validate-manifest
          python tools/build_base_v9_artifacts.py --check
          python tools/check_base_v9_integrity.py
          python -m unittest tests.test_pr530_selective_integration_contract tests.test_base_partition_contract -v
          git diff --check
      - name: Commit durable non-workflow changes
        shell: bash
        run: |
          git checkout -- .github/workflows/base-partition-contract.yml
          git checkout -- .github/workflows/_tmp-pr530-selective-red-20260819.yml
          git rm tools/_tmp_apply_pr530_selective_integration_20260819.py tools/_tmp_patch_pr530_generator_20260819.py tools/_tmp_fix_pr530_sheet_control_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: absorb current PR530 workflow semantics"
          git pull --rebase origin integrate/pr530-current-main-20260819
          git push origin HEAD:integrate/pr530-current-main-20260819
