name: Temporary PR530 selective RED

on:
  push:
    branches: [integrate/pr530-current-main-20260819]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_pr530_selective_integration_contract -v
