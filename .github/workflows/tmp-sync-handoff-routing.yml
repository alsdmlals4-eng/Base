name: Temporary Sync Handoff Routing

on:
  push:
    branches:
      - agent/sync-on-demand-handoff-machine-routing

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-on-demand-handoff-machine-routing

      - name: Sync registry and generated view
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'skills/SKILL_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          entry = next(
              item for item in registry['skills']
              if item['skill_id'] == 'maintaining-project-context-and-handoff'
          )

          for tag in ('on-demand-codex-handoff', 'codex-handoff', 'codex-work-spec'):
              if tag not in entry['trigger_tags']:
                  entry['trigger_tags'].append(tag)

          entry['use_when'] = [
              '현재 상태·다음 작업·위험을 새 채팅용으로 압축 갱신하거나, USER_REQUESTED_CODEX_HANDOFF가 발생하면 GPT의 누적 기획·구현·POC를 실제 저장소·프로젝트·Godot 상태 재검증을 요구하는 실행 명세로 변환한다. L2 이상·고위험 작업에서만 마스터 계획·구현 패키지·선택적 Codex Plan·Build·GPT 검수·검증된 병합 흐름을 관리한다.'
          ]
          entry['do_not_use_when'] = [
              '저장소 상태가 바뀌지 않은 단순 대화이거나, 사용자가 Codex 전환을 요청하지 않았고 현재 GPT 작업을 계속하는 편이 적합한 경우다.'
          ]
          entry['learning_log'] = 'skills/maintaining-project-context-and-handoff/LEARNING_LOG.md'
          for trigger in (
              '불필요한 Codex Plan 강제',
              '실제 저장소·프로젝트·Godot 상태 재검증 누락',
              '승인 완료 항목 재승인 요구',
          ):
              if trigger not in entry['review_triggers']:
                  entry['review_triggers'].append(trigger)
          entry['last_reviewed_at'] = '2026-08-08'
          entry['last_reviewed_commit'] = '9a437748fd8940c8b6012aa1bda8a63bf1ab0372'

          registry_text = json.dumps(registry, ensure_ascii=False, separators=(',', ':')) + '\n'
          registry_path.write_text(registry_text, encoding='utf-8')

          registry_hash = hashlib.sha256(registry_text.encode('utf-8')).hexdigest()
          active = [item for item in registry['skills'] if item.get('status') == 'ACTIVE']
          lines = [
              '# Current Active Base Skills',
              '',
              '> Generated from `skills/SKILL_REGISTRY.json`. Do not edit this derivative.',
              f'> Registry SHA-256: `{registry_hash}`',
              f'> Current active Skill count: `{len(active)}`',
              '',
              '| Skill ID | Owner | Positive trigger | Negative trigger |',
              '| --- | --- | --- | --- |',
          ]
          for item in active:
              positive = '; '.join(item['trigger_tags']).replace('|', '\\|')
              negative = item['do_not_use_when'][0].splitlines()[0].replace('|', '\\|')
              lines.append(
                  f"| `{item['skill_id']}` | {item['discipline']} | {positive} | {negative} |"
              )
          (root / 'docs/generated/BASE_ACTIVE_SKILLS.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )

          learning_path = root / 'skills/maintaining-project-context-and-handoff/LEARNING_LOG.md'
          learning = learning_path.read_text(encoding='utf-8')
          marker = '## 2026-08-08 — Machine routing sync'
          if marker not in learning:
              learning += (
                  '\n' + marker + '\n\n'
                  '- Post-merge audit found that the machine Registry still described the superseded mandatory Codex Plan flow.\n'
                  '- Registry triggers now discover on-demand Codex handoff and the generated active-skill view is rebuilt from the same machine source.\n'
                  '- This closes the policy → Skill → Registry → generated-view propagation gap.\n'
              )
              learning_path.write_text(learning, encoding='utf-8')
          PY

      - name: Commit synchronized routing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SKILL_REGISTRY.json docs/generated/BASE_ACTIVE_SKILLS.md skills/maintaining-project-context-and-handoff/LEARNING_LOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: sync on-demand handoff machine routing"
          git push origin HEAD:agent/sync-on-demand-handoff-machine-routing
