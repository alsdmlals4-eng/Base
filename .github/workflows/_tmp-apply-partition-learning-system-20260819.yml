name: Temporary apply partition learning system

on:
  push:
    branches:
      - feat/base-partition-operating-model-20260819
    paths:
      - tools/_tmp_add_partition_learning_system_20260819.py
      - .github/workflows/_tmp-apply-partition-learning-system-20260819.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/base-partition-operating-model-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply learning and source-discovery contract
        run: python tools/_tmp_add_partition_learning_system_20260819.py
      - name: Run focused partition and source queue tests
        run: |
          python -m py_compile tools/check_base_partition_scope.py tools/periodic_source_scan_queue.py tests/test_base_partition_contract.py
          python tools/check_base_partition_scope.py --validate-manifest
          python -m unittest tests.test_base_partition_contract tests.test_periodic_source_scan_queue -v
      - name: Remove temporary workflow and commit durable changes
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-apply-partition-learning-system-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "architecture: add per-part learning and source discovery"
          git push origin HEAD:feat/base-partition-operating-model-20260819
