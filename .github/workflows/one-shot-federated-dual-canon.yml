name: One-shot federated dual canon correction

on:
  push:
    branches:
      - work/846-blueprint-progress-incremental-revision
    paths:
      - .github/workflows/one-shot-federated-dual-canon.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/846-blueprint-progress-incremental-revision
          fetch-depth: 0

      - name: Verify bounded continuation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "work/846-blueprint-progress-incremental-revision"
          git merge-base --is-ancestor 1db144442e2172e363e8a100d67b0591b706f723 HEAD
          changed="$(git diff --name-only 1db144442e2172e363e8a100d67b0591b706f723..HEAD)"
          test "$changed" = ".github/workflows/one-shot-federated-dual-canon.yml"

      - name: Apply approved dual-canon correction
        shell: python
        run: |
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()
          MODEL = "FEDERATED_DUAL_CANON_SINGLE_FACT_OWNER"
          REPOSITORY = "REPOSITORY_EXECUTION_DATA_CANON"
          HUMAN = "APPROVED_HUMAN_BLUEPRINT_PDF_CANON"
          SINGLE = "ONE_EDITABLE_OWNER_PER_ATOMIC_FACT"
          CANDIDATE = "CANDIDATE_PDF_NOT_CANON"

          ACTIVE_ROUTING_SURFACES = [
              "AGENTS.md",
              "README.md",
              "START_HERE.md",
              "docs/OPERATING_MODEL.md",
              "docs/DOCUMENTATION_MAP.md",
              "docs/PLANNING_FIRST_GRILL_ME_BATCH_POLICY.md",
              "docs/VISUAL_COLLABORATION_TOOL_POLICY.md",
              "docs/CONFIRMED_DECISION_SYNC_POLICY.md",
              "skills/managing-design-documents/SKILL.md",
              "templates/AGENTS.project.md",
              "templates/copilot-instructions.md",
              "templates/custom-instructions.codex.md",
              "templates/custom-instructions.gpt.md",
              "templates/project-operations/CURRENT_CONFIRMED_DECISIONS.md",
              "templates/project-operations/README.md",
              "templates/project-operations/CHATGPT_WORK_PROJECT_EXECUTION_INSTRUCTION_v4.9.md",
              "templates/project-operations/GPT_WORK_PROJECT_MASTER_GDD_TWO_ARTIFACT_INSTRUCTION.md",
          ]

          RETIRED_TO_ACTIVE = {
              "REPOSITORY_PRIMARY_CANON_WITH_DERIVED_HUMAN_PDF": MODEL,
              "HUMAN_GDD_PDF_DERIVED_VIEW": HUMAN,
              "PDF_IS_DERIVED_SNAPSHOT_NOT_CANON": "APPROVED_PDF_IS_HUMAN_VISUAL_CANON",
          }

          ROUTE_MARKER = "<!-- FEDERATED_DUAL_CANON_ROUTE -->"
          ROUTE_NOTE = f"""
          {ROUTE_MARKER}

          > V4 authority route: `{MODEL}`. `{REPOSITORY}` owns editable structured, execution, runtime, work-status, and evidence facts. Only a `USER_APPROVED_AND_MANIFEST_REGISTERED` `{HUMAN}` owns the immutable human visual/review baseline. `{SINGLE}`; `{CANDIDATE}` and PDF annotations do not mutate repository-owned facts. See `docs/operations/PROJECT_WORKSPACE_AUTHORITY_CONTRACT_V4.json` and `docs/DESKTOP_GPT_REPOSITORY_FIRST_WORKSPACE_POLICY.md`.
          """.strip()

          def load(path: str) -> str:
              target = ROOT / path
              if not target.is_file():
                  raise SystemExit(f"missing required path: {path}")
              return target.read_text(encoding="utf-8")

          def save(path: str, content: str) -> None:
              normalized = content.rstrip() + "\n"
              (ROOT / path).write_text(normalized, encoding="utf-8", newline="\n")

          def replace_tokens(content: str) -> str:
              for old, new in RETIRED_TO_ACTIVE.items():
                  content = content.replace(old, new)
              return content

          def append_route_if_needed(path: str, content: str) -> str:
              if MODEL not in content or HUMAN not in content:
                  if ROUTE_MARKER in content:
                      raise SystemExit(f"route marker exists but required token is missing: {path}")
                  content = content.rstrip() + "\n\n" + ROUTE_NOTE + "\n"
              return content

          workspace_path = "docs/DESKTOP_GPT_REPOSITORY_FIRST_WORKSPACE_POLICY.md"
          workspace = replace_tokens(load(workspace_path))
          workspace = workspace.replace(
              "사용자용 PDF는 프로젝트 전체를 사람이 이해하고 중간점검하는 시각 중심 상세 기획서다. 그러나 정본은 아니다.",
              "사용자용 PDF는 프로젝트 전체를 사람이 이해하고 중간점검하는 시각 중심 상세 기획서다. 사용자 승인과 manifest 등록을 마치면 사람용 시각·검수 영역의 불변 정본이다.",
          )
          workspace = workspace.replace(
              "채팅, memory, Library, PDF, Notion preview에만 존재하는 정보는 current project canon으로 승격하지 않는다.",
              "채팅, memory, Library-only candidate PDF, 미등록 PDF와 Notion preview에만 존재하는 정보는 current project canon으로 승격하지 않는다. 사용자 승인과 repository manifest 등록을 마친 PDF는 사람용 시각·검수 영역의 정본이다.",
          )
          workspace = workspace.replace(
              "| 사용자용 상세 기획서 PDF | 사람이 전체 기획·핵심 시스템·콘텐츠·구현 원리를 검토하는 시각 snapshot | 파생뷰 | 의미 있는 Gate에서 |",
              "| 사용자용 상세 기획서 PDF | 사람이 전체 기획·핵심 시스템·콘텐츠·구현 원리를 검토하고 승인한 시각 baseline | **승인·등록 후 사람용 시각 정본** | 의미 있는 Gate에서 |",
          )
          workspace = workspace.replace(
              "PDF 주석이나 오래된 다운로드 파일을 current Decision으로 직접 해석하지 않는다.",
              "PDF 주석은 `PDF_ANNOTATION_IS_CHANGE_REQUEST_NOT_CANON_MUTATION`이며 repository owner에 반영하고 새 PDF를 승인·등록하기 전에는 current Decision을 변경하지 않는다. superseded 다운로드 파일은 current PDF canon으로 해석하지 않는다.",
          )
          workspace_marker = "<!-- FEDERATED_DUAL_CANON_CORE_CONTRACT -->"
          if workspace_marker not in workspace:
              workspace += f"""

          {workspace_marker}

          ## Federated repository + approved PDF dual canon

          ```text
          {MODEL}

          {REPOSITORY}
          {HUMAN}
          {SINGLE}
          ```

          `{REPOSITORY}`는 코드·Scene·Resource·asset·구조화 데이터·ID·수치·공식·조건·상태 전이·Decision source·작업 상태·test·runtime·release evidence의 **편집 가능한 정본**이다. `{HUMAN}`은 사용자가 실제로 검토·승인한 프로젝트/플레이어 경험 지도, 읽기 순서, Flow 구성, 정보 우선순위, 시스템 카드 표현, milestone 범위와 시각적 baseline의 **불변 정본**이다.

          PDF는 두 번째 editable database가 아니다.

          ```text
          PDF_STRUCTURED_CONTENT_IS_REPOSITORY_PROJECTION
          PDF_PROGRESS_STATUS_IS_REPOSITORY_PROJECTION
          PDF_ANNOTATION_IS_CHANGE_REQUEST_NOT_CANON_MUTATION
          NO_PARALLEL_BLUEPRINT_STATUS_CANON
          ```

          PDF에 표시되는 ID·수치·규칙·완료 상태·evidence locator는 repository owner에서 생성한다. PDF에서 직접 체크하거나 수치를 고친 것은 변경 요청이며, repository owner 반영 → 새 exact-SHA candidate 생성 → predecessor 비교 → 사용자 승인 → manifest 등록을 거쳐야 정본 변경이 완료된다.

          ### PDF 정본 승격

          ```text
          GENERATED_CANDIDATE
          → USER_APPROVED_PENDING_REGISTRATION
          → USER_APPROVED_AND_MANIFEST_REGISTERED
          → CANON_ALIGNED
          ```

          `{CANDIDATE}`. 승인 PDF는 최소 `source_commit`, `pdf_sha256`, `approval_ref`, `approved_at`, `canonical_status`, `supersedes_pdf_ref`, `pdf_canon_manifest_ref`, included scope와 evidence ceiling을 가진다. 프로젝트별 실제 locator는 `AGENTS.md` 또는 publication owner가 지정하며, 기본 예시는 `docs/blueprint/BLUEPRINT_CANON_MANIFEST.json`과 versioned `exports/*_APPROVED.pdf`다.

          ```text
          APPROVED_PDF_IMMUTABLE_NEW_VERSION_REQUIRED
          NEW_VERSION_NEW_HASH_KEEP_HISTORY
          ```

          승인 PDF를 덮어쓰지 않는다. 새 승인본은 새 version·filename·SHA-256으로 등록하고 이전 승인본을 `SUPERSEDED`로 남긴다. 반복 candidate와 임시 render를 모두 Git에 보존할 의무는 없지만, current/superseded 승인 baseline의 locator와 hash history는 보존한다.

          ### 정본 정렬과 충돌

          ```text
          CANON_ALIGNED
          REPOSITORY_ADVANCED_PDF_REVIEW_REQUIRED
          PDF_FEEDBACK_PENDING_REPOSITORY_REFLECTION
          CANON_CONFLICT
          SUPERSEDED
          ```

          - 구조화 값이 다르면 repository owner가 해당 값을 소유하고 PDF를 current로 취급하지 않으며 재생성한다.
          - 승인된 Flow·화면 hierarchy·정보 우선순위·사람용 표현과 구현이 다르면 구현을 자동 정본으로 승격하지 않는다. 구현을 교정하거나 새 PDF candidate의 delta를 사용자에게 보여 재승인한다.
          - 동시에 해결되지 않은 차이는 `CANON_CONFLICT`다.
          - `CANON_CONFLICT_BLOCKS_COMPLETION_AND_RELEASE`.
          - 문서 생성, static test, machine test, runtime, UX/Human, PDF 사용자 승인과 release 승인은 서로 다른 evidence다.
          """
          save(workspace_path, workspace)

          master_path = "docs/PROJECT_MASTER_GDD_TWO_ARTIFACT_POLICY.md"
          master = replace_tokens(load(master_path))
          master = master.replace(
              "PM_STATUS_IS_READ_ONLY_DERIVED_VIEW",
              "PDF_PROGRESS_STATUS_IS_REPOSITORY_PROJECTION",
          )
          master_marker = "<!-- FEDERATED_DUAL_CANON_PUBLICATION_CONTRACT -->"
          if master_marker not in master:
              master += f"""

          {master_marker}

          ## 12. GitHub·승인 PDF 연합 정본 Gate

          ```text
          {MODEL}
          {REPOSITORY}
          {HUMAN}
          {SINGLE}
          ```

          `HUMAN_MASTER_GDD_PDF`는 생성만으로 정본이 되지 않는다. `{CANDIDATE}`이며 다음을 모두 만족한 version만 `{HUMAN}`으로 승격한다.

          ```yaml
          source_commit:
          pdf_sha256:
          approval_ref:
          approved_at:
          canonical_status: CANON_ALIGNED
          supersedes_pdf_ref:
          pdf_canon_manifest_ref:
          included_scope:
          implementation_evidence_ceiling:
          ```

          승격 token은 `USER_APPROVED_AND_MANIFEST_REGISTERED`다. 승인본은 `APPROVED_PDF_IMMUTABLE_NEW_VERSION_REQUIRED`; 수정은 새 version·hash를 만들고 `NEW_VERSION_NEW_HASH_KEEP_HISTORY`로 predecessor를 보존한다.

          ### 12.1 단일 편집 owner

          - repository owner: 코드·데이터·ID·규칙·수치·상태·Decision source·작업현황·실제 implementation/test/runtime evidence.
          - 승인 PDF: 사용자가 승인한 읽기 구조, 프로젝트/플레이어 경험 지도, Flow·화면·정보 hierarchy, 시스템 카드 시각 표현, milestone 범위와 사람용 검수 baseline.
          - `PDF_STRUCTURED_CONTENT_IS_REPOSITORY_PROJECTION`.
          - `PDF_ANNOTATION_IS_CHANGE_REQUEST_NOT_CANON_MUTATION`.
          - `PROJECT_WORK_KANBAN_IS_PROGRESS_SOURCE`.
          - `PDF_PROGRESS_STATUS_IS_REPOSITORY_PROJECTION`.
          - `NO_PARALLEL_BLUEPRINT_STATUS_CANON`.

          ### 12.2 충돌 처리

          - repository 구조화 값과 PDF 표시값이 다르면 repository 값을 유지하고 PDF를 `REPOSITORY_ADVANCED_PDF_REVIEW_REQUIRED`로 내려 새 candidate를 만든다.
          - 승인 PDF의 material visual flow/hierarchy와 구현이 다르면 구현을 교정하거나 새 candidate delta를 사용자에게 보여 다시 승인한다.
          - 반영되지 않은 PDF feedback은 `PDF_FEEDBACK_PENDING_REPOSITORY_REFLECTION`이다.
          - 해결되지 않은 동시 차이는 `CANON_CONFLICT`.
          - `CANON_CONFLICT_BLOCKS_COMPLETION_AND_RELEASE`.

          predecessor inventory, stable-ID carry-forward, semantic delta와 `BLUEPRINT_LOSS_REGRESSION_GATE`는 새 candidate를 승인 정본으로 승격하기 전 필수다. 기존 승인 PDF는 successor가 `USER_APPROVED_AND_MANIFEST_REGISTERED`가 되기 전까지 사람용 검수 baseline으로 유지한다.
          """
          save(master_path, master)

          v4_path = "docs/operations/PROJECT_WORKSPACE_AUTHORITY_CONTRACT_V4.json"
          contract = json.loads(load(v4_path))
          contract["authority_model"] = MODEL
          contract["project_canon"] = "FEDERATED_REPOSITORY_AND_APPROVED_PDF_CANON"
          contract["repository_canon"] = REPOSITORY
          contract["human_pdf_canon"] = HUMAN
          contract["single_fact_owner"] = SINGLE
          contract["human_facing_view"] = HUMAN
          contract["pdf_policy"] = "APPROVED_PDF_IS_HUMAN_VISUAL_CANON"
          contract["candidate_pdf_policy"] = CANDIDATE
          contract["human_pdf_canon_contract"] = {
              "activation": "USER_APPROVED_AND_MANIFEST_REGISTERED",
              "structured_content": "PDF_STRUCTURED_CONTENT_IS_REPOSITORY_PROJECTION",
              "progress_status": "PDF_PROGRESS_STATUS_IS_REPOSITORY_PROJECTION",
              "annotation_policy": "PDF_ANNOTATION_IS_CHANGE_REQUEST_NOT_CANON_MUTATION",
              "immutable_after_approval": True,
              "immutability_policy": "APPROVED_PDF_IMMUTABLE_NEW_VERSION_REQUIRED",
              "supersession_policy": "NEW_VERSION_NEW_HASH_KEEP_HISTORY",
              "required_registration_fields": [
                  "source_commit",
                  "pdf_sha256",
                  "approval_ref",
                  "approved_at",
                  "canonical_status",
                  "supersedes_pdf_ref",
                  "pdf_canon_manifest_ref",
              ],
              "owned_domains": [
                  "HUMAN_REVIEW_BASELINE",
                  "PROJECT_AND_PLAYER_EXPERIENCE_MAP",
                  "USER_APPROVED_VISUAL_HIERARCHY",
                  "FLOW_COMPOSITION_AND_INFORMATION_PRIORITY",
                  "APPROVED_MILESTONE_SCOPE_PRESENTATION",
              ],
              "repository_owned_domains": [
                  "CODE_AND_RUNTIME",
                  "STRUCTURED_DATA_AND_IDS",
                  "RULES_VALUES_AND_STATE_TRANSITIONS",
                  "EDITABLE_DECISION_SOURCES",
                  "WORK_STATUS_AND_EVIDENCE",
              ],
              "alignment_states": [
                  "CANON_ALIGNED",
                  "REPOSITORY_ADVANCED_PDF_REVIEW_REQUIRED",
                  "PDF_FEEDBACK_PENDING_REPOSITORY_REFLECTION",
                  "CANON_CONFLICT",
                  "SUPERSEDED",
              ],
              "conflict_resolution": {
                  "structured_mismatch": "REPOSITORY_OWNER_VALUE_CONTROLS_AND_PDF_REGEN_REQUIRED",
                  "approved_visual_baseline_mismatch": "CORRECT_IMPLEMENTATION_OR_NEW_PDF_USER_REAPPROVAL",
                  "simultaneous_unresolved_difference": "CANON_CONFLICT",
              },
              "conflict_gate": "CANON_CONFLICT_BLOCKS_COMPLETION_AND_RELEASE",
          }
          metadata = contract.setdefault("human_pdf_required_metadata", [])
          for field in (
              "pdf_sha256",
              "approval_ref",
              "approved_at",
              "canonical_status",
              "supersedes_pdf_ref",
              "pdf_canon_manifest_ref",
          ):
              if field not in metadata:
                  metadata.append(field)

          old_invariant_fragments = (
              "The human-facing GDD PDF is a derived snapshot",
              "The human Blueprint progress views are read-only projections",
          )
          invariants = [
              item
              for item in contract.get("invariants", [])
              if not any(fragment in item for fragment in old_invariant_fragments)
          ]
          additions = [
              "Project authority is federated: the repository execution/data canon and a user-approved, manifest-registered human Blueprint PDF canon own separate domains under one editable owner per atomic fact.",
              "The repository canon owns editable code, scenes, resources, assets, structured data, identifiers, rules, values, state transitions, decisions, work status, tests, runtime facts, and evidence.",
              "The approved human Blueprint PDF canon owns the immutable user-reviewed visual hierarchy, project/player experience map, flow composition, information priority, milestone scope presentation, and human review baseline.",
              "A generated candidate, preview, Library-only PDF, or PDF annotation is not canon and cannot mutate repository-owned structured facts.",
              "PDF structured content and progress status are repository projections; project_work_kanban remains the single mutable progress source.",
              "PDF canon activation requires user approval, exact source commit, PDF SHA-256, approval reference, approval time, canonical status, supersession reference, and repository-controlled manifest reference.",
              "An approved PDF is immutable; a correction creates a new version and hash while preserving superseded approval history.",
              "A structured mismatch requires repository-owner reconciliation and PDF regeneration; an approved visual-baseline mismatch requires implementation correction or a newly approved PDF.",
              "CANON_CONFLICT blocks completion and release until repository and approved-PDF domains are reconciled.",
          ]
          for item in additions:
              if item not in invariants:
                  invariants.append(item)
          contract["invariants"] = invariants
          save(v4_path, json.dumps(contract, ensure_ascii=False, indent=2))

          for path in ACTIVE_ROUTING_SURFACES:
              content = replace_tokens(load(path))
              content = append_route_if_needed(path, content)
              save(path, content)

          decisions_path = "templates/project-operations/CURRENT_CONFIRMED_DECISIONS.md"
          decisions = load(decisions_path)
          decisions = decisions.replace(
              "human_gdd_pdf_derived_view:",
              "approved_human_blueprint_pdf_canon:",
          )
          decisions = decisions.replace(
              "## 2. Repository·derived human view 동기화 상태",
              "## 2. Repository·승인 PDF 정본 정렬 상태",
          )
          decisions = decisions.replace(
              "repository 정본과 파생 PDF/예외 record 의미 일치 확인",
              "repository 실행·데이터 정본과 승인 PDF 시각·검수 정본의 역할별 의미 일치 확인",
          )
          decisions = decisions.replace(
              "`REPOSITORY_PRIMARY_CANON`과 파생 PDF/legacy source의 역할이 섞이지 않는다.",
              f"`{REPOSITORY}`와 `{HUMAN}`의 역할이 섞이지 않고 `{SINGLE}`를 지킨다.",
          )
          save(decisions_path, decisions)

          compatibility_tests = [
              "tests/test_repository_first_workspace_contract.py",
              "tests/test_notion_project_workspace_contract.py",
              "tests/test_blueprint_progress_incremental_revision_contract.py",
          ]
          for path in compatibility_tests:
              content = replace_tokens(load(path))
              content = content.replace(
                  '"REPOSITORY_PRIMARY_CANON", contract["project_canon"]',
                  '"FEDERATED_REPOSITORY_AND_APPROVED_PDF_CANON", contract["project_canon"]',
              )
              content = content.replace(
                  "PM_STATUS_IS_READ_ONLY_DERIVED_VIEW",
                  "PDF_PROGRESS_STATUS_IS_REPOSITORY_PROJECTION",
              )
              save(path, content)

          for path in ACTIVE_ROUTING_SURFACES:
              content = load(path)
              if MODEL not in content or HUMAN not in content:
                  raise SystemExit(f"missing active dual-canon route: {path}")
              for retired in RETIRED_TO_ACTIVE:
                  if retired in content:
                      raise SystemExit(f"retired active token remains in {path}: {retired}")

          for path in (workspace_path, master_path):
              content = load(path)
              for token in (
                  MODEL,
                  REPOSITORY,
                  HUMAN,
                  SINGLE,
                  CANDIDATE,
                  "PDF_STRUCTURED_CONTENT_IS_REPOSITORY_PROJECTION",
                  "PDF_ANNOTATION_IS_CHANGE_REQUEST_NOT_CANON_MUTATION",
                  "CANON_CONFLICT_BLOCKS_COMPLETION_AND_RELEASE",
              ):
                  if token not in content:
                      raise SystemExit(f"{path} missing {token}")

      - name: Run focused dual-canon regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_federated_dual_canon_contract \
            tests.test_repository_first_workspace_contract \
            tests.test_notion_project_workspace_contract \
            tests.test_blueprint_progress_incremental_revision_contract -v
          python -m py_compile \
            tests/test_federated_dual_canon_contract.py \
            tests/test_repository_first_workspace_contract.py \
            tests/test_notion_project_workspace_contract.py \
            tests/test_blueprint_progress_incremental_revision_contract.py
          git diff --check

      - name: Commit bounded correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-federated-dual-canon.yml
          git diff --check
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add -A
          git commit -m "feat: make GitHub and approved PDF federated canon"
          git push origin HEAD:work/846-blueprint-progress-incremental-revision
