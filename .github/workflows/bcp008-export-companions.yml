name: BCP008 Export Coupled Companions

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/implement-bcp-008-spec-design-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bcp008-coupled-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            skills/SKILL_REGISTRY.json
            skills/README.md
            skills/SKILL_IMPLEMENTATION_EVIDENCE.json
            skills/SKILL_BEHAVIOR_EVALS.json
            skills/SKILL_BEHAVIOR_COVERAGE_EVALS.json
            templates/research/UX_UI_REFERENCE_CARD.md
            templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md
            tests/test_game_ux_ui_system.py
            tests/test_skill_system_coverage.py
            tests/test_skill_behavior_evidence_hardening.py
            tests/test_skill_implementation_evidence.py
            tests/test_skill_behavior_governance_integration.py
            tests/test_skill_behavior_adversarial_boundaries.py
            tests/test_feature_spec_traceability_contract.py
            tests/test_cross_discipline_review_lenses.py
            tests/test_project_design_md_adapter.py
            tests/test_external_ui_procurement_gate.py
            tests/test_bcp008_behavior_and_procurement_pilot.py
            docs/generated/BASE_SKILL_IMPLEMENTATION_EVIDENCE.md
            docs/evidence/external-ui-procurement/BCP008_SHADCN_BUTTON_PILOT.json
            tools/build_skill_implementation_evidence.py
            tools/check_skill_system_coverage.py
            tools/validate_external_ui_procurement_receipt.py
            .github/workflows/validate-game-ux-ui-system.yml
          if-no-files-found: error
          retention-days: 1
