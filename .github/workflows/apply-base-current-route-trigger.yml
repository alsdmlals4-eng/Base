name: Apply Base-current active routing trigger

on:
  push:
    branches:
      - fix/base-current-project-work-bootstrap-20260902
    paths:
      - .github/workflows/apply-base-current-route-trigger.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact current-task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/base-current-project-work-bootstrap-20260902
          fetch-depth: 0

      - name: Align active project-work routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path("AGENTS.md"),
              Path("START_HERE.md"),
              Path("templates/custom-instructions.gpt.md"),
              Path("docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md"),
              Path("skills/managing-project-intake-and-work-contract/SKILL.md"),
              Path("skills/managing-project-intake-and-work-contract/references/work-decomposition-and-sequencing.md"),
              Path("templates/planning/EXECUTION_SEQUENCE_PLAN.md"),
              Path("templates/project-operations/.agents/skills/base-project-router/SKILL.md"),
              Path("templates/project-operations/AI_WORKFLOW.md"),
              Path("templates/project-operations/PROJECT_START_HERE.md"),
              Path("templates/project-operations/WORK_CODEX_MINIMUM_TRANSITION_STARTER_PROMPT.md"),
              Path("templates/project-operations/WORK_PROJECT_EXECUTION_CURRENT_ROUTER.md"),
              Path("templates/project-operations/WORK_PROJECT_START_CANON_CHECKLIST.md"),
          )
          old = (
              "`BASE_CURRENT_OPERATIONAL_BOOTSTRAP`: when current scope requires "
              "**Base-only maintenance** and future project sessions to fresh-read "
              "current Base without project-side preinstallation"
          )
          new = (
              "`BASE_CURRENT_OPERATIONAL_BOOTSTRAP` / `PROJECT_WORK_FRESH_BASE_ENTRY`: "
              "for **ordinary target-project work** and Base maintenance that need "
              "current PM/intake/workflow guidance without project-side preinstallation"
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"active route anchor missing or ambiguous: {path} count={text.count(old)}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit final route diff without temporary workflows
        shell: bash
        run: |
          rm .github/workflows/apply-base-current-route-trigger.yml
          rm .github/workflows/diagnose-base-current-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md START_HERE.md templates/custom-instructions.gpt.md docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md skills/managing-project-intake-and-work-contract/SKILL.md skills/managing-project-intake-and-work-contract/references/work-decomposition-and-sequencing.md templates/planning/EXECUTION_SEQUENCE_PLAN.md templates/project-operations/.agents/skills/base-project-router/SKILL.md templates/project-operations/AI_WORKFLOW.md templates/project-operations/PROJECT_START_HERE.md templates/project-operations/WORK_CODEX_MINIMUM_TRANSITION_STARTER_PROMPT.md templates/project-operations/WORK_PROJECT_EXECUTION_CURRENT_ROUTER.md templates/project-operations/WORK_PROJECT_START_CANON_CHECKLIST.md
          git add -u -- .github/workflows/apply-base-current-route-trigger.yml .github/workflows/diagnose-base-current-bootstrap.yml
          git commit -m "fix: route ordinary project work through current Base"

      - name: Verify focused Base-current behavior on committed closure
        shell: bash
        run: |
          python -m py_compile tools/run_project_work_gate.py tests/test_base_current_project_work_bootstrap.py tests/test_base_current_project_work_bootstrap_security.py tests/test_base_current_project_work_bootstrap_review.py
          python -m unittest tests.test_base_current_project_work_bootstrap tests.test_base_current_project_work_bootstrap_security tests.test_base_current_project_work_bootstrap_review tests.test_p08_ai_operations_contract -v
          git diff --check

      - name: Push verified final route commit
        run: git push origin HEAD:fix/base-current-project-work-bootstrap-20260902
