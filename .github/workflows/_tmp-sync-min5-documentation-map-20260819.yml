name: Temporary min5 documentation map sync

on:
  push:
    branches:
      - feat/adversarial-min5-until-clean-20260819
    paths:
      - tools/_tmp_sync_min5_documentation_map_20260819.py
      - .github/workflows/_tmp-sync-min5-documentation-map-20260819.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/adversarial-min5-until-clean-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact consumer sync
        run: python tools/_tmp_sync_min5_documentation_map_20260819.py
      - name: Run focused regressions
        run: |
          python -m unittest tests.test_base_long_horizon_work_contract -v
          python -m unittest tests.test_neutral_adversarial_feature_lifecycle -v
      - name: Remove temporary workflow and commit durable sync
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-sync-min5-documentation-map-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: sync minimum-five clean-review consumer map"
          git push origin HEAD:feat/adversarial-min5-until-clean-20260819
