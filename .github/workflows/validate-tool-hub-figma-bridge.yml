name: Validate Tool Hub Figma Bridge

on:
  pull_request:
    paths:
      - "tools/tool-hub/**"
      - "tools/figma-bridge/**"
      - "docs/operations/PROJECT_FIGMA_TARGET_REGISTRY.json"
      - ".github/workflows/validate-tool-hub-figma-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hub-figma-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  figma-bridge-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install reviewed dependencies
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './tools/base-tool-contracts[dev]' -e './tools/tool-hub[dev]'

      - name: Install reviewed dependencies on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.\tools\base-tool-contracts[dev]' -e '.\tools\tool-hub[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Delivery core contracts
        run: python -m pytest -q tools/tool-hub/tests/test_figma_delivery.py

      - name: Delivery hardening contracts
        run: python -m pytest -q tools/tool-hub/tests/test_figma_delivery_hardening.py

      - name: Concurrent claim contract
        run: python -m pytest -q tools/tool-hub/tests/test_figma_delivery_concurrency.py

      - name: Bridge HTTP authority contracts
        run: python -m pytest -q tools/tool-hub/tests/test_figma_bridge_api.py

      - name: Figma plugin static contracts
        run: python -m pytest -q tools/tool-hub/tests/test_figma_plugin_contract.py

      - name: Web trust-boundary contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_hub_warns_that_reviewed_runtime_must_not_be_edited_during_launch

      - name: Web project-first baseline contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_hub_browser_is_project_first_and_has_no_raw_command_surface

      - name: Web catalog launch-state contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_catalog_marks_all_three_reviewed_child_adapters_runnable

      - name: Web child-state contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_browser_uses_text_only_labels_and_project_tool_scoped_child_state

      - name: Web onboarding contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_browser_submits_the_selected_known_project_and_keeps_registered_projects_separate

      - name: Web desktop launcher contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_browser_installs_the_desktop_launcher_and_shuts_down_without_paths_or_pids

      - name: Web authenticated child URL contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_browser_opens_only_the_authenticated_loopback_url_returned_by_launch

      - name: Web Figma bridge UX contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_browser_has_project_scoped_figma_bridge_pairing_without_destination_inputs

      - name: Web anchor evidence contract
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_missing_project_anchor_evidence_has_a_truthful_public_reason

      - name: Web QA launch regression
        run: python -m pytest -q tools/tool-hub/tests/test_web_contract.py::test_hub_api_preserves_qa_launch_client
