name: Apply Base v9.4 Legacy Alias Test Fix

on:
  pull_request:
    paths:
      - "tools/apply_base_v9_4_legacy_alias_test_fix.py"
      - ".github/workflows/apply-base-v9-4-legacy-alias-test-fix.yml"

permissions:
  contents: write

jobs:
  apply-test-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Remove active Skill from legacy alias fixture
        run: python tools/apply_base_v9_4_legacy_alias_test_fix.py
      - name: Commit exact test fix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Legacy alias fixture already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_game_project_operating_system_structure.py
          git commit -m "test: keep active Skill out of legacy aliases"
          git push origin "HEAD:${HEAD_REF}"
