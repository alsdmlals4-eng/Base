name: Export Rotated Source Analysis Runner

on:
  push:
    branches:
      - feat/daily-source-analysis-auto-merge-20260814
    paths:
      - ".github/workflows/tmp-export-source-rotation.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply fixed Source rotation patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_source_rotation_import.py

      - name: Upload the exact patched analysis runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patched-source-analysis-runner
          path: tools/periodic_source_analysis.py
          if-no-files-found: error
