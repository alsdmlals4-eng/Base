name: One-shot v4.7 Diff Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/z-temp-v47-diff-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'docs/v47-notion-first-workflow-alignment-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove accidental related-page additions and temporary debug workflow
        shell: python
        run: |
          from pathlib import Path

          p = Path('docs/operations/BASE_PARTITION_MANIFEST.json')
          text = p.read_text(encoding='utf-8')
          parts = [
              ('P03', 'https://app.notion.com/p/3c11b237eb1c8122acffca50aed2c68f?pvs=204'),
              ('P04', 'https://app.notion.com/p/3c11b237eb1c81f2a6d7de82c0938277?pvs=204'),
              ('P05', 'https://app.notion.com/p/3c11b237eb1c81498eb5da3fea812390?pvs=204'),
          ]
          for i, (part_id, own_url) in enumerate(parts):
              marker = f'"part_id": "{part_id}"'
              start = text.index(marker)
              next_marker = f'"part_id": "P{int(part_id[1:]) + 1:02d}"'
              end = text.index(next_marker, start)
              seg = text[start:end]
              line = f'        "{own_url}",\n'
              if seg.count(line) != 1:
                  raise SystemExit(f'{part_id}: expected own related-page line once, found {seg.count(line)}')
              seg = seg.replace(line, '', 1)
              text = text[:start] + seg + text[end:]
          p.write_text(text, encoding='utf-8')

          debug = Path('.github/workflows/debug-v47-base-v9.yml')
          if debug.exists():
              debug.unlink()
          Path('.github/workflows/z-temp-v47-diff-cleanup.yml').unlink()
      - name: Commit bounded cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/operations/BASE_PARTITION_MANIFEST.json .github/workflows
          git diff --cached --check
          git commit -m "fix: remove accidental v4.7 manifest diff"
          git push origin HEAD:${{ github.head_ref }}
