name: Resolve and clean PR 803 temporary workflow

on:
  push:
    branches:
      - work/benchmark-modular-production-20260901
    paths:
      - .github/workflows/resolve-and-clean-pr803.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve verified thread and delete temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="$GITHUB_REF_NAME"
          query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved comments(first:100){nodes{databaseId}}}}}}}'
          payload="$(gh api graphql -f query="$query" -F owner=alsdmlals4-eng -F name=Base -F number=803)"
          thread_id="$(jq -r '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | select(any(.comments.nodes[]; .databaseId == 3900319688)) | .id' <<<"$payload")"
          if [[ -n "$thread_id" && "$thread_id" != "null" ]]; then
            mutation='mutation($thread:ID!){resolveReviewThread(input:{threadId:$thread}){thread{id isResolved}}}'
            result="$(gh api graphql -f query="$mutation" -F thread="$thread_id")"
            jq -e '.data.resolveReviewThread.thread.isResolved == true' <<<"$result" >/dev/null
          fi
          for path in .github/workflows/resolve-pr803-current-thread.yml .github/workflows/resolve-and-clean-pr803.yml; do
            sha="$(gh api "repos/$repo/contents/$path?ref=$branch" --jq .sha)"
            gh api --method DELETE "repos/$repo/contents/$path" \
              -f message="chore: remove temporary PR 803 resolver" \
              -f sha="$sha" \
              -f branch="$branch" >/dev/null
          done
