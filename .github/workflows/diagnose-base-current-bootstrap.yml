name: Diagnose Base-current bootstrap

on:
  push:
    branches:
      - fix/base-current-project-work-bootstrap-20260902
    paths:
      - .github/workflows/diagnose-base-current-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run focused suites and preserve full output
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_base_current_project_work_bootstrap \
            tests.test_base_current_project_work_bootstrap_security \
            tests.test_base_current_project_work_bootstrap_review \
            tests.test_p08_ai_operations_contract \
            -v > bootstrap-test.log 2>&1
          printf '%s\n' "$?" > bootstrap-test.exit
          set -e
          cat bootstrap-test.log
      - name: Upload bounded diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: base-current-bootstrap-diagnostic
          path: |
            bootstrap-test.log
            bootstrap-test.exit
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing status
        if: always()
        shell: bash
        run: test "$(cat bootstrap-test.exit)" = "0"
