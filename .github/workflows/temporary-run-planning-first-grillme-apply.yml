name: Temporary Run Planning First Grill Me Apply

on:
  push:
    branches:
      - agent/planning-first-grillme-batch-governance

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/planning-first-grillme-batch-governance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/planning-first-grillme-batch-governance
          fetch-depth: 0
          show-progress: false

      - name: Execute embedded apply script and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/temporary-apply-planning-first-grillme.yml')
          text = source.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          git rm"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          code = textwrap.dedent(text[start:end])
          exec(compile(code, str(source), 'exec'), {'__name__': '__main__'})
          PY

          git rm \
            .github/workflows/temporary-apply-planning-first-grillme.yml \
            .github/workflows/temporary-run-planning-first-grillme-apply.yml
          git config user.name "Base Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: enforce planning-first Grill Me decision batches"
          git push origin HEAD:agent/planning-first-grillme-batch-governance
