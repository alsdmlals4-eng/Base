name: Validate Tool Hub Windows Child Ownership

on:
  pull_request:
    paths:
      - "tools/tool-hub/src/tool_hub/supervisor.py"
      - "tools/tool-hub/src/tool_hub/windows_process_owner.py"
      - "tools/tool-hub/src/tool_hub/adapters.py"
      - "tools/tool-hub/src/tool_hub/environment.py"
      - "tools/tool-hub/src/tool_hub/runtime_trust.py"
      - "tools/tool-hub/src/tool_hub/registry.py"
      - "tools/tool-hub/tests/test_windows_process_owner.py"
      - "tools/tool-hub/tests/test_windows_reviewed_launch.py"
      - "tools/tool-hub/tests/test_windows_multi_studio_smoke.py"
      - "tools/tool-hub/tests/test_multi_studio_smoke.py"
      - "tools/tool-hub/tests/test_supervisor.py"
      - "tools/tool-hub/tests/test_adapters.py"
      - "tools/tool-hub/tests/test_environment.py"
      - ".github/workflows/validate-tool-hub-windows-child.yml"
  push:
    branches: [main]
    paths:
      - "tools/tool-hub/src/tool_hub/supervisor.py"
      - "tools/tool-hub/src/tool_hub/windows_process_owner.py"
      - "tools/tool-hub/src/tool_hub/adapters.py"
      - "tools/tool-hub/src/tool_hub/environment.py"
      - "tools/tool-hub/src/tool_hub/runtime_trust.py"
      - "tools/tool-hub/src/tool_hub/registry.py"
      - "tools/tool-hub/tests/test_windows_process_owner.py"
      - "tools/tool-hub/tests/test_windows_reviewed_launch.py"
      - "tools/tool-hub/tests/test_windows_multi_studio_smoke.py"
      - "tools/tool-hub/tests/test_multi_studio_smoke.py"
      - ".github/workflows/validate-tool-hub-windows-child.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hub-windows-child-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-real-process-tree:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies and reviewed Base venv
        shell: pwsh
        run: |
          python -m pip install `
            -e '.\tools\base-tool-contracts' `
            -e '.\tools\tool-hub[dev]' `
            -e '.\tools\expression-studio' `
            -e '.\tools\sprite-animation-studio'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install `
            -e '.\tools\base-tool-contracts' `
            -e '.\tools\qa-evidence-studio' `
            -e '.\tools\expression-studio' `
            -e '.\tools\sprite-animation-studio'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real Windows ownership, reviewed launch, and multi-project smoke contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tools/tool-hub/tests/test_windows_process_owner.py `
            tools/tool-hub/tests/test_windows_reviewed_launch.py `
            tools/tool-hub/tests/test_windows_multi_studio_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-supervisor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Tool Hub test dependencies
        run: python -m pip install -e './tools/base-tool-contracts' -e './tools/tool-hub[dev]'
      - name: Run Linux supervisor regression
        run: python -m pytest -q tools/tool-hub/tests/test_supervisor.py
