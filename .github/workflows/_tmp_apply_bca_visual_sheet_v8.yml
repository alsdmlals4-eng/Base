name: Apply BCA Visual Sheet v8 Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "tools/_tmp_apply_bca_visual_sheet_v8.py"
      - ".github/workflows/_tmp_apply_bca_visual_sheet_v8.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/bca-visual-sheet-v8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bca-visual-sheet-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/_tmp_apply_bca_visual_sheet_v8.py
      - name: Normalize generated markdown endings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "docs/knowledge/skills/ART_DIRECTION_SKILL_MATRIX.md",
              "skills/SKILL_LEARNING_LOG.md",
              "templates/planning/ART_DIRECTION_BRIEF.md",
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
      - name: Validate generated files
        shell: bash
        run: |
          set +e
          {
            python -m py_compile tools/_tmp_apply_bca_visual_sheet_v8.py tests/test_bca_visual_sheet_workflow.py
            python -m unittest tests.test_bca_visual_sheet_workflow -v
            git diff --check
          } > bca-patch-validation.txt 2>&1
          status=$?
          cat bca-patch-validation.txt
          exit "$status"
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bca-patch-validation
          path: bca-patch-validation.txt
          if-no-files-found: error
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            templates/prompts/VERTICAL_SLICE_INTEGRATED_EXECUTION_PROMPT_v7.md \
            templates/prompts/VERTICAL_SLICE_INTEGRATED_EXECUTION_PROMPT_v8.md \
            docs/PLANNING_SEQUENCE_AND_EVIDENCE_POLICY.md \
            docs/DOCUMENTATION_MAP.md \
            docs/CHANGELOG.md \
            docs/knowledge/VERTICAL_SLICE_V6_REQUIREMENT_COVERAGE.md \
            docs/knowledge/skills/ART_DIRECTION_SKILL_MATRIX.md \
            START_HERE.md \
            templates/project-operations/README.md \
            templates/planning/ART_DIRECTION_BRIEF.md \
            skills/SKILL_REGISTRY.json \
            skills/SKILL_LEARNING_LOG.md \
            .github/reference-freshness.json
          git diff --cached --check
          git commit -m "feat: integrate BCA visual and sheet workflow v8"
          git push origin HEAD:agent/bca-visual-sheet-v8
