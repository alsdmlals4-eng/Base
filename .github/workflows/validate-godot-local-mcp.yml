name: Validate Godot Local MCP

on:
  pull_request:
    paths:
      - ".github/workflows/validate-godot-local-mcp.yml"
      - "templates/project-operations/godot-local-mcp/**"
      - "tests/test_godot_local_mcp_*.py"
      - "docs/superpowers/specs/2026-08-06-godot-local-mcp-*.md"
      - "docs/superpowers/plans/2026-08-06-godot-local-mcp-*.md"
  push:
    branches:
      - "agent/godot-local-mcp-gateway-core"
    paths:
      - ".github/workflows/validate-godot-local-mcp.yml"
      - "templates/project-operations/godot-local-mcp/**"
      - "tests/test_godot_local_mcp_*.py"
      - "docs/superpowers/specs/2026-08-06-godot-local-mcp-*.md"
      - "docs/superpowers/plans/2026-08-06-godot-local-mcp-*.md"

permissions:
  contents: read

jobs:
  gateway-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install exact MCP test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          mcp==2.0.0
          jsonschema==4.26.0

      - name: Run Godot MCP contract tests
        run: >-
          python -m unittest
          tests.test_godot_local_mcp_server
          tests.test_godot_local_mcp_profile_store
          tests.test_godot_local_mcp_stdio
          tests.test_godot_local_mcp_framing
          tests.test_godot_local_mcp_bridge_client
          tests.test_godot_local_mcp_authenticated_stdio
          -v
