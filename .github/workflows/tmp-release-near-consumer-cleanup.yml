name: Temporary release-near consumer cleanup

on:
  push:
    branches:
      - feat/release-near-vertical-slice-first-v2-20260820

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-near-consumer-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-near-vertical-slice-first-v2-20260820
      - name: Remove superseded visualized-PoC authority
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md')
          text = path.read_text(encoding='utf-8')
          old = "`VISUALIZED_POC_BEFORE_DEMO_TEST`: 플레이 경험을 UI/UX와 화면 맥락 없이 판단하면 왜곡될 위험이 큰 게임 PoC/데모는 회색 박스만으로 최종 평가하지 않는다. 기획·검수 단계에서 필요한 화면·HUD·핵심 상태·아트 앵커 이미지를 만들거나 승인된 기존 이미지를 선택하고, 올바른 Project의 Notion Visual/Asset surface에 배치·readback한 뒤 이를 구현 패키지의 시각 입력으로 사용한다. 모든 PoC에 완성 아트를 강제하지 않으며, 이미지가 판단에 실질 영향을 주지 않는 순수 로직 PoC는 예외로 기록한다."
          new = "`RELEASE_NEAR_VERTICAL_SLICE_FIRST`: 기획·검수 뒤 재미·몰입·가독성·첫인상·판매 포인트·감정 곡선을 판단하는 플레이 테스트는 shipping-intent UI/UX·이미지/아트·대표 사운드·VFX/피드백·핵심 시스템/콘텐츠가 연결된 짧은 완성형 Vertical Slice에서 수행한다. 좁은 기술 질문은 `TECHNICAL_SPIKE_INTERNAL_ONLY`로 먼저 풀 수 있지만 `SYSTEM_ONLY_POC_NOT_PLAYER_EXPERIENCE_EVIDENCE`에 따라 그 결과만으로 플레이어 경험을 PASS 처리하지 않는다."
          if 'VISUALIZED_POC_BEFORE_DEMO_TEST' not in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected legacy paragraph anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md
          git diff --cached --exit-code && exit 0
          git commit -m "fix: supersede visualized PoC consumer wording [release-near-consumer-cleanup]"
          git push origin HEAD:feat/release-near-vertical-slice-first-v2-20260820
