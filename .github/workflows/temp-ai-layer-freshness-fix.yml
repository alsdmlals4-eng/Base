name: Temporary AI layer freshness fix

on:
  push:
    branches:
      - work/video-ai-terms-absorption-20260901

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/video-ai-terms-absorption-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Apply freshness companions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          test_path = root / 'tests/test_p08_ai_operations_contract.py'
          test_text = test_path.read_text(encoding='utf-8')
          marker = 'test_intake_ai_solution_layer_selection_routes_before_build'
          if marker not in test_text:
              method = '''
              def test_intake_ai_solution_layer_selection_routes_before_build(self) -> None:
                  intake = (ROOT / "skills/managing-project-intake-and-work-contract/SKILL.md").read_text(encoding="utf-8")
                  capability = (ROOT / "docs/CAPABILITY_COMPOSITION_MAP.md").read_text(encoding="utf-8")
                  for term in (
                      "PUBLIC_VIDEO_SOURCE_RECOVERY_BEFORE_BLOCKER",
                      "AI_SOLUTION_LAYER_SELECTION_BEFORE_BUILD",
                      "NO_AUTO_FEATURE_FROM_VOCABULARY",
                      "smallest sufficient layer",
                  ):
                      self.assertIn(term, intake)
                  for term in (
                      "AI_SOLUTION_LAYER_SELECTION",
                      "DETERMINISTIC_WORKFLOW_BEFORE_OPEN_ENDED_AGENT",
                      "HARNESS_COMPONENTS_REQUIRE_LOAD_BEARING_EVIDENCE",
                      "AGI_ASI_AWARENESS_ONLY",
                  ):
                      self.assertIn(term, capability)
          '''
              anchor = '\n\nif __name__ == "__main__":\n'
              if anchor not in test_text:
                  raise SystemExit('P08 test insertion anchor not found')
              test_text = test_text.replace(anchor, '\n' + method + anchor, 1)
              test_path.write_text(test_text, encoding='utf-8')

          learning_path = root / 'skills/managing-project-intake-and-work-contract/LEARNING_LOG.md'
          learning_text = learning_path.read_text(encoding='utf-8')
          heading = '## 2026-09-01 — Public video evidence and AI vocabulary need reader recovery and smallest-layer routing'
          if heading not in learning_text:
              entry = '''
          ## 2026-09-01 — Public video evidence and AI vocabulary need reader recovery and smallest-layer routing

          - **상태:** `OBSERVATION`
          - **호출 트리거:** 사용자가 공개 YouTube 영상의 실제 내용을 확인하고 Base에 없는 기능·구조만 흡수하라고 요청했지만, 첫 시도는 일반 웹 자막 경로 실패를 곧바로 `BLOCKED_UNVERIFIED`로 처리하고 영상의 보안·권한 측면만 추정하려 했다.
          - **Finding:** Base에는 이미 `RM-TOOL-005 PUBLIC_VIDEO_RESEARCH_INGEST_ADAPTER`, `tools/public_video_research_ingest.py`, local transcript binding, 출처 ladder와 저작권·비용 경계가 있었지만 universal intake가 이 reader owner를 외부 링크 blocker보다 먼저 호출한다고 명시하지 않았다. 또한 LLM·multimodal·RLHF·fine-tuning·prompt engineering·knowledge base·RAG·MCP·agent·workflow·harness·AGI/ASI 같은 용어를 접했을 때 실제 병목과 consumer를 기준으로 최소 충분 계층을 고르는 공용 route가 없어, 용어 목록이 불필요한 기능 backlog로 변할 위험이 있었다.
          - **Decision:** 새 Skill·RAG·MCP server·agent framework·harness product를 만들지 않는다. Intake가 공개 영상에 대해 기존 reader ladder를 먼저 소진하고, 원문을 확보한 뒤 Base 현행 owner와 비교한다. AI 구조 제안은 `measured bottleneck → smallest sufficient layer → actual consumer → deterministic eval/readback` 순서로 판단하며 predictable process는 workflow를, genuinely open-ended dynamic planning만 agent를 후보로 둔다. 현재·변경 가능한 사실은 prompt/context/retrieval을 먼저 사용하고 fine-tuning은 task-specific repeated eval evidence가 있을 때만 별도 후보로 둔다.
          - **TDD / regression evidence:** PR #810의 최초 exact head `e430c5bf49908cfcfff650fa2f0f060d831c1aa5`에서 신규 9개 계약과 기존 관련 회귀는 통과했지만 Game Project OS run `33452544294`의 canonical freshness가 기존 companion test와 Skill Learning Log 동기화 누락을 정확히 차단했다. 이 기록과 `tests/test_p08_ai_operations_contract.py`의 기존-suite companion assertion을 추가해 standalone 신규 테스트만 통과하는 거짓 GREEN을 방지한다.
          - **Evidence ceiling:** 공개 자막 확보는 source inspection evidence일 뿐 영상의 모든 기술 설명을 사실로 만들지 않는다. 문서·계약 테스트는 RAG/MCP/agent/harness runtime, 프로젝트 채택, 품질 향상이나 비용 절감을 입증하지 않는다.
          - **다음 검토 트리거:** 공개 영상이 있는데 기존 reader ladder를 거치지 않고 다시 조기 차단하거나, AI 용어만으로 신규 서비스·모델·벡터 DB·agent framework를 추가하거나, predictable workflow를 이유 없이 agent화하거나, model 업그레이드 뒤 load-bearing evidence 없는 harness 구성요소를 유지할 때.

          '''
              title = '# Managing Project Intake and Work Contracts — Learning Log\n\n'
              if not learning_text.startswith(title):
                  raise SystemExit('Learning log title anchor not found')
              learning_text = title + entry + learning_text[len(title):]
              learning_path.write_text(learning_text, encoding='utf-8')
          PY

          rm .github/workflows/temp-ai-layer-freshness-fix.yml

      - name: Run focused tests before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_ai_solution_layer_selection_contract \
            tests.test_p08_ai_operations_contract \
            tests.test_public_video_research_ingest \
            tests.test_skill_implementation_evidence \
            -v
          python tools/build_skill_implementation_evidence.py --check
          python -m py_compile \
            tests/test_ai_solution_layer_selection_contract.py \
            tests/test_p08_ai_operations_contract.py

      - name: Commit exact fix candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_p08_ai_operations_contract.py \
            skills/managing-project-intake-and-work-contract/LEARNING_LOG.md \
            .github/workflows/temp-ai-layer-freshness-fix.yml
          git commit -m 'fix(ai): sync intake learning and companion regression'

      - name: Verify canonical freshness and final diff
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base origin/main \
            --head HEAD
          python -m unittest \
            tests.test_ai_solution_layer_selection_contract \
            tests.test_p08_ai_operations_contract \
            tests.test_public_video_research_ingest \
            tests.test_skill_implementation_evidence \
            -v
          python tools/build_skill_implementation_evidence.py --check
          git diff --check origin/main...HEAD
          test ! -e .github/workflows/temp-ai-layer-freshness-fix.yml

      - name: Push verified fix
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:work/video-ai-terms-absorption-20260901
