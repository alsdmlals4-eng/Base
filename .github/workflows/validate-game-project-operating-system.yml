name: Validate Game Project Operating System

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      validation_level:
        description: Validation tier to run
        required: true
        default: auto
        type: choice
        options:
          - auto
          - docs
          - contract
          - code
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      canonical_contract: ${{ steps.classify.outputs.canonical_contract }}
      code_or_engine: ${{ steps.classify.outputs.code_or_engine }}
      ci_toolchain_high_risk: ${{ steps.classify.outputs.ci_toolchain_high_risk }}
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
      platform_smoke: ${{ steps.classify.outputs.platform_smoke }}
      run_contract: ${{ steps.classify.outputs.run_contract }}
      run_publication: ${{ steps.classify.outputs.run_publication }}
      run_windows: ${{ steps.classify.outputs.run_windows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_LEVEL: ${{ github.event.inputs.validation_level || 'auto' }}
        run: |
          set -euo pipefail

          level=""
          platform_smoke=false

          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            level=full
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$VALIDATION_LEVEL" != "auto" ]]; then
            level="$VALIDATION_LEVEL"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            level=full
          else
            if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
              echo "Missing pull request base/head SHA; escalating to CI high risk."
              level=ci
            else
              git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
              cat changed-files.txt

              has_canonical=false
              has_code=false
              has_ci=false

              while IFS= read -r path; do
                [[ -z "$path" ]] && continue
                case "$path" in
                  .github/workflows/*|tests/test_ci_workflow_cost_policy.py)
                    has_ci=true
                    ;;
                  tools/build_design_documents.py|tools/build_policy_driven_design_documents.py|tools/design_document_diagrams.py|tools/publication_v3.py|tools/publication_readiness.py|tools/check_publication_environment.py|tests/test_design_document_publication_governance.py|tests/test_design_document_generation.py|tests/test_policy_driven_publication.py|tests/test_project_skill_map_generation.py|tests/test_publication_readiness.py|tests/test_ui_art_audit.py|requirements-publication.txt|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                    has_code=true
                    platform_smoke=true
                    ;;
                  tools/qa-evidence-studio/*)
                    has_code=true
                    platform_smoke=false
                    ;;
                  tools/*|tests/*|*.py|*.js|*.mjs|*.cjs|*.ts|*.tsx|*.gd|*.tscn|*.tres|project.godot)
                    has_code=true
                    ;;
                  AGENTS.md|START_HERE.md|docs/OPERATING_MODEL.md|docs/WORK_MODE_AND_SKILL_ROUTING.md|docs/DOCUMENTATION_MAP.md|docs/GPT_CODEX_WORKFLOW_POLICY.md|docs/CI_EXECUTION_COST_POLICY.md|skills/*|schemas/*|templates/*|.github/reference-freshness.json)
                    has_canonical=true
                    ;;
                  README.md|docs/*|*.md|*.txt)
                    ;;
                  *)
                    echo "Unknown change path '$path'; escalating to code validation."
                    has_code=true
                    ;;
                esac
              done < changed-files.txt

              if [[ "$has_ci" == true ]]; then
                level=ci
              elif [[ "$has_code" == true ]]; then
                level=code
              elif [[ "$has_canonical" == true ]]; then
                level=contract
              else
                level=docs
              fi
            fi
          fi

          case "$level" in
            docs)
              docs_only=true
              canonical_contract=false
              code_or_engine=false
              ci_toolchain_high_risk=false
              full_matrix=false
              run_contract=false
              run_publication=false
              run_windows=false
              ;;
            contract)
              docs_only=false
              canonical_contract=true
              code_or_engine=false
              ci_toolchain_high_risk=false
              full_matrix=false
              run_contract=true
              run_publication=false
              run_windows=false
              ;;
            code)
              docs_only=false
              canonical_contract=false
              code_or_engine=true
              ci_toolchain_high_risk=false
              full_matrix=false
              run_contract=true
              run_publication=true
              run_windows="$platform_smoke"
              ;;
            ci)
              docs_only=false
              canonical_contract=false
              code_or_engine=false
              ci_toolchain_high_risk=true
              full_matrix=false
              platform_smoke=true
              run_contract=true
              run_publication=true
              run_windows=true
              ;;
            full)
              docs_only=false
              canonical_contract=false
              code_or_engine=false
              ci_toolchain_high_risk=false
              full_matrix=true
              platform_smoke=true
              run_contract=true
              run_publication=true
              run_windows=true
              ;;
            *)
              echo "Unsupported validation level '$level'."
              exit 1
              ;;
          esac

          {
            echo "docs_only=$docs_only"
            echo "canonical_contract=$canonical_contract"
            echo "code_or_engine=$code_or_engine"
            echo "ci_toolchain_high_risk=$ci_toolchain_high_risk"
            echo "full_matrix=$full_matrix"
            echo "platform_smoke=$platform_smoke"
            echo "run_contract=$run_contract"
            echo "run_publication=$run_publication"
            echo "run_windows=$run_windows"
          } >> "$GITHUB_OUTPUT"

          echo "Selected validation level: $level"

  docs-validation:
    name: docs-validation
    needs: classify-changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up baseline Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate whitespace
        id: whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA" 2>&1 | tee whitespace-results.txt
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA...$GITHUB_SHA" 2>&1 | tee whitespace-results.txt
          else
            git diff --check "${GITHUB_SHA}^...${GITHUB_SHA}" 2>&1 | tee whitespace-results.txt
          fi
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Validate Required Check topology
        run: python tools/check_ci_required_gate_topology.py

      - name: Run lightweight contract tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests/test_gpt_codex_workflow_contract.py \
            tests/test_ci_workflow_cost_policy.py \
            tests/test_ci_required_gate_topology.py \
            tests/test_ci_required_gate_evaluator.py \
            tests/test_repository_governance_baseline.py \
            -v 2>&1 | tee docs-validation-results.txt

      - name: Upload docs diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-validation-diagnostics
          path: |
            whitespace-results.txt
            docs-validation-results.txt
          if-no-files-found: warn
          retention-days: 1

  core-regression:
    name: core-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/validation-requirements.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --requirement .github/validation-requirements.txt

      - name: Run whole core regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee core-regression-results.txt
          python tools/check_skill_system_coverage.py 2>&1 | tee -a core-regression-results.txt

      - name: Upload core regression diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-regression-diagnostics
          path: core-regression-results.txt
          if-no-files-found: warn
          retention-days: 1

  ubuntu-contract:
    name: ubuntu-contract
    needs: classify-changes
    if: needs.classify-changes.outputs.run_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            tools/build_project_skill_map.py \
            tools/skill_map_diagrams.py \
            tools/build_design_documents.py \
            tools/build_policy_driven_design_documents.py \
            tools/design_document_diagrams.py \
            tools/publication_v3.py \
            tools/publication_readiness.py \
            tools/check_publication_environment.py \
            tools/run_local_validation.py \
            tools/check_base_change_proposals.py \
            tools/check_interview_contract.py \
            tools/audit_external_source.py \
            tools/check_canonical_reference_freshness.py \
            tools/check_ci_required_gate_topology.py \
            tools/evaluate_ci_required_gate.py \
            tools/check_skill_system_coverage.py \
            skills/auditing-and-refining-ui-art/scripts/scan_ui_art_signals.py \
            templates/project-operations/github/check_documentation_governance.py \
            templates/project-operations/github/check_skill_routing_governance.py \
            templates/project-operations/github/check_design_document_publications.py \
            tests/test_documentation_governance.py \
            tests/test_controlled_vocabulary_contract.py \
            tests/test_skill_routing_governance.py \
            tests/test_consolidated_skill_references.py \
            tests/test_reference_freshness.py \
            tests/test_skill_package_integrity.py \
            tests/test_skill_system_coverage.py \
            tests/test_game_project_operating_system_structure.py \
            tests/test_base_change_proposals.py \
            tests/test_deep_interview_contract.py \
            tests/test_gpt_codex_workflow_contract.py \
            tests/test_ci_workflow_cost_policy.py \
            tests/test_ci_required_gate_topology.py \
            tests/test_ci_required_gate_evaluator.py \
            tests/test_publication_readiness.py \
            tests/test_local_validation.py \
            tests/test_repository_governance_baseline.py

      - name: Validate Base change proposals
        if: github.event_name == 'pull_request'
        run: python tools/check_base_change_proposals.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Check canonical reference freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            2>&1 | tee reference-freshness-results.txt

      - name: Run contract and governance regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest \
            tests/test_documentation_governance.py \
            tests/test_controlled_vocabulary_contract.py \
            tests/test_skill_routing_governance.py \
            tests/test_consolidated_skill_references.py \
            tests/test_reference_freshness.py \
            tests/test_skill_package_integrity.py \
            tests/test_skill_system_coverage.py \
            tests/test_game_project_operating_system_structure.py \
            tests/test_base_change_proposals.py \
            tests/test_deep_interview_contract.py \
            tests/test_gpt_codex_workflow_contract.py \
            tests/test_ci_workflow_cost_policy.py \
            tests/test_ci_required_gate_topology.py \
            tests/test_ci_required_gate_evaluator.py \
            tests/test_publication_readiness.py \
            tests/test_local_validation.py \
            tests/test_repository_governance_baseline.py \
            -v 2>&1 | tee operating-system-contract-results.txt
          python tools/check_skill_system_coverage.py \
            2>&1 | tee -a operating-system-contract-results.txt

      - name: Upload contract diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operating-system-contract-diagnostics
          path: |
            reference-freshness-results.txt
            operating-system-contract-results.txt
          if-no-files-found: warn
          retention-days: 1

  publication-validation:
    name: publication-validation
    needs: classify-changes
    if: needs.classify-changes.outputs.run_publication == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install system publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-nanum poppler-utils

      - name: Install Python publication dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt

      - name: Install Node publication dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile

      - name: Run publication and generation tests
        shell: bash
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          python -m unittest \
            tests/test_design_document_publication_governance.py \
            tests/test_design_document_generation.py \
            tests/test_policy_driven_publication.py \
            tests/test_project_skill_map_generation.py \
            tests/test_publication_readiness.py \
            tests/test_ui_art_audit.py \
            -v 2>&1 | tee publication-test-results.txt

      - name: Upload publication diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-diagnostics-ubuntu
          path: publication-test-results.txt
          if-no-files-found: warn
          retention-days: 1

  platform-smoke-windows:
    name: platform-smoke-windows
    needs: classify-changes
    if: needs.classify-changes.outputs.run_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publication.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Windows system publication dependencies
        shell: pwsh
        run: |
          $libreOfficeVersion = "26.2.3"
          $libreOfficeSha256 = "468d1fb3880af3bcddac002e9054155912c70b45d105bfa1c82036f33456133d"
          $libreOfficeUrl = "https://download.documentfoundation.org/libreoffice/stable/$libreOfficeVersion/win/x86_64/LibreOffice_${libreOfficeVersion}_Win_x86-64.msi"
          $libreOfficeMsi = Join-Path $env:RUNNER_TEMP "LibreOffice_${libreOfficeVersion}_Win_x86-64.msi"
          Invoke-WebRequest -Uri $libreOfficeUrl -OutFile $libreOfficeMsi
          $actualLibreOfficeHash = (Get-FileHash -Algorithm SHA256 $libreOfficeMsi).Hash.ToLowerInvariant()
          if ($actualLibreOfficeHash -ne $libreOfficeSha256) {
            throw "LibreOffice MSI SHA-256 mismatch: expected $libreOfficeSha256, got $actualLibreOfficeHash"
          }
          $libreOfficeInstall = Start-Process msiexec.exe -ArgumentList @(
            "/i",
            "`"$libreOfficeMsi`"",
            "/qn",
            "/norestart"
          ) -Wait -PassThru
          if (@(0, 3010) -notcontains $libreOfficeInstall.ExitCode) {
            throw "LibreOffice MSI install failed with exit code $($libreOfficeInstall.ExitCode)"
          }

          $popplerVersion = "24.08.0-0"
          $popplerUrl = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip"
          $popplerZip = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion.zip"
          $popplerRoot = Join-Path $env:RUNNER_TOOL_CACHE "poppler-$popplerVersion"
          Invoke-WebRequest -Uri $popplerUrl -OutFile $popplerZip
          $actualHash = (Get-FileHash -Algorithm SHA256 $popplerZip).Hash
          $expectedHash = "58A6F9AE269756231D2F9AA6CBA39D75FEC6DEACAF3C4A50683383B5F3D5A527"
          if ($actualHash -ne $expectedHash) {
            throw "Poppler archive SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          Expand-Archive -LiteralPath $popplerZip -DestinationPath $popplerRoot

      - name: Install Windows Python publication dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-publication.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Windows QA Evidence Studio dependencies
        if: ${{ false }}
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -e ".\tools\qa-evidence-studio[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Windows Node publication dependencies
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.9.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows publication smoke tests
        shell: pwsh
        env:
          BASE_LIBREOFFICE: C:\Program Files\LibreOffice\program\soffice.exe
          BASE_PDFTOPPM: ${{ runner.tool_cache }}\poppler-24.08.0-0\poppler-24.08.0\Library\bin\pdftoppm.exe
          PUPPETEER_EXECUTABLE_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
          PYTHONIOENCODING: utf-8
        run: |
          if (-not (Test-Path -LiteralPath $env:BASE_PDFTOPPM)) {
            throw "pdftoppm.exe not found at pinned path: $env:BASE_PDFTOPPM"
          }
          python tools/check_publication_environment.py --require-mermaid
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_design_document_generation tests.test_policy_driven_publication tests.test_project_skill_map_generation tests.test_publication_readiness tests.test_ui_art_audit -v

      - name: Run Windows QA Evidence Studio smoke
        if: ${{ false }}
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          .\.venv\Scripts\python.exe -c "import qa_evidence_studio; print('QA_EVIDENCE_IMPORT_OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pytest -q tools/qa-evidence-studio/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ci-gate:
    name: ci-gate
    needs:
      - classify-changes
      - docs-validation
      - core-regression
      - ubuntu-contract
      - publication-validation
      - platform-smoke-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Evaluate required validation jobs
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          DOCS_RESULT: ${{ needs.docs-validation.result }}
          CORE_REGRESSION_RESULT: ${{ needs.core-regression.result }}
          CONTRACT_REQUIRED: ${{ needs.classify-changes.outputs.run_contract }}
          CONTRACT_RESULT: ${{ needs.ubuntu-contract.result }}
          PUBLICATION_REQUIRED: ${{ needs.classify-changes.outputs.run_publication }}
          PUBLICATION_RESULT: ${{ needs.publication-validation.result }}
          WINDOWS_REQUIRED: ${{ needs.classify-changes.outputs.run_windows }}
          WINDOWS_RESULT: ${{ needs.platform-smoke-windows.result }}
        run: python tools/evaluate_ci_required_gate.py
