name: One-shot GPT role registry migration

on:
  push:
    branches:
      - workflow/gpt-codex-role-split-20260825
    paths:
      - ".github/workflows/role-registry-migration-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch Registry and Manifest structurally
        shell: python
        run: |
          import json
          from pathlib import Path

          registry_path = Path("skills/SKILL_REGISTRY.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          entry = next(x for x in registry["skills"] if x["skill_id"] == "maintaining-project-context-and-handoff")
          entry["trigger_tags"] = [
              "handoff",
              "active-context-change",
              "phase-boundary",
              "new-chat",
              "godot-product-implementation-handoff",
              "godot-work-instruction",
              "godot-package-handoff",
              "gdscripting",
              "godot-scene-resource-implementation",
              "godot-runtime-test",
              "resume-godot-implementation",
              "post-merge-reconcile",
              "agent-merge",
              "verified-pr-merge"
          ]
          entry["use_when"] = [
              "현재 상태를 새 채팅/담당자에게 넘기거나, GPT가 기획·검수·Base·Notion·문서·Visual 작업을 끝낸 뒤 실제 게임 프로젝트의 GDScript·Scene·Resource·runtime wiring·build/export·Godot runtime/play test 구현이 남았을 때 프로젝트 GitHub+Notion 재수화를 요구하는 Codex Godot 제품 구현 인계를 만든다."
          ]
          entry["do_not_use_when"] = [
              "Base 정책·Skill·Guide·Template·Registry/generated·CI/test contract, Notion, GDD·표·Flow·이미지·조사·검수처럼 GPT가 직접 닫는 비제품 작업만 남았거나 실제 Godot 제품 구현이 없는 경우다."
          ]
          entry["review_triggers"] = [
              "콜드 스타트 실패",
              "상태 불일치",
              "Base/Notion 작업을 Codex에 넘김",
              "코드 파일이라는 이유만으로 Codex owner로 분류",
              "실제 Godot 제품 구현을 GPT가 누적 수행",
              "Godot 프로젝트 GitHub+Notion 재수화 누락",
              "Codex 이미지 생성·생성형 편집",
              "미승인 Notion Visual 사용",
              "CHANGE_PROPOSAL 없이 프로젝트 코어·UX·밸런스·서사·Art Direction 변경",
              "stale project/worktree/session 사용",
              "지정 Branch 밖 Push",
              "검증 전 병합",
              "승인 완료 항목 재승인 요구"
          ]
          entry["last_reviewed_at"] = "2026-08-25"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

          manifest_path = Path("docs/operations/BASE_PARTITION_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["worker_model"] = "GPT_BASE_MAINTENANCE_CODEX_GODOT_PRODUCT_ONLY"
          manifest["role_ownership"] = {
              "base_and_notion": "GPT_BASE_NOTION_GOVERNANCE_OWNER",
              "godot_product_implementation": "CODEX_GODOT_PRODUCT_IMPLEMENTATION_OWNER",
              "codex_general_repository_executor": False,
              "owner_decision_basis": "PRODUCT_RESPONSIBILITY_NOT_FILE_EXTENSION"
          }
          manifest["control_plane"]["execution_owner"] = "GPT_BASE_MAINTENANCE"
          p01 = next(x for x in manifest["parts"] if x["part_id"] == "P01")
          p01["important_rules"] = [
              "DIRECTION_FIRST",
              "GPT_NONCODING_PROJECT_OWNER",
              "GPT_BASE_NOTION_GOVERNANCE_OWNER",
              "NOTION_DEFAULT_PROJECT_WORKSPACE",
              "PROJECT_RELATION_REQUIRED",
              "SINGLE_INITIAL_APPROVAL_THEN_CONTINUE"
          ]
          p01["acceptance_criteria"] = [
              "intake→decision→Notion/GitHub→handoff 흐름에 중복 권위 0",
              "Base/Notion/문서/Registry/generated/CI/test contract를 Codex에 넘기는 오라우팅 0",
              "Codex handoff는 actual game-project Godot product implementation에만 생성",
              "프로젝트별 Notion 격리 유지",
              "사용자 학습형 완료보고 유지"
          ]
          p08 = next(x for x in manifest["parts"] if x["part_id"] == "P08")
          p08["important_rules"] = [
              "GPT_BASE_NOTION_GOVERNANCE_OWNER",
              "CODEX_GODOT_PRODUCT_IMPLEMENTATION_OWNER",
              "CODEX_NOT_GENERAL_REPOSITORY_EXECUTOR",
              "DEFAULT_SUPPORTING_SKILL_BUDGET: 1",
              "ZERO_INCREMENTAL_COST_REQUIRED",
              "CURRENT_PAID_PLANS: GPT_PRO"
          ]
          p08["modules"] = [
              "AI Instruction/Context",
              "Model/Cost Routing",
              "Source/Research Operations",
              "DeepSeek Worktree Orchestration",
              "Godot Product Implementation Handoff Boundary"
          ]
          p08["acceptance_criteria"] = [
              "불필요한 Skill/tool 호출 감소",
              "추가 유료 API/SaaS 기본 의존 0",
              "Base/Notion/non-product work Codex routing 0",
              "actual Godot product implementation에서만 Codex handoff",
              "외부 executor가 current project canon을 다시 읽음",
              "다른 worktree/프로젝트 혼입 0"
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Rebuild Registry-derived artifacts
        run: python tools/build_base_v9_artifacts.py --write
      - name: Remove one-shot workflow and commit migration
        run: |
          rm .github/workflows/role-registry-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SKILL_REGISTRY.json docs/operations/BASE_PARTITION_MANIFEST.json docs/generated/BASE_ACTIVE_SKILLS.md .github/workflows/role-registry-migration-once.yml
          if git diff --cached --quiet; then
            echo "No migration delta"
            exit 0
          fi
          git commit -m "chore: sync Godot-only Codex routing [role-patch]"
          git push origin HEAD:workflow/gpt-codex-role-split-20260825
