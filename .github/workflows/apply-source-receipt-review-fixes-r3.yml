name: Apply reviewed Source receipt fixes

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r2-20260902
    paths:
      - .github/workflows/apply-source-receipt-review-fixes-r3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r2-20260902
          fetch-depth: 0

      - name: Restore reviewed implementation payload
        shell: bash
        run: |
          cat > /tmp/source-receipt-review-fix.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/source-receipt-review-fix.b64 > /tmp/source-receipt-review-fix.tgz
          echo "9f2c87dcb14a96c5efbdd8fde3e9dd2a94ae1ca603b8d9b1083da981f33b9983  /tmp/source-receipt-review-fix.tgz" | sha256sum -c -
          tar -xzf /tmp/source-receipt-review-fix.tgz -C .

      - name: Run focused review regression suites
        shell: bash
        run: |
          python -m py_compile \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_review_round3.py
          python -m unittest \
            tests.test_periodic_source_receipt_state \
            tests.test_record_periodic_source_scan \
            tests.test_periodic_source_receipt_review_round3 \
            -v
          git diff --check

      - name: Remove one-shot workflow and commit production diff
        shell: bash
        run: |
          rm .github/workflows/apply-source-receipt-review-fixes-r3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_review_round3.py \
            .github/workflows/apply-source-receipt-review-fixes-r3.yml
          git commit -m "fix: rebuild Source Ledger state from receipt identities"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "tests/test_periodic_source_receipt_review_round3.py tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git push origin HEAD:fix/source-receipt-ledger-integrity-r2-20260902
