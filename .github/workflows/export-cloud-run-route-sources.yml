name: Apply Cloud Run Capability Patches

on:
  push:
    branches:
      - agent/implement-cloud-run-game-backend-capability

permissions:
  contents: write

jobs:
  apply-patches:
    if: "${{ github.event.head_commit.message == 'chore: apply Cloud Run route and hardening patches v3' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          show-progress: false
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Route capability through existing owners
        run: |
          python tools/apply_cloud_run_capability_patch.py route
          python -m unittest tests.test_cloud_run_game_backend_capability -v
          git add \
            docs/knowledge/game-development/README.md \
            docs/knowledge/game-development/TECHNICAL_PRODUCTION_AND_RELEASE_GUIDE.md \
            docs/DOCUMENTATION_MAP.md \
            START_HERE.md \
            skills/analyzing-and-refining-game-concepts/SKILL.md \
            skills/managing-game-project-operating-system/SKILL.md \
            skills/designing-vertical-slices/SKILL.md \
            skills/reviewing-and-validating-project-changes/SKILL.md \
            skills/optimizing-ai-model-and-prompt-costs/SKILL.md \
            templates/research/GAME_DEVELOPMENT_EVIDENCE_PACK.md \
            templates/project-operations/github/documentation-governance.json
          git commit -m "docs: route Cloud Run backend capability through existing owners"
      - name: Add adversarial fixtures and propagation guards
        run: |
          python tools/apply_cloud_run_capability_patch.py harden
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_base_v9_5_skill_operating_refinement.py")
          text = path.read_text(encoding="utf-8")
          method_name = "test_cloud_run_capability_routes_through_existing_owners_without_registry_change"
          if method_name not in text:
              method = '''
              def test_cloud_run_capability_routes_through_existing_owners_without_registry_change(self) -> None:
                  guide_path = (
                      "docs/knowledge/game-development/"
                      "GAME_BACKEND_CLOUD_RUN_AND_ONLINE_SERVICES_GUIDE.md"
                  )
                  expectations = {
                      "skills/analyzing-and-refining-game-concepts/SKILL.md": "SERVER_FEATURE_DETECTED",
                      "skills/managing-game-project-operating-system/SKILL.md": "PROJECT_OWNED_SERVICE_CONTRACT",
                      "skills/designing-vertical-slices/SKILL.md": "RUNTIME_VERIFIED",
                      "skills/reviewing-and-validating-project-changes/SKILL.md": "LOAD_AND_FAILURE_VERIFIED",
                      "skills/optimizing-ai-model-and-prompt-costs/SKILL.md": "bounded AI proxy",
                  }
                  for skill_path, token in expectations.items():
                      skill = read(skill_path)
                      self.assertIn(guide_path, skill, skill_path)
                      self.assertIn(token, skill, skill_path)
                  registry = REGISTRY.read_text(encoding="utf-8")
                  self.assertNotIn("GAME_BACKEND_CLOUD_RUN_AND_ONLINE_SERVICES_GUIDE.md", registry)
                  self.assertNotIn("GAME_BACKEND_SERVICE_CONTRACT.md", registry)
          '''
              marker = '\n\nif __name__ == "__main__":'
              if marker not in text:
                  raise RuntimeError("v9.5 test footer marker not found")
              path.write_text(text.replace(marker, "\n" + method.rstrip() + marker), encoding="utf-8")
          PY
          git add \
            docs/knowledge/game-development/GAME_BACKEND_CLOUD_RUN_AND_ONLINE_SERVICES_GUIDE.md \
            tests/test_cloud_run_game_backend_capability.py \
            tests/test_base_v9_5_skill_operating_refinement.py \
            .github/reference-freshness.json \
            skills/managing-game-project-operating-system/LEARNING_LOG.md \
            docs/CHANGELOG.md
          git commit -m "test: harden Cloud Run backend capability boundaries"
          python -m unittest \
            tests.test_cloud_run_game_backend_capability \
            tests.test_base_v9_5_skill_operating_refinement -v
          python tools/check_canonical_reference_freshness.py --base origin/main --head HEAD
      - name: Push generated commits
        run: git push origin HEAD:agent/implement-cloud-run-game-backend-capability
