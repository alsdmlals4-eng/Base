name: Apply PR 836 independent review fixes

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r3-20260902
    paths:
      - .github/workflows/apply-pr836-independent-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r3-20260902
          fetch-depth: 0

      - name: Apply independent-review corrections
        run: python .tmp/apply_pr836_review_fixes.py

      - name: Prove focused and adjacent Source suites GREEN
        shell: bash
        run: |
          python -m py_compile \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tools/periodic_source_operations_state.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_review_round3.py \
            tests/test_periodic_source_receipt_review_round4.py \
            tests/test_periodic_source_receipt_review_round5.py
          python -m unittest \
            tests.test_periodic_source_receipt_state \
            tests.test_record_periodic_source_scan \
            tests.test_periodic_source_receipt_review_round3 \
            tests.test_periodic_source_receipt_review_round4 \
            tests.test_periodic_source_receipt_review_round5 \
            tests.test_periodic_source_analysis_auto_merge \
            tests.test_periodic_source_analysis_runner \
            -v
          git diff --check

      - name: Remove one-shot files and commit exact production diff
        shell: bash
        run: |
          rm .tmp/apply_pr836_review_fixes.py
          rm .github/workflows/apply-pr836-independent-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tools/periodic_source_operations_state.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_review_round3.py \
            tests/test_periodic_source_receipt_review_round4.py \
            tests/test_periodic_source_receipt_review_round5.py
          git add -u -- \
            .tmp/apply_pr836_review_fixes.py \
            .github/workflows/apply-pr836-independent-review-fixes.yml
          git commit -m "fix: close Source receipt review findings"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "tests/test_periodic_source_receipt_review_round3.py tests/test_periodic_source_receipt_review_round4.py tests/test_periodic_source_receipt_review_round5.py tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_operations_state.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git push origin HEAD:fix/source-receipt-ledger-integrity-r3-20260902

# Retry after strengthening message-insensitive regression assertions.
