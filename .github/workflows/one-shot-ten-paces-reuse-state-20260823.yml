name: One-shot Ten Paces Reuse State Refresh

on:
  push:
    branches:
      - fix/ten-paces-reuse-state-20260823
    paths:
      - .github/workflows/one-shot-ten-paces-reuse-state-20260823.yml

permissions:
  contents: write

jobs:
  red-green-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Confirm RED before production-state patch
        shell: bash
        run: |
          set -euo pipefail
          if python -m unittest tests.test_active_project_fleet_state_freshness.ActiveProjectFleetStateFreshnessTests.test_ten_paces_historical_churn_is_not_current_reuse_blocker -v; then
            echo 'Expected RED but test passed before state patch.' >&2
            exit 1
          else
            echo 'RED confirmed: stale Ten Paces churn blocker is still present.'
          fi

      - name: Apply fail-closed bounded patch
        run: python tools/one_shot_refresh_ten_paces_reuse_state_20260823.py

      - name: Verify GREEN focused and full fleet freshness contracts
        run: |
          python -m unittest tests.test_active_project_fleet_state_freshness.ActiveProjectFleetStateFreshnessTests.test_ten_paces_historical_churn_is_not_current_reuse_blocker -v
          python -m unittest tests.test_active_project_fleet_state_freshness -v

      - name: Validate JSON and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool docs/knowledge/game-development/reuse/adoption/ACTIVE_PROJECT_ADOPTION_MATRIX.json >/dev/null
          python -m json.tool docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json >/dev/null
          git diff --check
          git diff -- docs/knowledge/game-development/reuse/adoption/ACTIVE_PROJECT_ADOPTION_MATRIX.json docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json tests/test_active_project_fleet_state_freshness.py

      - name: Remove one-shot helpers and commit GREEN state
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/one_shot_refresh_ten_paces_reuse_state_20260823.py
          rm -f .github/workflows/one-shot-ten-paces-reuse-state-20260823.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/knowledge/game-development/reuse/adoption/ACTIVE_PROJECT_ADOPTION_MATRIX.json docs/knowledge/game-development/reuse/adoption/PROJECT_WORK_REUSE_HANDOFF.json tests/test_active_project_fleet_state_freshness.py tools/one_shot_refresh_ten_paces_reuse_state_20260823.py .github/workflows/one-shot-ten-paces-reuse-state-20260823.yml
          git diff --cached --check
          git commit -m 'fix: refresh Ten Paces reuse state'
          git push origin "HEAD:${GITHUB_REF_NAME}"
