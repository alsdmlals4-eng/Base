name: Add Repository Audit Companion Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - tools/_tmp_add_repository_audit_companion_test.py
      - .github/workflows/_tmp_add_repository_audit_companion_test.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/integrated-vertical-slice-prompt-v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrated-vertical-slice-prompt-v7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/_tmp_add_repository_audit_companion_test.py
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_consolidated_skill_references.py
          git diff --cached --check
          git commit -m "test: cover repository-wide audit skill integration"
          git push origin HEAD:agent/integrated-vertical-slice-prompt-v7
