name: Resolve PR 66 Merge Push

on:
  push:
    branches:
      - feat/game-design-difficulty-workflow

permissions:
  contents: write
  statuses: write

jobs:
  resolve-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: feat/game-design-difficulty-workflow
          fetch-depth: 0
          show-progress: false

      - name: Build resolved merge commit object
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -o pipefail
          python tools/resolve_pr66_merge.py | tee resolver-results.txt
          resolved_sha="$(sed -n 's/^RESOLVED_COMMIT_SHA=//p' resolver-results.txt | tail -n 1)"
          test -n "$resolved_sha"
          gh api "repos/$GH_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=pr66-merge-resolver \
            -f description="$resolved_sha"
