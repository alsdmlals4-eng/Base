name: Resolve PR 66 Merge Push

on:
  push:
    branches:
      - feat/game-design-difficulty-workflow

permissions:
  contents: write

jobs:
  resolve-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: feat/game-design-difficulty-workflow
          fetch-depth: 0
          show-progress: false

      - name: Build and apply resolved merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -o pipefail
          sed -i '/TEMP_PATHS = {/a\    ".github/workflows/resolve-pr66-merge-push.yml",' tools/resolve_pr66_merge.py
          python tools/resolve_pr66_merge.py | tee resolver-results.txt
          resolved_sha="$(sed -n 's/^RESOLVED_COMMIT_SHA=//p' resolver-results.txt | tail -n 1)"
          test -n "$resolved_sha"
          gh api --method PATCH \
            "repos/$GH_REPOSITORY/git/refs/heads/feat/game-design-difficulty-workflow" \
            -f sha="$resolved_sha" \
            -F force=false
