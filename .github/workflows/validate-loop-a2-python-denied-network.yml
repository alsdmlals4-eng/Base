name: Validate Loop A2 Python DENIED Network

on:
  pull_request:
    paths:
      - 'tools/loop_a2_runtime/python_denied_network.py'
      - 'tools/loop_a2_runtime/python_denied_network_launcher.py'
      - 'tests/test_loop_a2_python_denied_network.py'
      - '.github/workflows/validate-loop-a2-python-denied-network.yml'
      - 'docs/evidence/2026-08-14-loop-a2-python-denied-network.md'
  push:
    branches: [main]
    paths:
      - 'tools/loop_a2_runtime/python_denied_network.py'
      - 'tools/loop_a2_runtime/python_denied_network_launcher.py'
      - 'tests/test_loop_a2_python_denied_network.py'
      - '.github/workflows/validate-loop-a2-python-denied-network.yml'
      - 'docs/evidence/2026-08-14-loop-a2-python-denied-network.md'

permissions:
  contents: read

jobs:
  denied-network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.12'
      - name: Run Python DENIED network contracts
        run: python -m unittest tests.test_loop_a2_python_denied_network -v
      - name: Validate whitespace
        run: git diff --check
