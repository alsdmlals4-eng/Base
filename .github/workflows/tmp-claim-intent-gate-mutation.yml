name: Temporary Claim and Intent Gate Mutation

on:
  push:
    branches:
      - feat/claim-intent-verification-gate-final
    paths:
      - ".github/workflows/tmp-claim-intent-gate-mutation.yml"

permissions:
  contents: write

concurrency:
  group: temporary-claim-intent-gate-mutation
  cancel-in-progress: false

jobs:
  mutate:
    if: github.actor == 'alsdmlals4-eng'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/claim-intent-verification-gate-final
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply approved production contract
        run: python tools/tmp_apply_claim_intent_gate.py

      - name: Regenerate Base v9 derivatives
        run: python tools/build_base_v9_artifacts.py

      - name: Verify focused claim and intent contract
        run: python -m unittest tests/test_claim_and_intent_verification_contract.py -v

      - name: Verify behavior evaluation contracts
        run: python tools/check_skill_behavior_evals.py

      - name: Verify whitespace
        run: git diff --check

      - name: Remove temporary mutation machinery
        run: |
          rm .github/workflows/tmp-claim-intent-gate-mutation.yml
          rm tools/tmp_apply_claim_intent_gate.py
          git diff --check

      - name: Commit production change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production changes were produced."
            exit 1
          fi
          git commit -m "feat: enforce claim and intent verification gate"
          git push origin HEAD:feat/claim-intent-verification-gate-final
