name: Mark prompt approval PR ready

on:
  push:
    branches:
      - work/prompt-approval-gate-20260903
    paths:
      - .github/workflows/mark-pr-844-ready.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 844 --repo alsdmlals4-eng/Base
      - name: Remove one-shot workflow and push
        run: |
          rm .github/workflows/mark-pr-844-ready.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mark-pr-844-ready.yml
          git commit -m "chore: remove one-shot ready workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
