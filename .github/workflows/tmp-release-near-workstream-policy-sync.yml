name: Temporary release-near workstream policy sync

on:
  push:
    branches:
      - feat/release-near-vertical-slice-first-v2-20260820

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-near-workstream-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-near-vertical-slice-first-v2-20260820
          fetch-depth: 0
      - name: Align long-horizon workstream policy with current coordinator authority
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing: {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md",
              "INDEPENDENT_WORKSTREAM_ISOLATION\nOTHER_CHAT_BRANCH_PATH_PR: DO_NOT_TOUCH_BY_DEFAULT\nEXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_EXCEPTION",
              "INDEPENDENT_WORKSTREAM_ISOLATION\nOPEN_PR_IS_NOT_ACTIVE_WORKSTREAM\nACTIVE_INDEPENDENT_WORKSTREAMS_REMAIN_PROTECTED_WHEN_ACTUALLY_ACTIVE\nCURRENT_OWNER_EVIDENCE_REQUIRED\nCURRENT_COORDINATOR_TAKEOVER_WHEN_NO_ACTIVE_OWNER\nEXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_ACTIVE_OTHER_WORKER_EXCEPTION",
          )
          replace_once(
              "docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md",
              "### `INDEPENDENT_WORKSTREAM_ISOLATION`\n\n`OTHER_CHAT_BRANCH_PATH_PR: DO_NOT_TOUCH_BY_DEFAULT`\n\n`EXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_EXCEPTION`\n\n다른 채팅·Branch·PR이 같은 Goal처럼 보여도 기본적으로 별도 workstream으로 취급한다. read-only 충돌 탐지는 가능하지만 checkout/write/rebase/close/merge/material-delta 흡수는 사용자 명시 승인 없이는 수행하지 않는다.",
              "### `INDEPENDENT_WORKSTREAM_ISOLATION`\n\n`OPEN_PR_IS_NOT_ACTIVE_WORKSTREAM`\n\n`ACTIVE_INDEPENDENT_WORKSTREAMS_REMAIN_PROTECTED_WHEN_ACTUALLY_ACTIVE`\n\n`CURRENT_OWNER_EVIDENCE_REQUIRED`\n\n`CURRENT_COORDINATOR_TAKEOVER_WHEN_NO_ACTIVE_OWNER`\n\n`EXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_ACTIVE_OTHER_WORKER_EXCEPTION`\n\nPart 경계, open PR 상태, 실제 동시 작업자는 서로 다른 개념이다. `open / draft / ready` PR·branch가 존재한다는 사실만으로 다른 작업자가 현재 활동 중이라고 판정하지 않는다. 사용자 지시, current session/automation owner, Resource Lock, matching running execution 같은 **current owner evidence**가 있을 때만 `ACTIVE_OTHER_WORKER`로 mutation-protected다.\n\n사용자가 `CURRENT_COORDINATOR_CHAT` 하나만 활성이라고 확인했거나 현재 owner evidence가 없으면 unresolved open PR은 latest completed `main`과 Goal을 다시 읽어 `COORDINATOR_TAKEOVER / READY_TO_FINISH / SUPERSEDED_DUPLICATE / STALE_BACKLOG / BLOCKED_EXTERNAL`로 분류한다. coordinator가 인수한 workstream은 현재 승인 범위 안에서 수정·검증·병합·중복 종료까지 마무리할 수 있다. 실제 `ACTIVE_OTHER_WORKER`를 흡수하려면 명시적 사용자 takeover/owner handoff가 필요하다.",
          )
          replace_once(
              "tests/test_base_long_horizon_work_contract.py",
              "    def test_independent_workstreams_are_isolated_unless_user_explicitly_authorizes_absorption(self) -> None:\n        policy = read(\"docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md\")\n        for term in (\n            \"INDEPENDENT_WORKSTREAM_ISOLATION\",\n            \"OTHER_CHAT_BRANCH_PATH_PR: DO_NOT_TOUCH_BY_DEFAULT\",\n            \"EXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_EXCEPTION\",\n        ):\n            self.assertIn(term, policy)\n",
              "    def test_open_pr_state_is_not_active_worker_evidence(self) -> None:\n        policy = read(\"docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md\")\n        for term in (\n            \"INDEPENDENT_WORKSTREAM_ISOLATION\",\n            \"OPEN_PR_IS_NOT_ACTIVE_WORKSTREAM\",\n            \"ACTIVE_INDEPENDENT_WORKSTREAMS_REMAIN_PROTECTED_WHEN_ACTUALLY_ACTIVE\",\n            \"CURRENT_OWNER_EVIDENCE_REQUIRED\",\n            \"CURRENT_COORDINATOR_TAKEOVER_WHEN_NO_ACTIVE_OWNER\",\n            \"EXPLICIT_USER_ABSORPTION_AUTHORIZATION: REQUIRED_FOR_ACTIVE_OTHER_WORKER_EXCEPTION\",\n            \"ACTIVE_OTHER_WORKER\",\n            \"COORDINATOR_TAKEOVER\",\n            \"SUPERSEDED_DUPLICATE\",\n            \"STALE_BACKLOG\",\n            \"BLOCKED_EXTERNAL\",\n            \"READY_TO_FINISH\",\n        ):\n            self.assertIn(term, policy)\n        self.assertNotIn(\"OTHER_CHAT_BRANCH_PATH_PR: DO_NOT_TOUCH_BY_DEFAULT\", policy)\n",
          )
      - name: Verify focused policy contracts
        run: |
          python -m unittest \
            tests.test_base_long_horizon_work_contract \
            tests.test_vertical_slice_v6_contract \
            -v
      - name: Commit bounded sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LONG_HORIZON_WORK_EXECUTION_POLICY.md tests/test_base_long_horizon_work_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: align long-horizon workstream ownership with current coordinator [release-near-workstream-sync]"
          git push origin HEAD:feat/release-near-vertical-slice-first-v2-20260820
