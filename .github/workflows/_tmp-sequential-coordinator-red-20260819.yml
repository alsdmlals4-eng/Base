name: Temporary sequential coordinator GREEN migration

on:
  push:
    branches:
      - refactor/sequential-part-coordinator-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tmp-sequential-coordinator-green-20260819
  cancel-in-progress: true

jobs:
  green-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sequential-part-coordinator-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/_tmp_apply_sequential_coordinator_migration_20260819.py
      - name: Run GREEN contracts
        run: |
          python -m py_compile \
            tools/check_base_partition_scope.py \
            tools/check_canonical_reference_freshness.py \
            tests/test_base_partition_contract.py \
            tests/test_sequential_part_coordinator_contract.py \
            tests/test_full_adversarial_loop_semantics.py \
            tests/test_human_home_self_contained_contract.py \
            tests/test_reference_freshness.py
          python tools/check_base_partition_scope.py --validate-manifest
          python -m unittest \
            tests.test_base_partition_contract \
            tests.test_sequential_part_coordinator_contract \
            tests.test_full_adversarial_loop_semantics \
            tests.test_human_home_self_contained_contract \
            tests.test_reference_freshness -v
      - name: Commit durable non-workflow changes
        shell: bash
        run: |
          git checkout -- .github/workflows/base-partition-contract.yml
          git checkout -- .github/workflows/_tmp-sequential-coordinator-red-20260819.yml
          git checkout -- .github/workflows/_tmp-apply-sequential-coordinator-migration-20260819.yml
          git rm tools/_tmp_apply_sequential_coordinator_migration_20260819.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: implement sequential Part coordinator contracts"
          git pull --rebase origin refactor/sequential-part-coordinator-20260819
          git push origin HEAD:refactor/sequential-part-coordinator-20260819
