name: Temporary sequential coordinator RED

on:
  push:
    branches:
      - refactor/sequential-part-coordinator-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run new sequential coordinator contracts
        run: |
          python -m unittest \
            tests.test_sequential_part_coordinator_contract \
            tests.test_full_adversarial_loop_semantics \
            tests.test_human_home_self_contained_contract -v
