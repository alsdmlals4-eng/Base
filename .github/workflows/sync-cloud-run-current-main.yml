name: Sync Cloud Run Branch With Current Main

on:
  push:
    branches:
      - agent/implement-cloud-run-game-backend-capability

permissions:
  contents: write

jobs:
  merge-current-main:
    if: "${{ github.event.head_commit.message == 'chore: sync Cloud Run branch with current main' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          show-progress: false
      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge exact current main
        run: |
          git fetch origin main
          git merge --no-ff origin/main -m "Merge current main into Cloud Run backend capability"
      - name: Push merge
        run: git push origin HEAD:agent/implement-cloud-run-game-backend-capability
