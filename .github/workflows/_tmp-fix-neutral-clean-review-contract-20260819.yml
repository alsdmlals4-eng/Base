name: Temporary neutral clean-review reconciliation

on:
  push:
    branches:
      - feat/gpt-first-optional-codex-workflow-20260819
    paths:
      - tools/_tmp_fix_neutral_clean_review_contract_20260819.py
      - .github/workflows/_tmp-fix-neutral-clean-review-contract-20260819.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/_tmp_fix_neutral_clean_review_contract_20260819.py
      - .github/workflows/_tmp-fix-neutral-clean-review-contract-20260819.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpt-first-optional-codex-workflow-20260819
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python tools/_tmp_fix_neutral_clean_review_contract_20260819.py
      - run: |
          python -m unittest tests.test_neutral_adversarial_feature_lifecycle -v
          python -m unittest tests.test_base_long_horizon_work_contract -v
          python -m unittest tests.test_bca_visual_sheet_workflow -v
          python -m unittest tests.test_gpt_codex_workflow_contract -v
      - shell: bash
        run: |
          rm -f .github/workflows/_tmp-fix-neutral-clean-review-contract-20260819.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: align neutral adversarial lifecycle with clean exit"
          git push origin HEAD:feat/gpt-first-optional-codex-workflow-20260819
