name: Temporary AI solution-layer TDD candidate

on:
  push:
    branches:
      - work/video-ai-terms-absorption-20260901

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run RED-GREEN and negative controls
        shell: bash
        run: python .github/workflows-support/temp_ai_solution_layer_runner_v2.py

      - name: Upload bounded candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-solution-layer-contract-candidate
          path: |
            candidate/
            tests-evidence/
          if-no-files-found: error
          retention-days: 1
