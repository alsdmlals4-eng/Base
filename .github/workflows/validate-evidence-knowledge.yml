name: Validate Evidence-Based Game Development Knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - "START_HERE.md"
      - "docs/knowledge/game-development/**"
      - "docs/knowledge/methods/NARRATIVE_AND_RELATIONSHIP_METHOD.md"
      - "docs/knowledge/research/PROMPT_RECIPE_SOURCE_AUDIT.md"
      - "docs/AI_SKILL_ADOPTION_GUIDE.md"
      - "docs/superpowers/plans/*human-validation-artifact-governance*.md"
      - "docs/superpowers/plans/*synthetic-tester*.md"
      - "docs/superpowers/plans/*prompt-recipe-reference-integration*.md"
      - "docs/superpowers/plans/*periodic-external-source-watchlist*.md"
      - "docs/superpowers/plans/*periodic-source-scan-queue*.md"
      - "docs/superpowers/plans/*daily-source-analysis-auto-merge*.md"
      - "docs/superpowers/plans/*github-solo-gamedev-source-seeds*.md"
      - "docs/superpowers/specs/*prompt-recipe-reference-integration*.md"
      - "docs/superpowers/specs/*periodic-external-source-watchlist*.md"
      - "docs/superpowers/specs/*periodic-source-scan-queue*.md"
      - "docs/superpowers/specs/*daily-source-analysis-auto-merge*.md"
      - "docs/superpowers/specs/*github-solo-gamedev-source-seeds*.md"
      - "docs/superpowers/specs/*public-video-research-and-creative-provider-adapters*.md"
      - "docs/superpowers/plans/*public-video-research-and-creative-provider-adapters*.md"
      - "skills/analyzing-and-refining-game-concepts/SKILL.md"
      - "skills/analyzing-and-refining-game-concepts/references/game-system-difficulty-*.md"
      - "skills/governing-game-user-research-coverage/references/**"
      - "skills/producing-game-development-youtube-videos/**"
      - "skills/SKILL_REGISTRY.json"
      - "templates/game-development-youtube/EPISODE_PACKET.md"
      - "templates/research/**"
      - "templates/planning/ART_DIRECTION_BRIEF.md"
      - "templates/planning/ART_TECHNIQUE_CARD.md"
      - "templates/planning/GAME_BENCHMARK_PLAYER_EVIDENCE.md"
      - "templates/planning/GAME_SYSTEM_DIFFICULTY_AND_COMBAT_AI_CONTRACT.md"
      - "templates/planning/NARRATIVE_CONTENT_PLAN.md"
      - "templates/planning/PC_ANDROID_DELIVERY_PROFILE.md"
      - "tools/periodic_source_scan_queue.py"
      - "tools/periodic_source_analysis.py"
      - "tools/periodic_source_analysis_*.py"
      - "tools/periodic_source_candidate_state.py"
      - "tools/periodic_source_operations_state.py"
      - "tools/public_video_research_ingest.py"
      - "tools/run_periodic_source_scan_queue.sh"
      - "README.md"
      - "docs/DOCUMENTATION_MAP.md"
      - "docs/PLANNING_SEQUENCE_AND_EVIDENCE_POLICY.md"
      - "docs/CHANGELOG.md"
      - "skills/SKILL_LEARNING_LOG.md"
      - "tests/test_game_design_difficulty_workflow.py"
      - "tests/test_game_development_youtube_skill.py"
      - "tests/test_evidence_based_game_development_knowledge.py"
      - "tests/test_evidence_knowledge_workflow_contract.py"
      - "tests/test_human_validation_artifact_governance.py"
      - "tests/test_synthetic_tester_simulation_governance.py"
      - "tests/test_prompt_recipe_reference_contract.py"
      - "tests/test_pc_android_cross_platform_delivery.py"
      - "tests/test_visual_requirement_gate.py"
      - "tests/test_pixel_art_style_system.py"
      - "tests/test_periodic_external_source_watchlist.py"
      - "tests/test_periodic_external_source_discovery_seeds.py"
      - "tests/test_periodic_source_scan_queue.py"
      - "tests/test_periodic_source_analysis_auto_merge.py"
      - "tests/test_periodic_source_analysis_runner.py"
      - "tests/test_weekly_work_improvement_review.py"
      - "tests/test_public_video_research_ingest.py"
      - "tests/test_public_video_research_integration_contract.py"
      - ".github/workflows/periodic-source-scan-queue.yml"
      - ".github/workflows/validate-evidence-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-knowledge-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run evidence knowledge contracts
        shell: bash
        run: |
          set +e
          {
            python -m py_compile \
              tools/periodic_source_scan_queue.py \
              tools/periodic_source_analysis_contract.py \
              tools/periodic_source_analysis_render.py \
              tools/periodic_source_candidate_state.py \
              tools/periodic_source_operations_state.py \
              tools/periodic_source_analysis.py \
              tools/public_video_research_ingest.py \
              tests/test_game_design_difficulty_workflow.py \
              tests/test_game_development_youtube_skill.py \
              tests/test_evidence_based_game_development_knowledge.py \
              tests/test_evidence_knowledge_workflow_contract.py \
              tests/test_human_validation_artifact_governance.py \
              tests/test_synthetic_tester_simulation_governance.py \
              tests/test_prompt_recipe_reference_contract.py \
              tests/test_pc_android_cross_platform_delivery.py \
              tests/test_visual_requirement_gate.py \
              tests/test_pixel_art_style_system.py \
              tests/test_periodic_external_source_watchlist.py \
              tests/test_periodic_external_source_discovery_seeds.py \
              tests/test_periodic_source_scan_queue.py \
              tests/test_periodic_source_analysis_auto_merge.py \
              tests/test_periodic_source_analysis_runner.py \
              tests/test_weekly_work_improvement_review.py \
              tests/test_public_video_research_ingest.py \
              tests/test_public_video_research_integration_contract.py
            bash -n tools/run_periodic_source_scan_queue.sh
            python -m unittest \
              tests/test_game_design_difficulty_workflow.py \
              tests/test_game_development_youtube_skill.py \
              tests/test_evidence_based_game_development_knowledge.py \
              tests/test_evidence_knowledge_workflow_contract.py \
              tests/test_human_validation_artifact_governance.py \
              tests/test_synthetic_tester_simulation_governance.py \
              tests/test_prompt_recipe_reference_contract.py \
              tests/test_pc_android_cross_platform_delivery.py \
              tests/test_visual_requirement_gate.py \
              tests/test_pixel_art_style_system.py \
              tests/test_periodic_external_source_watchlist.py \
              tests/test_periodic_external_source_discovery_seeds.py \
              tests/test_periodic_source_scan_queue.py \
              tests/test_periodic_source_analysis_auto_merge.py \
              tests/test_periodic_source_analysis_runner.py \
              tests/test_weekly_work_improvement_review.py \
              tests/test_public_video_research_ingest.py \
              tests/test_public_video_research_integration_contract.py \
              -v
          } > evidence-knowledge-results.txt 2>&1
          status=$?
          cat evidence-knowledge-results.txt
          exit "$status"

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-knowledge-validation
          path: |
            evidence-knowledge-results.txt
            .github/workflows/periodic-source-scan-queue.yml
            docs/knowledge/game-development/NARRATIVE_WORLD_CHARACTER_SOURCE_RADAR.md
            docs/knowledge/game-development/PC_ANDROID_CROSS_PLATFORM_DELIVERY_GUIDE.md
            docs/knowledge/game-development/PERIODIC_EXTERNAL_SOURCE_WATCHLIST.md
            docs/knowledge/game-development/PERIODIC_EXTERNAL_SOURCE_DISCOVERY_SEEDS.md
            docs/knowledge/game-development/PERIODIC_SOURCE_OPERATIONS_LEDGER.json
            docs/knowledge/game-development/PERIODIC_SOURCE_CANDIDATE_LEDGER.json
            docs/knowledge/game-development/PERIODIC_SOURCE_SCAN_QUEUE.md
            docs/knowledge/game-development/RECENT_EXTERNAL_EVIDENCE_REVIEW_2026-08-10.md
            docs/knowledge/game-development/SOURCE_SCAN_CHECKPOINT_2026-08-14.md
            docs/knowledge/game-development/TUTORIAL_AND_ONBOARDING_DESIGN_GUIDE.md
            docs/knowledge/game-development/PIXEL_ART_STYLE_SYSTEM.md
            docs/knowledge/game-development/PIXEL_ART_VISUAL_REFERENCE_GALLERY.md
            docs/knowledge/game-development/source-scans/README.md
            docs/knowledge/game-development/reuse/PRODUCTION_TOOL_WORKFLOW_MODULES.md
            docs/knowledge/game-development/reuse/REUSABLE_MODULE_REGISTRY.md
            docs/knowledge/game-development/reuse/VISUAL_ASSET_MATERIAL_MODULES.md
            docs/knowledge/research/PROMPT_RECIPE_SOURCE_AUDIT.md
            docs/superpowers/plans/2026-07-29-prompt-recipe-reference-integration.md
            docs/superpowers/plans/2026-08-14-periodic-source-scan-queue.md
            docs/superpowers/plans/2026-08-14-daily-source-analysis-auto-merge.md
            docs/superpowers/plans/2026-08-22-public-video-research-and-creative-provider-adapters.md
            docs/superpowers/specs/2026-07-29-prompt-recipe-reference-integration-design.md
            docs/superpowers/specs/2026-08-14-periodic-source-scan-queue-design.md
            docs/superpowers/specs/2026-08-14-daily-source-analysis-auto-merge-design.md
            docs/superpowers/specs/2026-08-22-public-video-research-and-creative-provider-adapters-design.md
            skills/producing-game-development-youtube-videos/LEARNING_LOG.md
            templates/game-development-youtube/EPISODE_PACKET.md
            templates/planning/ART_DIRECTION_BRIEF.md
            templates/planning/ART_TECHNIQUE_CARD.md
            templates/planning/PC_ANDROID_DELIVERY_PROFILE.md
            templates/research/AI_IMAGE_PROMPT_RECIPE_CARD.md
            templates/research/PROJECT_REUSE_OPPORTUNITY_SCAN.md
            tools/periodic_source_scan_queue.py
            tools/periodic_source_analysis_contract.py
            tools/periodic_source_analysis_render.py
            tools/periodic_source_candidate_state.py
            tools/periodic_source_operations_state.py
            tools/periodic_source_analysis.py
            tools/public_video_research_ingest.py
            tools/run_periodic_source_scan_queue.sh
            tests/test_game_design_difficulty_workflow.py
            tests/test_game_development_youtube_skill.py
            tests/test_evidence_based_game_development_knowledge.py
            tests/test_evidence_knowledge_workflow_contract.py
            tests/test_human_validation_artifact_governance.py
            tests/test_synthetic_tester_simulation_governance.py
            tests/test_prompt_recipe_reference_contract.py
            tests/test_pc_android_cross_platform_delivery.py
            tests/test_visual_requirement_gate.py
            tests/test_pixel_art_style_system.py
            tests/test_periodic_external_source_watchlist.py
            tests/test_periodic_external_source_discovery_seeds.py
            tests/test_periodic_source_scan_queue.py
            tests/test_periodic_source_analysis_auto_merge.py
            tests/test_periodic_source_analysis_runner.py
            tests/test_weekly_work_improvement_review.py
            tests/test_public_video_research_ingest.py
            tests/test_public_video_research_integration_contract.py
          if-no-files-found: error
