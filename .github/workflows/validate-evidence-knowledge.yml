name: Validate Evidence-Based Game Development Knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/knowledge/game-development/**"
      - "templates/research/**"
      - "docs/PROCESS_IMPROVEMENT_LOOP.md"
      - "docs/PERIODIC_EXTERNAL_SOURCE_WATCHLIST.md"
      - "templates/review/WEEKLY_WORK_IMPROVEMENT_REVIEW.md"
      - "skills/analyzing-and-refining-game-concepts/**"
      - "skills/designing-vertical-slices/**"
      - "skills/developing-and-revising-serial-fiction/**"
      - "skills/managing-project-intake-and-work-contract/**"
      - "skills/managing-game-project-operating-system/**"
      - "skills/designing-art-prompts-and-technique-cards/**"
      - "skills/auditing-and-refining-ui-art/**"
      - "skills/reviewing-and-validating-project-changes/**"
      - "tests/test_evidence_based_game_development_knowledge.py"
      - "tests/test_periodic_external_source_watchlist.py"
      - "tests/test_weekly_work_improvement_review.py"
      - "tests/test_evidence_policy_execution.py"
      - ".github/workflows/validate-evidence-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            tests/test_evidence_based_game_development_knowledge.py \
            tests/test_periodic_external_source_watchlist.py \
            tests/test_weekly_work_improvement_review.py \
            tests/test_evidence_policy_execution.py

      - name: Run knowledge structure and evidence contract tests
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_evidence_based_game_development_knowledge \
            tests.test_periodic_external_source_watchlist \
            tests.test_weekly_work_improvement_review \
            tests.test_evidence_policy_execution \
            -v 2>&1 | tee evidence-knowledge-test-results.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload evidence diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-knowledge-diagnostics
          path: evidence-knowledge-test-results.txt
          if-no-files-found: warn
          retention-days: 1
