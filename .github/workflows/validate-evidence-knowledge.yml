name: Validate Evidence-Based Game Development Knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - "START_HERE.md"
      - "docs/knowledge/game-development/**"
      - "docs/superpowers/plans/*human-validation-artifact-governance*.md"
      - "docs/superpowers/plans/*synthetic-tester*.md"
      - "skills/analyzing-and-refining-game-concepts/SKILL.md"
      - "skills/analyzing-and-refining-game-concepts/references/game-system-difficulty-*.md"
      - "skills/governing-game-user-research-coverage/references/**"
      - "skills/SKILL_REGISTRY.json"
      - "templates/research/**"
      - "templates/planning/GAME_BENCHMARK_PLAYER_EVIDENCE.md"
      - "templates/planning/GAME_SYSTEM_DIFFICULTY_AND_COMBAT_AI_CONTRACT.md"
      - "README.md"
      - "docs/DOCUMENTATION_MAP.md"
      - "docs/PLANNING_SEQUENCE_AND_EVIDENCE_POLICY.md"
      - "docs/CHANGELOG.md"
      - "skills/SKILL_LEARNING_LOG.md"
      - "tests/test_game_design_difficulty_workflow.py"
      - "tests/test_evidence_based_game_development_knowledge.py"
      - "tests/test_evidence_knowledge_workflow_contract.py"
      - "tests/test_human_validation_artifact_governance.py"
      - "tests/test_synthetic_tester_simulation_governance.py"
      - ".github/workflows/validate-evidence-knowledge.yml"
  push:
    branches:
      - feat/game-design-difficulty-workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-pr66-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/game-design-difficulty-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: feat/game-design-difficulty-workflow
          fetch-depth: 0
          show-progress: false

      - name: Build and apply resolved merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -o pipefail
          sed -i '/TEMP_PATHS = {/a\    ".github/workflows/resolve-pr66-merge-push.yml",\n    ".github/workflows/resolve-pr66-merge-push.yml",' tools/resolve_pr66_merge.py
          sed -i '/git("add", "-A")/i\    git("checkout", "7b246272f1d0c649d2c6d60456876cddaddbebb1", "--", ".github/workflows/validate-evidence-knowledge.yml")' tools/resolve_pr66_merge.py
          python tools/resolve_pr66_merge.py | tee resolver-results.txt
          resolved_sha="$(sed -n 's/^RESOLVED_COMMIT_SHA=//p' resolver-results.txt | tail -n 1)"
          test -n "$resolved_sha"
          gh api --method PATCH \
            "repos/$GH_REPOSITORY/git/refs/heads/feat/game-design-difficulty-workflow" \
            -f sha="$resolved_sha" \
            -F force=false

  evidence-knowledge-contract:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run evidence knowledge contracts
        shell: bash
        run: |
          set +e
          {
            python -m py_compile \
              tests/test_game_design_difficulty_workflow.py \
              tests/test_evidence_based_game_development_knowledge.py \
              tests/test_evidence_knowledge_workflow_contract.py \
              tests/test_human_validation_artifact_governance.py \
              tests/test_synthetic_tester_simulation_governance.py
            python -m unittest \
              tests/test_game_design_difficulty_workflow.py \
              tests/test_evidence_based_game_development_knowledge.py \
              tests/test_evidence_knowledge_workflow_contract.py \
              tests/test_human_validation_artifact_governance.py \
              tests/test_synthetic_tester_simulation_governance.py \
              -v
          } > evidence-knowledge-results.txt 2>&1
          status=$?
          cat evidence-knowledge-results.txt
          exit "$status"

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-knowledge-validation
          path: |
            evidence-knowledge-results.txt
            tests/test_game_design_difficulty_workflow.py
            tests/test_evidence_based_game_development_knowledge.py
            tests/test_evidence_knowledge_workflow_contract.py
            tests/test_human_validation_artifact_governance.py
            tests/test_synthetic_tester_simulation_governance.py
          if-no-files-found: error
