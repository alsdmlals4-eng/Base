name: Apply Archive Governance Base Rollout

on:
  push:
    branches:
      - gpt/legacy-retention-archive-skill-design-20260725

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply archive governance Base mutations') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/legacy-retention-archive-skill-design-20260725
          fetch-depth: 0

      - name: Apply structured mutations
        run: python tools/run_archive_governance_base_rollout.py

      - name: Commit structured mutations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/SKILL_REGISTRY.json \
            skills/SKILL_COVERAGE.json \
            tests/test_game_project_operating_system_structure.py \
            .github/workflows/validate-game-project-operating-system.yml \
            skills/managing-game-project-operating-system/SKILL.md \
            skills/pruning-stale-and-nonfunctional-material/SKILL.md \
            skills/SKILL_LEARNING_LOG.md
          git diff --cached --check
          git commit -m "chore: apply archive governance Base mutations"
          git push origin HEAD:gpt/legacy-retention-archive-skill-design-20260725
