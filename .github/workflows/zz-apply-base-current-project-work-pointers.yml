name: Apply Base-current project work pointers

on:
  push:
    branches:
      - fix/base-current-project-work-bootstrap-20260902

permissions:
  contents: write

concurrency:
  group: apply-base-current-project-work-pointers
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/base-current-project-work-bootstrap-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Base validation dependencies
        run: python -m pip install -r .github/validation-requirements.txt

      - name: Assert expected implementation lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d001af90eaeead9828956a35900b7984aa212e18 HEAD
          test "$(git diff --name-only d001af90eaeead9828956a35900b7984aa212e18...HEAD)" = ".github/workflows/zz-apply-base-current-project-work-pointers.yml"
          test -f tools/run_project_work_gate.py
          test -f docs/operations/BASE_CURRENT_PROJECT_WORK_BOOTSTRAP.md

      - name: Add minimal owner pointers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          workflow = Path(".github/workflows/zz-apply-base-current-project-work-pointers.yml")
          pointer = (
              "> `BASE_CURRENT_OPERATIONAL_BOOTSTRAP`: when current scope requires "
              "**Base-only maintenance** and future project sessions to fresh-read current "
              "Base without project-side preinstallation, read "
              "`docs/operations/BASE_CURRENT_PROJECT_WORK_BOOTSTRAP.md`. It is a "
              "nonpersistent PM/workflow overlay: target-project `AGENTS.md`, product canon, "
              "protected paths and adopted Base release retain authority. Do not copy the "
              "detailed playbook into this file."
          )
          targets = (
              "AGENTS.md",
              "START_HERE.md",
              "templates/custom-instructions.gpt.md",
              "docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md",
              "skills/managing-project-intake-and-work-contract/SKILL.md",
              "skills/managing-project-intake-and-work-contract/references/work-decomposition-and-sequencing.md",
              "templates/planning/EXECUTION_SEQUENCE_PLAN.md",
              "templates/project-operations/.agents/skills/base-project-router/SKILL.md",
              "templates/project-operations/AI_WORKFLOW.md",
              "templates/project-operations/PROJECT_START_HERE.md",
              "templates/project-operations/WORK_CODEX_MINIMUM_TRANSITION_STARTER_PROMPT.md",
              "templates/project-operations/WORK_PROJECT_EXECUTION_CURRENT_ROUTER.md",
              "templates/project-operations/WORK_PROJECT_START_CANON_CHECKLIST.md",
              "docs/DOCUMENTATION_MAP.md",
          )

          for relative in targets:
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f"missing active consumer: {relative}")
              raw = path.read_bytes()
              text = raw.decode("utf-8")
              if "BASE_CURRENT_OPERATIONAL_BOOTSTRAP" in text:
                  continue
              newline = "\r\n" if b"\r\n" in raw else "\n"
              lines = text.splitlines(keepends=True)
              heading = next(
                  (index for index, line in enumerate(lines) if line.lstrip().startswith("#")),
                  None,
              )
              if heading is None:
                  raise SystemExit(f"active consumer has no Markdown heading: {relative}")
              lines.insert(
                  heading + 1,
                  newline + pointer.replace("\n", newline) + newline + newline,
              )
              path.write_text("".join(lines), encoding="utf-8", newline="")

          (root / workflow).unlink()
          PY

      - name: Commit before exact-identity tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alsdmlals4-eng"
          git config user.email "alsdmlals4@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: route active project work entries to Base current"

      - name: Focused Base-current bootstrap tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_base_current_project_work_bootstrap -v

      - name: Full Base regression with bounded diagnostics
        id: full-regression
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > full-regression.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > full-regression.exit
          if [ "$code" -ne 0 ]; then
            echo '=== failure summary ==='
            grep -nE '^(FAIL:|ERROR:|FAILED \(|Ran [0-9]+ tests|Traceback|AssertionError)' full-regression.log | tail -n 200 || true
            echo '=== final 240 lines ==='
            tail -n 240 full-regression.log
          fi
          exit "$code"

      - name: Upload full-regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: base-current-bootstrap-full-regression-${{ github.sha }}
          path: |
            full-regression.log
            full-regression.exit
          if-no-files-found: error
          retention-days: 7

      - name: Verify final tree and push
        if: steps.full-regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/zz-apply-base-current-project-work-pointers.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check HEAD^ HEAD
          git push origin HEAD:fix/base-current-project-work-bootstrap-20260902
