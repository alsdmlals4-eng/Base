name: Restore Platform Review Regression Coverage

on:
  push:
    branches:
      - agent/implement-game-entitlement-integrity-drm-capability

permissions:
  contents: write

jobs:
  restore-coverage:
    if: "${{ github.event.head_commit.message == 'chore: restore platform review regression coverage' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          show-progress: false
      - name: Restore existing regression and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_platform_review_asset_rights_reference_production.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''        files = (\n            "skills/managing-game-project-operating-system/SKILL.md",\n            "skills/designing-art-prompts-and-technique-cards/SKILL.md",\n'''
          replacement = '''        files = (\n            "skills/managing-game-project-operating-system/SKILL.md",\n            "skills/evaluating-godot-assets-and-plugins-before-creation/SKILL.md",\n            "skills/designing-art-prompts-and-technique-cards/SKILL.md",\n'''
          if anchor not in text:
              raise RuntimeError("platform review regression anchor not found")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          rm .github/workflows/restore-platform-review-regression.yml
          git add -A
          git commit -m "test: preserve platform review skill route coverage"
          python -m unittest \
            tests.test_platform_review_asset_rights_reference_production \
            tests.test_game_entitlement_integrity_drm_capability -v
          git push origin HEAD:agent/implement-game-entitlement-integrity-drm-capability
