name: Fix Source Runner Invocation

on:
  push:
    branches:
      - final/daily-source-analysis-auto-merge-current-main
    paths:
      - ".github/workflows/tmp-fix-source-runner-invocation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed one-line fix
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_source_runner_invocation.py
          bash -n tools/run_periodic_source_scan_queue.sh
          grep -F 'python -m tools.periodic_source_analysis' tools/run_periodic_source_scan_queue.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_periodic_source_scan_queue.sh
          git commit -m "fix: run Source analysis as package module"
          git push origin "HEAD:${GITHUB_REF_NAME}"
