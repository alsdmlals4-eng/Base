name: Temporary Base314 Production Mutation v2

on:
  push:
    branches:
      - fix/base314-protected-directory-descendants-20260814
    paths:
      - .github/workflows/tmp-base314-production-mutation-v2.yml

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/base314-protected-directory-descendants-20260814
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned validation requirements
        run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Apply approved mutation and focused verification
        run: python tools/tmp_apply_base314_fix_v2.py
