name: Apply reviewed Source receipt follow-up fixes

on:
  push:
    branches:
      - fix/source-receipt-ledger-integrity-r2-20260902
    paths:
      - .github/workflows/apply-source-receipt-ledger-r2-review-fixes.yml

permissions:
  contents: write

jobs:
  red-green-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-receipt-ledger-integrity-r2-20260902
          fetch-depth: 0

      - name: Restore exact correction patch
        shell: bash
        run: |
          cat > /tmp/source-receipt-r2-correction.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/source-receipt-r2-correction.b64 > /tmp/source-receipt-r2-correction.patch.gz
          echo '634530ec93d67473f1f087bf0ebb94d143bb4a5c8b50e930f84a56bb52e37e12  /tmp/source-receipt-r2-correction.patch.gz' | sha256sum -c -
          gzip -dc /tmp/source-receipt-r2-correction.patch.gz > /tmp/source-receipt-r2-correction.patch

      - name: Prove new findings RED before implementation
        shell: bash
        run: |
          git apply --include=tests/test_periodic_source_receipt_state.py /tmp/source-receipt-r2-correction.patch
          set +e
          python -m unittest \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_rejects_future_contribution_merge_date \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_empty_bootstrap_does_not_unlock_ambiguous_same_day_material \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_unrelated_bootstrap_does_not_unlock_another_source_baseline \
            tests.test_periodic_source_receipt_state.PeriodicSourceReceiptStateTests.test_rejects_unrelated_receipt_time_classification \
            -v > /tmp/source-receipt-r2-review-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/source-receipt-r2-review-red.log
          test "$red_rc" -ne 0

      - name: Apply bounded implementation correction
        shell: bash
        run: |
          git apply --include=tools/periodic_source_receipt_state.py /tmp/source-receipt-r2-correction.patch

      - name: Prove GREEN and compatibility
        shell: bash
        run: |
          python -m py_compile \
            tools/periodic_source_receipt_state.py \
            tools/record_periodic_source_scan.py \
            tests/test_periodic_source_receipt_state.py \
            tests/test_record_periodic_source_scan.py
          python -m unittest \
            tests.test_periodic_source_receipt_state \
            tests.test_record_periodic_source_scan \
            tests.test_periodic_source_analysis_runner \
            tests.test_periodic_source_analysis_auto_merge \
            tests.test_periodic_source_scan_queue \
            -v
          git diff --check

      - name: Remove transport workflow and commit final four-file scope
        shell: bash
        run: |
          rm .github/workflows/apply-source-receipt-ledger-r2-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/periodic_source_receipt_state.py \
            tests/test_periodic_source_receipt_state.py \
            .github/workflows/apply-source-receipt-ledger-r2-review-fixes.yml
          git commit -m "fix: preserve Source receipt baseline identity"
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = "tests/test_periodic_source_receipt_state.py tests/test_record_periodic_source_scan.py tools/periodic_source_receipt_state.py tools/record_periodic_source_scan.py "
          git push origin HEAD:fix/source-receipt-ledger-integrity-r2-20260902
