name: Apply Project GDD Sheet Contract Once

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply_project_gdd_sheet_contract_once.py"
      - ".github/workflows/apply-project-gdd-sheet-contract-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-project-gdd-sheet-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'gpt/project-gdd-sheet-contract-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair transport escape and compile patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_project_gdd_sheet_contract_once.py")
          text = path.read_text(encoding="utf-8")
          broken = '        "→ Base Documentation Map",\\n        "\\n→ 프로젝트가 Sheet를 사용하면 `docs/PROJECT_GDD_GOOGLE_SHEETS_POLICY.md`",'
          fixed = '        "→ Base Documentation Map",\n        "\\n→ 프로젝트가 Sheet를 사용하면 `docs/PROJECT_GDD_GOOGLE_SHEETS_POLICY.md`",'
          if broken not in text:
              raise SystemExit("expected transport escape was not found")
          path.write_text(text.replace(broken, fixed, 1), encoding="utf-8")
          PY
          python -m py_compile tools/apply_project_gdd_sheet_contract_once.py
      - name: Apply contract-preserving patch
        run: python tools/apply_project_gdd_sheet_contract_once.py
      - name: Validate generated contract files
        shell: bash
        run: |
          python -m py_compile tests/test_project_gdd_google_sheets_contract.py
          python -m unittest tests.test_project_gdd_google_sheets_contract -v
          python -m unittest tests.test_bca_visual_sheet_workflow -v
          git diff --check
      - name: Commit generated changes
        shell: bash
        run: |
          git checkout -- tools/apply_project_gdd_sheet_contract_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md START_HERE.md docs skills templates tests .github/reference-freshness.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "docs: apply project GDD Sheets contract"
          git push origin HEAD:${{ github.head_ref }}
