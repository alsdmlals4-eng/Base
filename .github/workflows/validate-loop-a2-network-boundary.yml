name: Validate Loop A2 Denied Network Boundary

on:
  pull_request:
    paths:
      - 'tools/loop_a2_runtime/network_boundary.py'
      - 'tests/test_loop_a2_network_boundary.py'
      - 'docs/evidence/2026-08-14-loop-a2-network-boundary.md'
      - '.github/workflows/validate-loop-a2-network-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'tools/loop_a2_runtime/network_boundary.py'
      - 'tests/test_loop_a2_network_boundary.py'
      - 'docs/evidence/2026-08-14-loop-a2-network-boundary.md'
      - '.github/workflows/validate-loop-a2-network-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denied-network-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing validation requirements
        run: python -m pip install --disable-pip-version-check -r .github/validation-requirements.txt
      - name: Run boundary contract tests
        run: python -m unittest tests.test_loop_a2_network_boundary -v
      - name: Prove real unshare namespace has no host network interface
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          from tools.loop_a2_runtime.network_boundary import LinuxUnshareDeniedNetworkBoundary

          boundary = LinuxUnshareDeniedNetworkBoundary()
          env = {
              'PATH': os.environ['PATH'],
              'PYTHONIOENCODING': 'utf-8',
              'PYTHONUNBUFFERED': '1',
              'CI': '1',
          }
          plan = boundary.prepare(
              policy='DENIED',
              argv=(
                  sys.executable,
                  '-c',
                  "import json,socket; print(json.dumps(sorted(name for _,name in socket.if_nameindex())))",
              ),
              cwd=Path.cwd(),
              environment=env,
          )
          if plan is None:
              raise SystemExit('DENIED network namespace is not enforceable on this runner')
          completed = subprocess.run(
              plan.argv,
              cwd=Path.cwd(),
              env=dict(plan.environment),
              text=True,
              capture_output=True,
              timeout=10,
              check=False,
          )
          if completed.returncode != 0:
              raise SystemExit(f'wrapped child failed: {completed.returncode}: {completed.stderr[:300]}')
          if completed.stdout.strip() != '["lo"]':
              raise SystemExit(f'network namespace leaked host interfaces: {completed.stdout!r}')
          print('LINUX_UNSHARE_DENIED_V1: PASS')
          PY
      - name: Validate whitespace
        run: git diff --check
