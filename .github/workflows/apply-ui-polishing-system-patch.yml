name: Apply UI Polishing System Patch

on:
  push:
    branches:
      - gpt/ui-polishing-system-20260729
    paths:
      - "tools/apply_ui_polishing_system_patch.py"
      - ".github/workflows/apply-ui-polishing-system-patch.yml"

permissions:
  contents: write

concurrency:
  group: apply-ui-polishing-system-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: gpt/ui-polishing-system-20260729
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          python tools/apply_ui_polishing_system_patch.py --reviewed-commit "${GITHUB_SHA}"

      - name: Verify generated contract test
        run: |
          python -m unittest tests/test_game_ux_ui_system.py -v

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md \
            START_HERE.md \
            docs/OPERATING_MODEL.md \
            docs/DOCUMENTATION_MAP.md \
            skills/README.md \
            skills/SKILL_REGISTRY.json \
            skills/SKILL_LEARNING_LOG.md \
            skills/auditing-and-refining-ui-art \
            templates/planning/GAME_UX_UI_SYSTEM.md \
            templates/quality/GAME_UX_UI_REVIEW_CHECKLIST.md \
            .github/reference-freshness.json \
            .github/workflows/validate-game-ux-ui-system.yml
          git commit -m "feat: add evidence-based UI polishing pass"
          git push origin HEAD:gpt/ui-polishing-system-20260729
