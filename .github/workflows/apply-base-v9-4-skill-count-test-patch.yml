name: Apply Base v9.4 Skill Count Test Patch

on:
  pull_request:
    paths:
      - "tools/apply_base_v9_4_skill_count_test_patch.py"
      - ".github/workflows/apply-base-v9-4-skill-count-test-patch.yml"

permissions:
  contents: write

jobs:
  apply-test-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply Registry count test patch
        run: python tools/apply_base_v9_4_skill_count_test_patch.py
      - name: Commit exact test patch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Test already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_game_project_operating_system_structure.py
          git commit -m "test: remove fixed active Skill count"
          git push origin "HEAD:${HEAD_REF}"
