name: Validate Issue 443 RED GREEN

on:
  push:
    branches:
      - 'fix/real-a2-windows-utf8-blocked-receipt-20260816'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-executor-no-extra-deps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run full Local Executor suite without extra packages
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/loop-a2-local-executor/tests -p 'test_*.py' -v

  provider-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned validation requirements
        shell: bash
        run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Run subscription and Codex transport regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_loop_a2_windows_utf8_subprocess_capture \
            tests.test_loop_a2_subscription_gate \
            tests.test_loop_a2_codex_cli_transport \
            -v

  base-v9-and-gpo-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned validation requirements
        run: python -m pip install --requirement .github/validation-requirements.txt
      - name: Simulate final branch without temporary workflow
        run: rm .github/workflows/validate-issue-443-red-green.yml
      - name: Run Base v9 focused and adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_v9_machine_contracts \
            tests.test_v9_registry_generation \
            tests.test_v9_governance_documents \
            tests.test_v9_1_project_operating_contract \
            tests.test_v9_1_review_remediation \
            tests.test_v9_1_skill_pressure_contracts \
            tests.test_project_adapter_fleet_hardening \
            tests.test_project_adapter_fleet_rollout_status \
            tests.test_approved_protected_change_gate \
            tests.test_protected_path_descendant_matching \
            tests.test_loop_execution_capsule_contracts \
            tests.test_project_gdd_google_sheets_contract \
            tests.test_vertical_slice_v9_contract \
            tests.test_base_v9_4_ai_operations_contract \
            tests.test_base_v9_4_release_evidence_contract \
            tests.test_base_v9_4_trusted_evidence_record \
            tests.test_base_v9_4_1_compatibility_release \
            tests.test_base_v9_4_2_compatibility_release \
            tests.test_base_v9_4_3_compatibility_release \
            tests.test_higodot_single_authority_policy \
            tests.test_godot_addon_utilization_policy \
            tests.test_godot_higodot_gut_hera_toolchain \
            tests.test_base_shared_skill_routes \
            tests.test_neutral_adversarial_feature_lifecycle \
            -v
      - name: Run GPO contract and governance regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_ci_required_gate_topology.py
          python -m unittest \
            tests.test_documentation_governance \
            tests.test_controlled_vocabulary_contract \
            tests.test_skill_routing_governance \
            tests.test_consolidated_skill_references \
            tests.test_reference_freshness \
            tests.test_skill_package_integrity \
            tests.test_skill_system_coverage \
            tests.test_game_project_operating_system_structure \
            tests.test_base_change_proposals \
            tests.test_deep_interview_contract \
            tests.test_gpt_codex_workflow_contract \
            tests.test_ci_workflow_cost_policy \
            tests.test_ci_required_gate_topology \
            tests.test_ci_required_gate_evaluator \
            tests.test_publication_readiness \
            tests.test_local_validation \
            tests.test_repository_governance_baseline \
            -v
          python tools/check_skill_system_coverage.py
