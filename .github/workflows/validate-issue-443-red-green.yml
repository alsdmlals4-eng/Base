name: Validate Issue 443 RED GREEN

on:
  push:
    branches:
      - 'fix/real-a2-windows-utf8-blocked-receipt-20260816'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run Issue 443 regression
        shell: bash
        run: |
          set -euo pipefail
          python tools/loop-a2-local-executor/tests/test_windows_utf8_blocked_receipt_diagnostics.py -v
