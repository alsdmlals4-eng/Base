name: Temporary BCP-027 Closeout

on:
  push:
    branches:
      - feat/claim-intent-verification-gate-final
    paths:
      - ".github/workflows/tmp-close-claim-intent-bcp.yml"

permissions:
  contents: write

concurrency:
  group: temporary-bcp-027-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.actor == 'alsdmlals4-eng'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/claim-intent-verification-gate-final
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install contract dependencies
        run: python -m pip install -r requirements-publication.txt

      - name: Apply BCP lifecycle closeout
        run: python tools/tmp_close_claim_intent_bcp.py

      - name: Run lifecycle and focused regressions
        run: |
          python -m unittest \
            tests/test_base_change_proposals.py \
            tests/test_claim_and_intent_verification_contract.py \
            -v
          python tools/check_base_change_proposals.py

      - name: Remove temporary machinery and commit
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-close-claim-intent-bcp.yml
          rm tools/tmp_close_claim_intent_bcp.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No closeout changes were produced."
            exit 1
          fi
          git commit -m "docs: close BCP-027 implementation lifecycle"

      - name: Validate reference freshness on committed tree
        run: |
          BASE_SHA="$(git rev-parse origin/main)"
          python tools/check_canonical_reference_freshness.py \
            --config .github/reference-freshness.json \
            --base "$BASE_SHA" \
            --head HEAD
          git diff --check "$BASE_SHA...HEAD"

      - name: Push closeout tree
        run: git push origin HEAD:feat/claim-intent-verification-gate-final
