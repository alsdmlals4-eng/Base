name: Propagate prompt approval consumer route

on:
  push:
    branches:
      - work/prompt-approval-gate-20260903
    paths:
      - .github/workflows/propagate-prompt-approval-consumers.yml

permissions:
  contents: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Append one canonical route pointer to active consumers
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          paths = [
              Path("docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md"),
              Path("templates/planning/EXECUTION_SEQUENCE_PLAN.md"),
              Path("templates/project-operations/AI_WORKFLOW.md"),
              Path("templates/project-operations/PROJECT_START_HERE.md"),
              Path("templates/project-operations/.agents/skills/base-project-router/SKILL.md"),
              Path("templates/project-operations/PROJECT_WORK_ITEM_CHECKLIST.md"),
              Path("templates/project-operations/WORK_PROJECT_EXECUTION_CURRENT_ROUTER.md"),
              Path("templates/project-operations/WORK_PROJECT_START_CANON_CHECKLIST.md"),
              Path("templates/project-operations/WORK_CODEX_MINIMUM_TRANSITION_STARTER_PROMPT.md"),
          ]
          marker = "PROMPT_APPROVAL_EXECUTION_GATE_REQUIRED"
          section = textwrap.dedent(
              """
              ## Prompt approval execution gate

              `PROMPT_APPROVAL_EXECUTION_GATE_REQUIRED`: 새롭거나 의미가 바뀐 L1+ 작업은 기존 root receipt에 `templates/project-operations/PROMPT_APPROVAL_GATE_RECEIPT.json`의 `prompt_approval_gate` sibling을 구성하고, mutation·Codex handoff·외부 agent 위임 전에 `--phase prepare --expected-source-sha <fresh-read-source-sha> --render-markdown`을 실행한다. `prepare`는 exact contract와 digest를 보여 주지만 `EXECUTION AUTHORIZED: NO`다. 사용자가 그 exact contract를 확인한 뒤 `CONFIRMED` 또는 동일 digest의 `REUSED_APPROVAL`을 기록하고 기존 `--phase start` 또는 `--phase resume` 명령을 실행한다. read-only 조사, L0 기계 작업, 동일 validation 재실행, exact approved continuation은 중복 질문하지 않는다. 필드·권위·digest·material drift의 단일 owner는 `skills/managing-project-intake-and-work-contract/references/prompt-approval-execution-gate.md`다.
              """
          ).strip()

          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  continue
              if "validate_work_contract_receipt.py" not in text:
                  raise SystemExit(f"active validator consumer disappeared: {path}")
              path.write_text(text.rstrip() + "\n\n" + section + "\n", encoding="utf-8", newline="\n")
              changed.append(str(path))
          if not changed:
              raise SystemExit("no active consumer required propagation")
          print("updated consumers:")
          print("\n".join(changed))
          PY
      - name: Remove the one-shot workflow and push the bounded change
        run: |
          rm .github/workflows/propagate-prompt-approval-consumers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BASE_SHARED_SKILL_ADAPTER_CONTRACT.md templates .github/workflows/propagate-prompt-approval-consumers.yml
          git commit -m "docs: propagate prompt approval to active consumers"
          git push origin HEAD:${GITHUB_REF_NAME}
