name: Temporary Apply Release Registry Evolution

on:
  push:
    branches:
      - agent/implement-game-youtube-devlog-skill

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply historical Registry compatibility fix
        run: |
          base64 -d .tmp-youtube/release-registry-evolution.patch.xz.b64 > /tmp/release-registry-evolution.patch.xz
          xz -dc /tmp/release-registry-evolution.patch.xz > /tmp/release-registry-evolution.patch
          echo "78fe27aa698dfa248ca2ab275264a212c212c17570408ffd4fe06e3535a4172f  /tmp/release-registry-evolution.patch" | sha256sum -c -
          git apply --index /tmp/release-registry-evolution.patch
          git rm -r .tmp-youtube
          git rm .github/workflows/temporary-apply-release-registry-evolution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve historical Registry pins during current evolution"
          git push origin HEAD:agent/implement-game-youtube-devlog-skill
