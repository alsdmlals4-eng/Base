interface:
  display_name: "프로젝트 요청·결정 계약"
  short_description: "저장소 사실과 사용자 결정을 분리해 요청을 라우팅하고 실행 계약으로 확정합니다."
  default_prompt: "Use $managing-project-intake-and-work-contract to identify the user's goal and current stage, select the Work Mode and minimum matching Skills, inspect repository facts before asking questions, separate RECOMMENDED_DEFAULT from USER_DECISION_REQUIRED, use Grill Me one decision at a time for material conflicts, convert confirmed requirements into a lossless execution contract, decompose approved multi-step work by dependency when needed, and report the actual modes, evidence, unresolved items, and validation status."
