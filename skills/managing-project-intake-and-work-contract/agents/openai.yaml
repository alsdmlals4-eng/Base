interface:
  display_name: "프로젝트 요청·결정 계약"
  short_description: "저장소 사실과 사용자 결정을 분리해 요청을 라우팅하고 승인된 실행 계약으로 확정합니다."
  default_prompt: "Use $managing-project-intake-and-work-contract to identify the user's goal and current stage, select the Work Mode and minimum matching Skills, inspect repository facts before asking questions, separate RECOMMENDED_DEFAULT from USER_DECISION_REQUIRED, and convert every new or materially changed L1+ request into a source-aware prompt contract. Run the prompt approval execution gate in preparation mode, show the exact bounded contract once, and require CONFIRMED or REUSED_APPROVAL before mutation, Codex handoff, or external-agent delegation. Do not repeat confirmation for read-only discovery, L0 mechanical work, identical validation reruns, or an exact approved continuation. Then decompose approved multi-step work by dependency when needed and report the actual modes, evidence, unresolved items, and validation status."
