[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aseprite-local-bridge"
version = "0.1.0"
description = "Bounded local bridge from Codex to the official Aseprite CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
aseprite-local-bridge = "aseprite_local_bridge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
