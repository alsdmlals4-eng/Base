[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expression-studio"
version = "0.1.0"
description = "Local, fail-closed character-expression review and handoff tool"
requires-python = ">=3.10"
dependencies = [
  "base-tool-contracts>=0.1,<0.2",
  "fastapi>=0.115,<1",
  "openai==3.0.0",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "python-multipart==0.0.32",
  "uvicorn>=0.30,<1",
  "socksio>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
