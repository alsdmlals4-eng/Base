[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-native-file-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
notion-native-file-bridge = "notion_native_file_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
