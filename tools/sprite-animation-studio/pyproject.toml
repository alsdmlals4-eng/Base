[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-animation-studio"
version = "0.1.0"
description = "Local, fail-closed sprite animation curation and export tool"
requires-python = ">=3.10"
dependencies = [
  "base-tool-contracts>=0.1,<0.2",
  "fastapi>=0.115,<1",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.22,<5", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
