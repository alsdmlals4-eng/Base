[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-tool-hub"
version = "0.1.0"
description = "Reviewed localhost launcher for Base interactive tools"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "jsonschema>=4.22,<5", "pydantic>=2.7,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
