[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-evidence-studio"
version = "0.1.0"
description = "PC-first developer QA evidence capture for Base projects"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "python-multipart==0.0.32",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pillow>=10,<12", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
