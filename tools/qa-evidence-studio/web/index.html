<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Evidence Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">BASE · PC-FIRST REVIEW</p>
      <h1>QA Evidence Studio</h1>
      <p>자동 검사가 놓치는 실제 화면과 조작 경험을, 정확한 빌드와 증거에 묶어 기록합니다.</p>
    </header>

    <section class="notice-grid" aria-label="이번 단계의 검증 경계">
      <article><strong>검토자</strong><span>개발자 본인 1명</span></article>
      <article id="android-status"><strong>Android</strong><span>PC 구현 완료 후 출시 준비 직전까지 연결 보류</span></article>
      <article><strong>실제 검증 시작</strong><span>이미지와 UX 배치를 완료한 뒤</span></article>
    </section>

    <section class="panel">
      <h2>1. PC 검토 세션 준비</h2>
      <form id="session-form">
        <label>검토 제목<input id="title" required maxlength="160" value="이미지·UX PC 검토"></label>
        <label>검토할 Git 커밋<input id="build-commit" required pattern="[0-9a-f]{40}" placeholder="40자리 커밋 SHA"></label>
        <label>체크 항목<textarea id="checklist" rows="5">visual-readability|이미지와 텍스트 가독성
layout-integrity|해상도별 UI 배치
keyboard-flow|키보드 조작 흐름
gamepad-flow|게임패드 조작 흐름</textarea></label>
        <button type="submit">세션 만들기</button>
      </form>
    </section>

    <section class="panel" id="readiness-gate" hidden>
      <h2>2. 이미지·UX 배치 완료 확인</h2>
      <p>계획된 이미지와 UX 요소가 현재 PC 빌드에 실제로 배치되기 전에는 PASS 기록이 열리지 않습니다.</p>
      <label>개발자 확인 문구<textarea id="acknowledgement" rows="3">현재 PC 빌드에 계획된 이미지와 UX 요소를 배치했음을 확인합니다.</textarea></label>
      <button id="ready-button">실제 PC 검토 시작</button>
    </section>

    <section class="panel" id="review-workspace" hidden>
      <h2>3. 개발자 PC 검토</h2>
      <div id="checklist-results"></div>
      <label>화면 증거<input id="evidence-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <button id="upload-button">이미지 증거 추가</button>
      <button id="finalize-button" class="primary">증거 패킷 확정</button>
    </section>

    <output id="status" role="status">프로젝트 설정을 불러오는 중입니다.</output>
  </main>
  <script src="app.js"></script>
</body>
</html>
